<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Builder — mocksheets</title>
  <link rel="icon" type="image/png" href="/images/brand/logo-128x128.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12/dist/style.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xyflow/react@12/dist/umd/index.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #16161e;
      --surface-2: #1e1e2e;
      --border: #2a2a3a;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,.12);
      --text: #e8e8f0;
      --muted: #6b6b82;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }

    /* ── Top bar ── */
    .wf-topbar {
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .wf-logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--text); text-decoration: none; }
    .wf-logo img { width: 22px; height: 22px; object-fit: contain; }
    .wf-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .wf-name-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      color: var(--text);
      font-size: 13px;
      width: 200px;
      outline: none;
    }
    .wf-name-input:focus { border-color: var(--accent); }
    .wf-spacer { flex: 1; }
    .wf-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
    }
    .wf-btn:hover { border-color: var(--accent); color: var(--accent); }
    .wf-btn-primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .wf-btn-primary:hover { background: #00bbdd; border-color: #00bbdd; color: #000; }
    .wf-btn-run { background: #16a34a; border-color: #16a34a; color: #fff; }
    .wf-btn-run:hover { background: #15803d; border-color: #15803d; color: #fff; }
    .wf-enabled-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid;
    }
    .wf-enabled-badge.on { background: rgba(34,197,94,.15); border-color: #22c55e; color: #22c55e; }
    .wf-enabled-badge.off { background: rgba(107,107,130,.1); border-color: var(--muted); color: var(--muted); }

    /* ── Layout ── */
    .wf-layout {
      display: flex;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    /* ── Left panel ── */
    .wf-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .wf-sidebar-section {
      padding: 12px 14px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }
    .wf-int-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      cursor: grab;
      border-radius: 0;
      transition: background .12s;
      user-select: none;
    }
    .wf-int-item:hover { background: var(--surface-2); }
    .wf-int-icon {
      width: 28px; height: 28px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .wf-int-label { font-size: 12px; font-weight: 500; color: var(--text); }
    .wf-int-type { font-size: 10px; color: var(--muted); }

    /* ── Canvas ── */
    .wf-canvas {
      flex: 1;
      position: relative;
      background: var(--bg);
    }

    /* React Flow overrides */
    .react-flow__background { background: var(--bg); }
    .react-flow__minimap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .react-flow__controls { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .react-flow__controls button { background: transparent; border: none; color: var(--text); }
    .react-flow__controls button:hover { background: var(--surface-2); }
    .react-flow__edge path { stroke: var(--accent); stroke-width: 1.5; }
    .react-flow__edge.selected path { stroke: var(--accent); }
    .react-flow__connection path { stroke: var(--accent); stroke-dasharray: 5; }

    /* ── Custom Node ── */
    .wf-node {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 160px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .wf-node:hover { border-color: var(--accent); }
    .wf-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .wf-node-head { display: flex; align-items: center; gap: 8px; }
    .wf-node-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .wf-node-title { font-size: 12px; font-weight: 600; color: var(--text); }
    .wf-node-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .wf-node-status {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-left: auto;
      flex-shrink: 0;
    }
    .wf-node-status.running { background: var(--warning); }
    .wf-node-status.done { background: var(--success); }
    .wf-node-status.error { background: var(--danger); }
    .wf-node-status.idle { background: var(--muted); }

    /* ── Right panel ── */
    .wf-settings {
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .wf-settings-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wf-settings-title { font-size: 13px; font-weight: 600; }
    .wf-settings-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
    }
    .wf-settings-close:hover { color: var(--text); }
    .wf-field { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .wf-field-label { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .wf-input, .wf-select, .wf-textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    .wf-input:focus, .wf-select:focus, .wf-textarea:focus { border-color: var(--accent); }
    .wf-select option { background: var(--surface-2); }
    .wf-textarea { resize: vertical; min-height: 70px; }
    .wf-settings-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* ── Workflow List Modal ── */
    .wf-list-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    .wf-list-overlay.open { display: flex; }
    .wf-list-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 560px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .wf-list-modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wf-list-modal-title { font-size: 15px; font-weight: 600; }
    .wf-list-modal-body { overflow-y: auto; padding: 12px; }
    .wf-list-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color .12s;
    }
    .wf-list-card:hover { border-color: var(--accent); }
    .wf-list-card-name { font-size: 13px; font-weight: 500; flex: 1; }
    .wf-list-card-meta { font-size: 11px; color: var(--muted); }
    .wf-toggle {
      position: relative;
      width: 34px; height: 18px;
      flex-shrink: 0;
    }
    .wf-toggle input { opacity: 0; width: 0; height: 0; }
    .wf-toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--border);
      border-radius: 18px;
      transition: .2s;
    }
    .wf-toggle-slider:before {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
    }
    .wf-toggle input:checked + .wf-toggle-slider { background: var(--accent); }
    .wf-toggle input:checked + .wf-toggle-slider:before { transform: translateX(16px); }
    .wf-list-card-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }
    .wf-list-card-del:hover { color: var(--danger); }
    .wf-list-empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── Drop hint ── */
    .wf-drop-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      color: var(--muted);
      pointer-events: none;
      user-select: none;
    }
    .wf-drop-hint-icon { font-size: 36px; margin-bottom: 10px; opacity: .4; }
    .wf-drop-hint-text { font-size: 13px; line-height: 1.6; }

    /* ── Toast ── */
    #wf-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text);
      transition: transform .25s ease;
      z-index: 200;
      pointer-events: none;
    }
    #wf-toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .wf-sidebar { display: none; }
      .wf-settings { display: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<div id="wf-toast"></div>

<script>
  const API = location.hostname === 'localhost' ? 'http://localhost:3001' : 'https://upsheet-ai.onrender.com';
  function authHeaders() {
    const token = localStorage.getItem('sb-token') || localStorage.getItem('supabase_token');
    return token
      ? { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }
      : { 'Content-Type': 'application/json' };
  }
  function wfToast(msg, ms = 2800) {
    const el = document.getElementById('wf-toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), ms);
  }
</script>

<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;

const {
  ReactFlow,
  ReactFlowProvider,
  addEdge,
  useNodesState,
  useEdgesState,
  Controls,
  MiniMap,
  Background,
  BackgroundVariant,
  Handle,
  Position,
  useReactFlow,
} = ReactFlowLib;

// ── Integration definitions ─────────────────────────────────────────────────
const INTEGRATIONS = [
  { id: 'trigger_schedule', label: 'Zamanlama',   icon: 'ti-clock',              color: '#6366f1', type: 'trigger' },
  { id: 'trigger_webhook',  label: 'Webhook',     icon: 'ti-webhook',            color: '#8b5cf6', type: 'trigger' },
  { id: 'google_sheets',    label: 'G. Sheets',   icon: 'ti-table',              color: '#22c55e', type: 'action' },
  { id: 'slack',            label: 'Slack',       icon: 'ti-brand-slack',        color: '#f59e0b', type: 'action' },
  { id: 'gmail',            label: 'Gmail',       icon: 'ti-mail',               color: '#ef4444', type: 'action' },
  { id: 'shopify',          label: 'Shopify',     icon: 'ti-shopping-cart',      color: '#10b981', type: 'action' },
  { id: 'hubspot',          label: 'HubSpot',     icon: 'ti-chart-bar',          color: '#f97316', type: 'action' },
  { id: 'mocksheets_ai',    label: 'AI Analiz',   icon: 'ti-brain',              color: '#a855f7', type: 'action' },
  { id: 'google_drive',     label: 'G. Drive',    icon: 'ti-brand-google-drive', color: '#3b82f6', type: 'action' },
  { id: 'http_request',     label: 'HTTP',        icon: 'ti-http-connect',       color: '#64748b', type: 'action' },
  { id: 'if_condition',     label: 'Koşul',       icon: 'ti-git-branch',         color: '#ec4899', type: 'action' },
];

function getIntegration(id) {
  return INTEGRATIONS.find(i => i.id === id) || { id, label: id, icon: 'ti-plug', color: '#6b6b82', type: 'action' };
}

// ── Custom Node ─────────────────────────────────────────────────────────────
function WorkflowNode({ data, selected }) {
  const intg = getIntegration(data.integrationId);
  const statusClass = data.status || 'idle';
  return (
    <div className={`wf-node${selected ? ' selected' : ''}`}>
      {intg.type !== 'trigger' && (
        <Handle type="target" position={Position.Top} style={{ background: 'var(--accent)', width: 8, height: 8, border: '2px solid var(--bg)' }} />
      )}
      <div className="wf-node-head">
        <div className="wf-node-icon" style={{ background: intg.color + '22', color: intg.color }}>
          <i className={`ti ${intg.icon}`} />
        </div>
        <div>
          <div className="wf-node-title">{data.label || intg.label}</div>
          <div className="wf-node-sub">{intg.type === 'trigger' ? 'Tetikleyici' : 'Aksiyon'}</div>
        </div>
        <span className={`wf-node-status ${statusClass}`} />
      </div>
      <Handle type="source" position={Position.Bottom} style={{ background: 'var(--accent)', width: 8, height: 8, border: '2px solid var(--bg)' }} />
    </div>
  );
}

const nodeTypes = { workflowNode: WorkflowNode };

// ── Node Config Panel ────────────────────────────────────────────────────────
function NodePanel({ node, onUpdate, onClose }) {
  if (!node) return (
    <div className="wf-settings">
      <div className="wf-settings-empty">
        <i className="ti ti-click" style={{ fontSize: 28, opacity: .4, display: 'block', marginBottom: 10 }} />
        Bir node'a tıklayarak konfigüre edin
      </div>
    </div>
  );

  const intg = getIntegration(node.data.integrationId);
  const cfg = node.data.config || {};

  function update(key, val) {
    onUpdate(node.id, { ...node.data, config: { ...cfg, [key]: val } });
  }

  return (
    <div className="wf-settings">
      <div className="wf-settings-header">
        <div className="wf-node-icon" style={{ background: intg.color + '22', color: intg.color, width: 28, height: 28, borderRadius: 7, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <i className={`ti ${intg.icon}`} style={{ fontSize: 13 }} />
        </div>
        <span className="wf-settings-title">{intg.label}</span>
        <button className="wf-settings-close" onClick={onClose}>×</button>
      </div>

      {intg.id === 'trigger_schedule' && (
        <div className="wf-field">
          <div className="wf-field-label">Cron İfadesi</div>
          <input className="wf-input" placeholder="0 9 * * 1-5" value={cfg.cron || ''} onChange={e => update('cron', e.target.value)} />
          <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 5 }}>Örn: <code style={{ color: 'var(--accent)' }}>0 9 * * 1-5</code> (hafta içi 09:00)</div>
        </div>
      )}

      {intg.id === 'trigger_webhook' && (
        <div className="wf-field">
          <div className="wf-field-label">Webhook URL</div>
          <input className="wf-input" readOnly value={`${API}/api/webhooks/workflow/${node.id}`} style={{ fontSize: 11, opacity: .7 }} />
          <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 5 }}>Bu URL'e POST isteği gönderin</div>
        </div>
      )}

      {intg.id === 'google_sheets' && (<>
        <div className="wf-field">
          <div className="wf-field-label">İşlem</div>
          <select className="wf-select" value={cfg.operation || 'read'} onChange={e => update('operation', e.target.value)}>
            <option value="read">Satır oku</option>
            <option value="append">Satır ekle</option>
            <option value="update">Satır güncelle</option>
          </select>
        </div>
        <div className="wf-field">
          <div className="wf-field-label">Spreadsheet ID</div>
          <input className="wf-input" placeholder="1BxiMVs0..." value={cfg.spreadsheetId || ''} onChange={e => update('spreadsheetId', e.target.value)} />
        </div>
        <div className="wf-field">
          <div className="wf-field-label">Sayfa Adı</div>
          <input className="wf-input" placeholder="Sheet1" value={cfg.sheetName || ''} onChange={e => update('sheetName', e.target.value)} />
        </div>
      </>)}

      {intg.id === 'slack' && (<>
        <div className="wf-field">
          <div className="wf-field-label">Kanal</div>
          <input className="wf-input" placeholder="#genel" value={cfg.channel || ''} onChange={e => update('channel', e.target.value)} />
        </div>
        <div className="wf-field">
          <div className="wf-field-label">Mesaj</div>
          <textarea className="wf-textarea" placeholder="Gönderilecek mesaj..." value={cfg.message || ''} onChange={e => update('message', e.target.value)} />
        </div>
      </>)}

      {intg.id === 'gmail' && (<>
        <div className="wf-field">
          <div className="wf-field-label">Alıcı</div>
          <input className="wf-input" type="email" placeholder="ornek@gmail.com" value={cfg.to || ''} onChange={e => update('to', e.target.value)} />
        </div>
        <div className="wf-field">
          <div className="wf-field-label">Konu</div>
          <input className="wf-input" placeholder="E-posta konusu" value={cfg.subject || ''} onChange={e => update('subject', e.target.value)} />
        </div>
        <div className="wf-field">
          <div className="wf-field-label">İçerik</div>
          <textarea className="wf-textarea" placeholder="E-posta içeriği..." value={cfg.body || ''} onChange={e => update('body', e.target.value)} />
        </div>
      </>)}

      {intg.id === 'http_request' && (<>
        <div className="wf-field">
          <div className="wf-field-label">Method</div>
          <select className="wf-select" value={cfg.method || 'GET'} onChange={e => update('method', e.target.value)}>
            <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
          </select>
        </div>
        <div className="wf-field">
          <div className="wf-field-label">URL</div>
          <input className="wf-input" placeholder="https://api.example.com/data" value={cfg.url || ''} onChange={e => update('url', e.target.value)} />
        </div>
        <div className="wf-field">
          <div className="wf-field-label">Body (JSON)</div>
          <textarea className="wf-textarea" placeholder='{"key": "value"}' value={cfg.body || ''} onChange={e => update('body', e.target.value)} />
        </div>
      </>)}

      {intg.id === 'mocksheets_ai' && (<>
        <div className="wf-field">
          <div className="wf-field-label">Komut</div>
          <textarea className="wf-textarea" placeholder="Tabloyu analiz et ve özet çıkar..." value={cfg.prompt || ''} onChange={e => update('prompt', e.target.value)} />
        </div>
      </>)}

      {intg.id === 'if_condition' && (<>
        <div className="wf-field">
          <div className="wf-field-label">Koşul</div>
          <input className="wf-input" placeholder="{{data.value}} > 100" value={cfg.condition || ''} onChange={e => update('condition', e.target.value)} />
        </div>
      </>)}

      {(intg.id === 'shopify' || intg.id === 'hubspot' || intg.id === 'google_drive') && (
        <div className="wf-field">
          <div className="wf-field-label">İşlem</div>
          <select className="wf-select" value={cfg.operation || ''} onChange={e => update('operation', e.target.value)}>
            <option value="">Seçin...</option>
            <option value="get">Al</option>
            <option value="create">Oluştur</option>
            <option value="update">Güncelle</option>
            <option value="list">Listele</option>
          </select>
        </div>
      )}

      <div className="wf-field">
        <div className="wf-field-label">Not</div>
        <input className="wf-input" placeholder="İsteğe bağlı açıklama" value={cfg.note || ''} onChange={e => update('note', e.target.value)} />
      </div>
    </div>
  );
}

// ── Workflow List Modal ──────────────────────────────────────────────────────
function WorkflowListModal({ open, onClose, onSelect, onNew }) {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!open) return;
    setLoading(true);
    fetch(API + '/api/workflows', { headers: authHeaders() })
      .then(r => r.json())
      .then(d => setList(d.workflows || []))
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [open]);

  async function toggle(wf, e) {
    e.stopPropagation();
    const r = await fetch(`${API}/api/workflows/${wf.id}/toggle`, { method: 'POST', headers: authHeaders() });
    const d = await r.json();
    setList(prev => prev.map(x => x.id === wf.id ? { ...x, enabled: d.enabled } : x));
  }

  async function del(wf, e) {
    e.stopPropagation();
    if (!confirm(`"${wf.name}" silinsin mi?`)) return;
    await fetch(`${API}/api/workflows/${wf.id}`, { method: 'DELETE', headers: authHeaders() });
    setList(prev => prev.filter(x => x.id !== wf.id));
  }

  if (!open) return null;
  return (
    <div className="wf-list-overlay open" onClick={onClose}>
      <div className="wf-list-modal" onClick={e => e.stopPropagation()}>
        <div className="wf-list-modal-header">
          <span className="wf-list-modal-title">Tüm Workflow'lar</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="wf-btn wf-btn-primary" onClick={onNew} style={{ fontSize: 12, padding: '5px 12px' }}>
              <i className="ti ti-plus" /> Yeni
            </button>
            <button className="wf-btn" onClick={onClose} style={{ padding: '5px 12px' }}>Kapat</button>
          </div>
        </div>
        <div className="wf-list-modal-body">
          {loading && <div className="wf-list-empty">Yükleniyor...</div>}
          {!loading && list.length === 0 && <div className="wf-list-empty">Henüz workflow yok. Yeni oluşturun.</div>}
          {list.map(wf => (
            <div className="wf-list-card" key={wf.id} onClick={() => { onSelect(wf); onClose(); }}>
              <div>
                <div className="wf-list-card-name">{wf.name}</div>
                <div className="wf-list-card-meta">
                  {wf.run_count || 0} çalışma
                  {wf.last_run ? ` · Son: ${new Date(wf.last_run).toLocaleDateString('tr')}` : ''}
                </div>
              </div>
              <label className="wf-toggle" onClick={e => e.stopPropagation()}>
                <input type="checkbox" checked={!!wf.enabled} onChange={e => toggle(wf, e)} />
                <span className="wf-toggle-slider" />
              </label>
              <button className="wf-list-card-del" onClick={e => del(wf, e)} title="Sil">
                <i className="ti ti-trash" />
              </button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────────────
let _nodeIdCounter = 1;
function nextNodeId() { return `node_${_nodeIdCounter++}`; }

function FlowEditor({ wfId, setWfId, wfName, setWfName, wfEnabled, setWfEnabled }) {
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [selectedNode, setSelectedNode] = useState(null);
  const [listOpen, setListOpen] = useState(false);
  const reactFlowWrapper = useRef(null);
  const { screenToFlowPosition } = useReactFlow();

  const onConnect = useCallback(
    (params) => setEdges(eds => addEdge({ ...params, animated: true, style: { stroke: 'var(--accent)' } }, eds)),
    [setEdges]
  );

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function onDrop(e) {
    e.preventDefault();
    const intgId = e.dataTransfer.getData('application/wf-integration');
    if (!intgId) return;
    const intg = getIntegration(intgId);
    const position = screenToFlowPosition({ x: e.clientX, y: e.clientY });
    const id = nextNodeId();
    setNodes(nds => [...nds, {
      id,
      type: 'workflowNode',
      position,
      data: { integrationId: intgId, label: intg.label, config: {}, status: 'idle' },
    }]);
  }

  function onNodeClick(_, node) {
    setSelectedNode(node);
  }

  function onPaneClick() {
    setSelectedNode(null);
  }

  function updateNodeData(nodeId, newData) {
    setNodes(nds => nds.map(n => n.id === nodeId ? { ...n, data: newData } : n));
    setSelectedNode(prev => prev?.id === nodeId ? { ...prev, data: newData } : prev);
  }

  async function saveWorkflow() {
    const body = { name: wfName, nodes, edges };
    const url = wfId ? `${API}/api/workflows/${wfId}` : `${API}/api/workflows`;
    const method = wfId ? 'PUT' : 'POST';
    const r = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(body) });
    if (!r.ok) { wfToast('Kaydetme başarısız'); return; }
    const d = await r.json();
    if (!wfId) setWfId(d.id);
    wfToast('Workflow kaydedildi');
  }

  async function runWorkflow() {
    if (!wfId) { wfToast('Önce kaydedin'); return; }
    const r = await fetch(`${API}/api/workflows/${wfId}/run`, { method: 'POST', headers: authHeaders() });
    if (!r.ok) { wfToast('Çalıştırma başarısız'); return; }
    wfToast('Workflow başlatıldı');
    setNodes(nds => nds.map(n => ({ ...n, data: { ...n.data, status: 'running' } })));
    setTimeout(() => setNodes(nds => nds.map(n => ({ ...n, data: { ...n.data, status: 'done' } }))), 2000);
  }

  function loadWorkflow(wf) {
    setWfId(wf.id);
    setWfName(wf.name);
    setWfEnabled(wf.enabled);
    setNodes(wf.nodes || []);
    setEdges(wf.edges || []);
    setSelectedNode(null);
  }

  function newWorkflow() {
    setWfId(null);
    setWfName('Yeni Workflow');
    setWfEnabled(false);
    setNodes([]);
    setEdges([]);
    setSelectedNode(null);
  }

  // Keep selected node in sync when nodes change
  useEffect(() => {
    if (!selectedNode) return;
    const updated = nodes.find(n => n.id === selectedNode.id);
    if (updated) setSelectedNode(updated);
  }, [nodes]);

  return (
    <>
      {/* Top bar */}
      <div className="wf-topbar">
        <a href="/app.html" className="wf-logo">
          <img src="/images/brand/logo-128x128.png" alt="mocksheets" />
          <span>mocksheets</span>
        </a>
        <div className="wf-sep" />
        <input
          className="wf-name-input"
          value={wfName}
          onChange={e => setWfName(e.target.value)}
          placeholder="Workflow adı..."
        />
        <span className={`wf-enabled-badge ${wfEnabled ? 'on' : 'off'}`}>
          {wfEnabled ? 'Aktif' : 'Pasif'}
        </span>
        <div className="wf-spacer" />
        <button className="wf-btn" onClick={() => setListOpen(true)}>
          <i className="ti ti-layout-list" />
          Tüm Workflow'lar
        </button>
        <button className="wf-btn" onClick={newWorkflow}>
          <i className="ti ti-plus" />
          Yeni
        </button>
        <button className="wf-btn wf-btn-primary" onClick={saveWorkflow}>
          <i className="ti ti-device-floppy" />
          Kaydet
        </button>
        <button className="wf-btn wf-btn-run" onClick={runWorkflow}>
          <i className="ti ti-player-play" />
          Çalıştır
        </button>
      </div>

      <div className="wf-layout">
        {/* Left sidebar */}
        <div className="wf-sidebar">
          <div className="wf-sidebar-section">Tetikleyiciler</div>
          {INTEGRATIONS.filter(i => i.type === 'trigger').map(intg => (
            <div
              key={intg.id}
              className="wf-int-item"
              draggable
              onDragStart={e => e.dataTransfer.setData('application/wf-integration', intg.id)}
            >
              <div className="wf-int-icon" style={{ background: intg.color + '22', color: intg.color }}>
                <i className={`ti ${intg.icon}`} />
              </div>
              <div>
                <div className="wf-int-label">{intg.label}</div>
                <div className="wf-int-type">Tetikleyici</div>
              </div>
            </div>
          ))}
          <div className="wf-sidebar-section" style={{ marginTop: 8 }}>Aksiyonlar</div>
          {INTEGRATIONS.filter(i => i.type === 'action').map(intg => (
            <div
              key={intg.id}
              className="wf-int-item"
              draggable
              onDragStart={e => e.dataTransfer.setData('application/wf-integration', intg.id)}
            >
              <div className="wf-int-icon" style={{ background: intg.color + '22', color: intg.color }}>
                <i className={`ti ${intg.icon}`} />
              </div>
              <div>
                <div className="wf-int-label">{intg.label}</div>
                <div className="wf-int-type">Aksiyon</div>
              </div>
            </div>
          ))}
        </div>

        {/* Canvas */}
        <div className="wf-canvas" ref={reactFlowWrapper}>
          {nodes.length === 0 && (
            <div className="wf-drop-hint">
              <div className="wf-drop-hint-icon"><i className="ti ti-arrows-move" /></div>
              <div className="wf-drop-hint-text">
                Soldan bir entegrasyon sürükleyin<br />ve kanvasa bırakın
              </div>
            </div>
          )}
          <ReactFlow
            nodes={nodes}
            edges={edges}
            onNodesChange={onNodesChange}
            onEdgesChange={onEdgesChange}
            onConnect={onConnect}
            onDrop={onDrop}
            onDragOver={onDragOver}
            onNodeClick={onNodeClick}
            onPaneClick={onPaneClick}
            nodeTypes={nodeTypes}
            fitView
            colorMode="dark"
          >
            <Controls />
            <MiniMap nodeColor={n => getIntegration(n.data?.integrationId)?.color || '#6b6b82'} />
            <Background variant={BackgroundVariant.Dots} gap={20} size={1} color="#2a2a3a" />
          </ReactFlow>
        </div>

        {/* Right panel */}
        <NodePanel
          node={selectedNode}
          onUpdate={updateNodeData}
          onClose={() => setSelectedNode(null)}
        />
      </div>

      <WorkflowListModal
        open={listOpen}
        onClose={() => setListOpen(false)}
        onSelect={loadWorkflow}
        onNew={() => { newWorkflow(); setListOpen(false); }}
      />
    </>
  );
}

function App() {
  const [wfId, setWfId] = useState(null);
  const [wfName, setWfName] = useState('Yeni Workflow');
  const [wfEnabled, setWfEnabled] = useState(false);

  return (
    <ReactFlowProvider>
      <FlowEditor
        wfId={wfId} setWfId={setWfId}
        wfName={wfName} setWfName={setWfName}
        wfEnabled={wfEnabled} setWfEnabled={setWfEnabled}
      />
    </ReactFlowProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
