<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mocksheets — Çevrimdışı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='%236B35CF'/><stop offset='1' stop-color='%232B80FF'/></linearGradient></defs><rect width='32' height='32' rx='4' fill='white'/><text x='1' y='27' font-family='Arial Rounded MT Bold,Arial,sans-serif' font-weight='900' font-size='28' fill='url(%23g)'>m</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    color: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 400px;
  }
  .icon {
    font-size: 56px;
    margin-bottom: 24px;
    display: block;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #f97316;
    margin-bottom: 12px;
  }
  p {
    font-size: 15px;
    color: #a1a1aa;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    background: #f97316;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #ea6c0a; }
</style>
</head>
<body>
  <div class="card">
    <span class="icon">📶</span>
    <h1>⚡ ExcelAI — Çevrimdışısınız</h1>
    <p>İnternet bağlantınız yok.<br>Bağlandığınızda otomatik devam edecek.</p>
    <button class="btn" onclick="window.location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
