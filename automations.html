<style>
:root {
  --bg:#fafafa;--surface:#FFFFFF;--surface-2:#f4f4f5;--surface-3:#e4e4e7;
  --line:rgba(31,30,28,0.08);--line-2:rgba(31,30,28,0.13);
  --ink:#09090b;--ink-2:#3f3f46;--muted:#71717a;--muted-2:#a1a1aa;
  --accent:#16a34a;--accent-2:#15803d;--accent-soft:#f0fdf4;--accent-line:#bbf7d0;
  --green:#0F9D58;--green-soft:#E4F5EC;
  --amber:#B45309;--amber-soft:#FDF3E1;--amber-line:#fde68a;
  --rose:#E11D48;--rose-soft:#FCE7EE;--rose-line:#fecdd3;
  --blue:#2563EB;--blue-soft:#EFF6FF;--blue-line:#bfdbfe;
  --radius:16px;--radius-lg:22px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 20px 60px -30px #0e0e1033,0 4px 16px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg:#000000;--surface:#111111;--surface-2:#1a1a1a;--surface-3:#222222;
  --line:rgba(255,255,255,0.1);--line-2:rgba(255,255,255,0.16);
  --ink:#ffffff;--ink-2:#bbbbbb;--muted:#999999;--muted-2:#666666;
  --accent:#22c55e;--accent-2:#16a34a;--accent-soft:rgba(34,197,94,0.12);--accent-line:rgba(34,197,94,0.25);
  --green-soft:rgba(34,197,94,0.12);--amber-soft:rgba(251,146,60,0.12);--amber-line:rgba(251,146,60,0.25);
  --rose-soft:rgba(239,68,68,0.12);--rose-line:rgba(239,68,68,0.25);
  --blue-soft:rgba(56,189,248,0.12);--blue-line:rgba(56,189,248,0.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ── NAV ── */
#nav{background:transparent;border-bottom:none;display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:200;height:64px}
.nav-inner{display:flex;align-items:center;gap:0;width:100%;max-width:1100px;margin:0 auto;background:rgba(246,244,238,0.72);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border:1px solid var(--line-2);border-radius:999px;padding:5px 8px 5px 14px}
[data-theme="dark"] .nav-inner{background:rgba(0,0,0,0.85);border-color:rgba(255,255,255,0.12)}
.nav-back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:999px;transition:background .15s,color .15s;margin-right:2px;border:none;background:none}
.nav-back:hover{background:rgba(31,30,28,0.06);color:var(--ink)}
.nav-sep{width:1px;height:20px;background:var(--line-2);margin:0 8px}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.nav-brand .brand-mark{width:24px;height:24px;border-radius:6px;background:#0E0E10;position:relative;flex-shrink:0;}
.nav-brand .brand-mark::before{content:"";position:absolute;inset:5px;background:linear-gradient(90deg,transparent 49%,rgba(255,255,255,.55) 49%,rgba(255,255,255,.55) 51%,transparent 51%),linear-gradient(0deg,transparent 49%,rgba(255,255,255,.55) 49%,rgba(255,255,255,.55) 51%,transparent 51%);border:1px solid rgba(255,255,255,.7);border-radius:2px;}
.nav-brand .brand-mark::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid transparent;}
.nav-brand .brand-dot{color:#16a34a;}
.nav-logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.nav-page{color:var(--muted);font-size:13px;font-weight:500;margin-left:4px}
.nav-title{font-size:13.5px;font-weight:600;color:var(--ink)}
.nav-spacer{flex:1}
.nav-btn{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:13.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.nav-btn:hover{background:rgba(31,30,28,0.06);color:var(--ink)}
.nav-btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.nav-btn-primary:hover{background:var(--accent-2);border-color:transparent;transform:translateY(-1px);box-shadow:0 8px 24px -8px rgba(22,163,74,0.45)}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--accent-line);flex-shrink:0;cursor:pointer}

/* ── MAIN ── */
#main{max-width:1100px;margin:0 auto;padding:32px 20px 80px}

/* ── HERO ── */
#hero{margin-bottom:32px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-left h1{font-size:24px;font-weight:800;color:var(--ink);margin-bottom:6px}
.hero-left p{font-size:14px;color:var(--muted);max-width:480px;line-height:1.6}
.hero-stats{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:500;color:var(--ink-2)}
.stat-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.stat-dot.amber{background:#f59e0b}
.hero-actions{display:flex;gap:8px;flex-shrink:0;align-items:flex-start;margin-top:4px}
.btn{height:38px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:hover{background:var(--accent-2);box-shadow:0 8px 24px -8px rgba(22,163,74,0.45)}
.btn-ai{background:linear-gradient(135deg,#7c3aed,#2563EB);color:#fff;border-color:transparent}
.btn-ai:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 8px 24px -8px rgba(124,58,237,0.4)}
.btn-sm{height:30px;padding:0 13px;font-size:12px;border-radius:999px}
.btn-ghost{background:none;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink-2);transform:none}
.btn-danger{color:var(--rose);border-color:var(--rose-line)}
.btn-danger:hover{background:var(--rose-soft);transform:none}

/* ── SECTION HEADERS ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.section-badge{background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}

/* ── TEMPLATE GALLERY ── */
#templates{margin-bottom:36px}
.template-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.template-scroll::-webkit-scrollbar{height:4px}
.template-scroll::-webkit-scrollbar-track{background:transparent}
.template-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
.tpl-card{flex-shrink:0;width:200px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all .15s;position:relative}
.tpl-card:hover{border-color:var(--accent-line);box-shadow:0 22px 50px -28px #0e0e1033,0 0 0 2px var(--accent-soft);transform:translateY(-2px)}
.tpl-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.tpl-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.3}
.tpl-desc{font-size:11px;color:var(--muted);line-height:1.5}
.tpl-tags{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.tpl-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}

/* ── AUTOMATIONS TABLE ── */
#automations-section{margin-bottom:36px}
.list-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search-box{flex:1;min-width:180px;height:36px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 14px}
.search-box input{flex:1;border:none;background:none;font-size:13px;color:var(--ink);outline:none}
.search-box input::placeholder{color:var(--muted)}
.filter-select{height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:13px;color:var(--ink-2);outline:none;cursor:pointer}
/* ── CANVAS RULES LIST ── */
.rules-list{background-image:radial-gradient(circle,var(--line-2) 1.5px,transparent 1.5px);background-size:22px 22px;background-color:var(--surface-2);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--line-2);display:flex;flex-direction:column;gap:14px;min-height:120px}
/* ── FLOW CARD ── */
.flow-card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;transition:box-shadow .15s}
.flow-card:hover{box-shadow:0 22px 50px -28px #0e0e1033,0 0 0 1.5px var(--accent-line)}
.flow-card.disabled{opacity:0.55}
.flow-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.flow-card-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.flow-name{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-stat{font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0}
/* ── FLOW NODES ROW ── */
.flow-nodes{display:flex;align-items:center;overflow-x:auto;padding-bottom:2px;gap:0}
.flow-nodes::-webkit-scrollbar{height:3px}
.flow-nodes::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
/* ── SINGLE NODE ── */
.flow-node{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line-2);border-radius:10px;padding:9px 14px;min-width:148px;flex-shrink:0;background:var(--bg)}
.node-trigger{border-color:var(--accent-line);background:var(--accent-soft)}
.node-action{border-color:var(--blue-line);background:var(--blue-soft)}
.node-icon{font-size:19px;flex-shrink:0;line-height:1}
.node-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.node-value{font-size:12.5px;font-weight:600;color:var(--ink)}
/* ── CONNECTOR ARROW ── */
.flow-connector{display:flex;align-items:center;padding:0 2px;flex-shrink:0}
.connector-line{width:32px;height:2px;background:var(--line-2)}
.connector-arrow{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid var(--line-2);flex-shrink:0}
/* ── TOGGLE ── */
.rule-toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.rule-toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{display:block;width:36px;height:20px;background:var(--surface-3);border-radius:10px;cursor:pointer;transition:background .2s}
.rule-toggle input:checked + .toggle-track{background:var(--accent)}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rule-toggle input:checked + .toggle-track::after{transform:translateX(16px)}
.rule-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;transition:all .12s;cursor:pointer}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.icon-btn.run-btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.icon-btn.del-btn:hover{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose)}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .es-icon{font-size:36px;margin-bottom:12px}
.empty-state h3{font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.empty-state p{font-size:13px;line-height:1.6;max-width:320px;margin:0 auto 16px}

/* ── RUN HISTORY ── */
#run-history{margin-bottom:36px}
.runs-list{display:flex;flex-direction:column;gap:4px}
.run-row{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.run-row:hover{background:var(--surface-2);transform:translateY(-1px)}
.run-status{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.status-success{background:var(--green-soft);color:var(--green)}
.status-error{background:var(--rose-soft);color:var(--rose)}
.status-skipped{background:var(--amber-soft);color:var(--amber)}
.status-pending{background:var(--blue-soft);color:var(--blue)}
.run-time{font-size:11px;color:var(--muted);width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.run-name{flex:1;font-size:13px;font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-trigger{font-size:11px;color:var(--muted);flex-shrink:0;width:70px}
.run-duration{font-size:11px;color:var(--muted);width:40px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.run-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
.badge-success{background:var(--green-soft);color:var(--green)}
.badge-error{background:var(--rose-soft);color:var(--rose)}
.badge-skipped{background:var(--amber-soft);color:var(--amber)}
.badge-pending{background:var(--blue-soft);color:var(--blue)}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 40px 100px -50px #0e0e1066,0 4px 24px rgba(0,0,0,.1);width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;transform:translateY(8px);transition:transform .18s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-lg{max-width:680px}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head h2{font-size:16px;font-weight:700}
.modal-close{width:28px;height:28px;border-radius:7px;border:none;background:none;font-size:16px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.modal-close:hover{background:var(--surface-2);color:var(--ink)}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}

/* ── STEPS ── */
.steps{display:flex;gap:0;margin-bottom:24px}
.step-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.step-item:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 14px);width:calc(100% - 28px);height:1px;background:var(--line)}
.step-item.active::after,.step-item.done::after{background:var(--accent)}
.step-num{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);transition:all .2s;z-index:1}
.step-item.active .step-num{border-color:var(--accent);background:var(--accent);color:#fff}
.step-item.done .step-num{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.step-label{font-size:10px;font-weight:600;color:var(--muted);text-align:center}
.step-item.active .step-label{color:var(--accent)}

/* ── FORM FIELDS ── */
.field{margin-bottom:16px}
.field-row{display:flex;gap:10px;margin-bottom:16px}
.field-row .field{flex:1;margin-bottom:0}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;height:38px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:13px;color:var(--ink);outline:none;transition:border .14s,box-shadow .14s}
.inp:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.inp-sm{height:34px;font-size:12px}
select.inp{cursor:pointer}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:72px}
.inp-hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.divider{height:1px;background:var(--line);margin:18px 0}
.section-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}

/* ── CONDITION ROWS ── */
.cond-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cond-row{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cond-logic{width:40px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer;flex-shrink:0}
.cond-col{flex:1;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px;font-size:12px;color:var(--ink);outline:none}
.cond-col:focus{border-color:var(--accent)}
.cond-op{width:120px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px;font-size:12px;color:var(--ink);outline:none;cursor:pointer}
.cond-val{width:90px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px;font-size:12px;color:var(--ink);outline:none}
.cond-val:focus,.cond-op:focus{border-color:var(--accent)}
.cond-remove{width:24px;height:24px;border-radius:5px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cond-remove:hover{background:var(--rose-soft);color:var(--rose)}

/* ── ACTION CARDS ── */
.action-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.action-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.action-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.action-num{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action-type-select{flex:1;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;font-size:13px;color:var(--ink);outline:none;cursor:pointer}
.action-type-select:focus{border-color:var(--accent)}
.action-remove{width:26px;height:26px;border-radius:6px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action-remove:hover{background:var(--rose-soft);color:var(--rose)}
.action-fields{display:flex;flex-direction:column;gap:8px}
.action-field label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.action-field input,.action-field select,.action-field textarea{width:100%;height:32px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 10px;font-size:12px;color:var(--ink);outline:none;transition:border .12s}
.action-field input:focus,.action-field select:focus,.action-field textarea:focus{border-color:var(--accent)}
.action-field textarea{height:auto;padding:8px 10px;min-height:60px;resize:vertical}

/* ── AI MODAL ── */
.ai-input-wrap{position:relative}
.ai-textarea{width:100%;min-height:100px;border:1.5px solid var(--accent-line);border-radius:10px;padding:14px;font-size:14px;color:var(--ink);background:var(--accent-soft);outline:none;resize:none;line-height:1.6;transition:border .14s}
.ai-textarea:focus{border-color:var(--accent)}
.ai-textarea::placeholder{color:var(--muted)}
.ai-examples{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.ai-example{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .12s;line-height:1.5}
.ai-example:hover{border-color:var(--accent-line);color:var(--ink-2);background:var(--accent-soft)}
.ai-preview{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:16px}
.ai-preview-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.preview-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.preview-label{width:100px;font-weight:600;color:var(--ink-2);flex-shrink:0}
.preview-val{color:var(--ink);flex:1}
.loading-dots{display:inline-flex;gap:4px;align-items:center}
.loading-dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot-bounce .8s infinite ease-in-out}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot-bounce{0%,80%,100%{transform:scale(.8);opacity:.5}40%{transform:scale(1);opacity:1}}

/* ── RUN DETAIL MODAL ── */
.run-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rd-cell{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.rd-cell-label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px}
.rd-cell-val{font-size:13px;font-weight:600;color:var(--ink)}
.action-result-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.action-result-row:last-child{border-bottom:none}
.ar-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px}
.ar-body{flex:1;font-size:12px}
.ar-type{font-weight:600;color:var(--ink-2);margin-bottom:2px}
.ar-status{color:var(--muted)}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:13px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:320px;display:flex;align-items:center;gap:8px;pointer-events:all;animation:slideUp .2s ease}
.toast.success{background:#166534}
.toast.error{background:#9f1239}
.toast.warning{background:#92400e}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── SPINNER ── */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-dark{border-color:rgba(0,0,0,.15);border-top-color:var(--accent)}

/* ── THEME TOGGLE ── */
.theme-toggle{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--muted);transition:all .12s}
.theme-toggle:hover{background:var(--surface-2);color:var(--ink)}

/* ── MISC ── */
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.interpolation-hint{font-size:11px;color:var(--muted);margin-top:3px}
.interpolation-hint code{background:var(--surface-3);border-radius:3px;padding:1px 4px;font-size:10px;font-family:monospace;color:var(--ink-2)}

@media(max-width:640px){
  #main{padding:20px 12px 60px}
  .hero-top{flex-direction:column}
  .hero-actions{width:100%}
  .run-trigger,.run-duration{display:none}
  .modal-lg{max-width:100%}
  .run-detail-grid{grid-template-columns:1fr}
  .field-row{flex-direction:column;gap:12px}
}

/* ── HERO YENİ ── */
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;letter-spacing:.01em;margin-bottom:18px}
.hero-h1{font-family:'Geist',sans-serif;font-size:clamp(26px,4vw,42px);font-weight:800;line-height:1.15;color:var(--ink);margin-bottom:12px}
.hero-h1 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--accent)}

/* ── APPS GALLERY ── */
#apps-gallery{margin-bottom:36px}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.app-tile{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .15s;text-align:center}
.app-tile:hover{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft);transform:translateY(-2px)}
.app-tile-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:22px}
.app-tile-icon img,.app-tile-icon svg{width:24px;height:24px;display:block}
.app-tile-name{font-size:11px;font-weight:600;color:var(--ink-2)}
.app-tile-cat{font-size:10px;color:var(--muted)}

/* ── INLINE BUILDER ── */
#builder-section{display:none;margin-bottom:36px;background:var(--surface);border:1.5px solid var(--accent-line);border-radius:var(--radius-lg);overflow:hidden}
#builder-section.open{display:block}
.builder-toolbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--accent-soft);flex-wrap:wrap}
.builder-toolbar-title{font-size:14px;font-weight:700;color:var(--ink)}
.builder-name-inp{flex:1;min-width:160px;height:34px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font-size:13px;color:var(--ink);outline:none}
.builder-name-inp:focus{border-color:var(--accent)}
.builder-canvas{background-image:radial-gradient(circle,var(--line-2) 1.5px,transparent 1.5px);background-size:24px 24px;background-color:var(--surface-2);padding:32px 28px;overflow-x:auto;min-height:180px;display:flex;align-items:center;gap:0}
.c-node{flex-shrink:0;background:var(--surface);border:2px solid var(--line-2);border-radius:14px;padding:14px 16px;min-width:160px;cursor:pointer;transition:all .15s;position:relative}
.c-node:hover{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.c-node.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.c-node.trigger-node{border-color:var(--accent-line);background:var(--accent-soft)}
.c-node.trigger-node.selected{border-color:var(--accent)}
.c-node.action-node{border-color:var(--blue-line);background:var(--blue-soft)}
.c-node.action-node.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.c-node-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.c-node-icon{font-size:26px;margin-bottom:6px;line-height:1}
.c-node-label{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.c-node-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.c-node-del{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:4px;border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center}
.c-node:hover .c-node-del{display:flex}
.c-node-del:hover{background:var(--rose-soft);color:var(--rose)}
.c-connector{display:flex;align-items:center;flex-shrink:0;padding:0 4px}
.c-conn-line{width:36px;height:2px;background:var(--line-2)}
.c-conn-arrow{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid var(--line-2)}
.c-add-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2px dashed var(--line-2);background:var(--surface);color:var(--muted);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;margin:0 10px;line-height:1}
.c-add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);transform:scale(1.08)}
.builder-config{border-top:1px solid var(--line);padding:20px 24px;display:none}
.builder-config.open{display:block}
.cfg-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.app-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:16px}
.app-card{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .12s;text-align:center}
.app-card:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.app-card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px rgba(22,163,74,.15)}
.app-card-icon{font-size:20px;display:flex;align-items:center;justify-content:center;width:24px;height:24px}
.app-card-icon img,.app-card-icon svg{width:20px;height:20px;display:block}
.app-card-name{font-size:10px;font-weight:600;color:var(--ink-2)}
.trigger-type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.trigger-type-card{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .12s}
.trigger-type-card:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.trigger-type-card.selected{border-color:var(--accent);background:var(--accent-soft)}
.trigger-type-card-icon{font-size:18px;flex-shrink:0}
.trigger-type-card-name{font-size:11px;font-weight:600;color:var(--ink-2);line-height:1.3}
.builder-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}

@media(max-width:640px){
  .hero-h1{font-size:24px}
  .apps-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr))}
  .builder-canvas{padding:20px 14px}
  .c-node{min-width:130px;padding:10px 12px}
  .builder-toolbar{gap:8px}
  .app-picker-grid,.trigger-type-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
}
/* ── TEMPLATE KATEGORİ FİLTRESİ ── */
.tpl-cats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tpl-cat{padding:4px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.tpl-cat.active{border-color:var(--accent-line);background:rgba(22,163,74,.08);color:var(--accent)}
/* ── SCHEDULE ÖNİZLEME ── */
.schedule-preview{margin-top:10px;padding:8px 14px;border-radius:8px;background:rgba(22,163,74,.06);border:1px solid rgba(22,163,74,.18);font-size:12px;color:var(--accent);font-weight:500}
.flow-schedule-badge{font-size:10px;color:var(--accent);font-weight:600;display:block;margin-top:2px;opacity:.8}
/* ── DEĞİŞKEN CHİPS ── */
.var-chips-wrap{margin-top:8px}
.var-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.var-chip{padding:2px 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);font-size:11px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:monospace;transition:all .12s}
.var-chip:hover{border-color:var(--accent-line);color:var(--accent);background:rgba(22,163,74,.07)}
.var-chips-hint{font-size:10px;color:var(--muted)}
/* ── MESAJ ÖNİZLEME ── */
.msg-preview-box{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.msg-preview-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.msg-preview-text{font-size:12px;color:var(--ink-2);line-height:1.6;font-style:italic}

/* ── INTEGRATION SECTION ── */
#integrations-section{margin-top:32px;margin-bottom:0}
.int-main{padding:0}
.int-stats-bar{display:flex;gap:24px;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.int-stat{font-size:13px;color:var(--muted)}
.int-stat strong{color:var(--ink);font-weight:700}
.int-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cat-pills{display:flex;gap:6px;flex-wrap:wrap}
.cat-pill{padding:5px 14px;border-radius:100px;font-size:12px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.cat-pill:hover{border-color:var(--accent);color:var(--accent)}
.cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.view-toggle{display:flex;gap:4px}
.view-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.view-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.view-btn:hover:not(.active){background:var(--surface-2)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media(max-width:560px){.cards-grid{grid-template-columns:1fr}}
.cards-list{display:flex;flex-direction:column;gap:8px}
.int-card{background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--radius);padding:22px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;display:flex;flex-direction:column}
.int-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(22,163,74,0.07) 0%,transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.int-card:hover{border-color:var(--accent-line);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.int-card:hover::before{opacity:1}
.int-card.connected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,0.08)}
.int-card-logo{width:52px;height:52px;border-radius:12px;background:#fff;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.int-card-logo img{width:32px;height:32px;object-fit:contain}
[data-theme="dark"] .int-card-logo{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.int-pulse-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:intPulse 2s ease-in-out infinite;flex-shrink:0}
@keyframes intPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.int-badge{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:100px;white-space:nowrap}
.int-badge-pro{background:rgba(124,92,255,0.12);color:#7c3aed}
.int-badge-free{background:rgba(34,197,94,0.12);color:#16a34a}
.int-badge-connected{background:rgba(34,197,94,0.12);color:#16a34a;display:flex;align-items:center;gap:5px}
.int-badge-popular{background:rgba(251,191,36,0.15);color:#d97706}
.int-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.int-card-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.int-card-body{flex:1}
.int-card-name{font-size:15px;font-weight:700;margin-bottom:2px}
.int-card-cat{font-size:11px;color:var(--muted);margin-bottom:10px}
.int-card-section{margin-top:10px}
.int-card-section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.int-card-list{list-style:none;display:flex;flex-direction:column;gap:3px}
.int-card-list li{font-size:11.5px;color:var(--ink);display:flex;align-items:flex-start;gap:5px;line-height:1.4}
.int-check-icon{color:var(--accent);font-size:11px;flex-shrink:0;margin-top:1px}
.int-trigger-icon{color:#f59e0b;font-size:11px;flex-shrink:0;margin-top:1px}
.int-card-usecase{margin-top:10px;font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.5;border-left:2px solid var(--accent-soft);padding-left:8px}
.int-card-footer{display:flex;align-items:center;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.int-connect-btn{padding:7px 16px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.int-connect-btn.btn-connect{background:var(--accent);color:#fff}
.int-connect-btn.btn-connect:hover{opacity:.88}
.int-connect-btn.btn-disconnect{background:transparent;color:#ef4444;border:1px solid #fca5a5}
.int-connect-btn.btn-disconnect:hover{background:#fef2f2}
.int-empty-state{text-align:center;padding:40px 24px;color:var(--muted)}
.int-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:300;padding:24px;animation:fadeIn .15s ease}
.int-modal-box{background:var(--surface);border:1.5px solid var(--line-2);border-radius:22px;padding:28px;max-width:480px;width:100%;box-shadow:0 40px 100px -50px #0e0e1066,0 4px 24px rgba(0,0,0,.1);animation:intSlideUp .2s ease}
@keyframes intSlideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.int-modal-header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.int-modal-title{font-size:18px;font-weight:700}
.int-modal-close{margin-left:auto;width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;line-height:1}
.int-modal-close:hover{background:var(--surface-2)}
.int-modal-divider{border:none;border-top:1px solid var(--line);margin:14px 0 18px}
.int-modal-form-group{margin-bottom:14px}
.int-modal-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.int-modal-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.int-modal-label-link{font-size:11px;color:var(--accent);text-decoration:none}
.int-modal-label-link:hover{text-decoration:underline}
.int-modal-input{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.int-modal-input:focus{border-color:var(--accent);background:var(--surface)}
.int-modal-input::placeholder{color:var(--muted)}
.int-modal-hint{font-size:11px;color:var(--muted);margin-top:4px}
.int-connect-result{padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:14px;line-height:1.5}
.int-connect-result.success{background:rgba(34,197,94,0.1);color:#15803d;border:1px solid #86efac}
.int-connect-result.error{background:rgba(239,68,68,0.1);color:#b91c1c;border:1px solid #fca5a5}
.int-oauth-info{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:12px;font-size:13px;line-height:1.6;margin-bottom:16px}
.int-modal-actions{display:flex;gap:8px}
.int-modal-btn{flex:1;padding:11px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.int-modal-btn-primary{background:var(--accent);color:#fff}
.int-modal-btn-primary:hover:not(:disabled){opacity:.88}
.int-modal-btn-primary:disabled{opacity:.5;cursor:default}
.int-modal-btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2)}
.int-modal-btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

/* ── AGENTS SECTION ── */
#agents-section{margin-bottom:36px}
.agent-input-wrap{background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--radius);padding:20px;margin-bottom:0}
.agent-input-wrap textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink);resize:vertical;outline:none;transition:border-color .15s;font-family:inherit;line-height:1.55}
.agent-input-wrap textarea:focus{border-color:var(--accent-line)}
.agent-run-btn{margin-top:12px;height:40px;padding:0 22px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;font-family:inherit}
.agent-run-btn:hover:not(:disabled){background:var(--accent-2);transform:translateY(-1px);box-shadow:0 8px 24px -8px rgba(22,163,74,.45)}
.agent-run-btn:disabled{opacity:.55;cursor:default;transform:none}
.agent-log-wrap{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:20px;margin-top:16px}
.agent-step-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--line)}
.agent-step-row:last-child{border-bottom:none}
.agent-step-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.agent-step-label{font-size:14px;flex:1;color:var(--ink-2)}
.agent-step-status{font-size:12px;font-weight:500}
.agent-result{margin-top:16px;padding:16px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;font-size:14px;color:var(--ink-2);white-space:pre-wrap;line-height:1.55}
.agent-history-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--line);cursor:pointer;transition:background .12s;border-radius:6px;padding-left:4px}
.agent-history-row:last-child{border-bottom:none}
.agent-history-row:hover{background:var(--surface-2)}
.agent-upgrade-overlay{position:absolute;inset:0;background:rgba(250,250,250,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);z-index:10;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
[data-theme="dark"] .agent-upgrade-overlay{background:rgba(0,0,0,.85)}

/* ─── Wizard Layout ─────────────────────────────── */
.wz-shell {
  display: grid;
  grid-template-rows: 52px 1fr 52px;
  height: calc(100vh - 60px);
  background: var(--bg);
}

.wz-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 0.5px solid var(--line);
  background: var(--surface);
}

.wz-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  margin: 0;
}

.wz-steps {
  display: flex;
  align-items: center;
  gap: 0;
}

.wz-step {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
  user-select: none;
}

.wz-step:hover { background: var(--surface-2); }
.wz-step.active { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.wz-step.done { color: var(--accent); }

.wz-step-num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 500;
  flex-shrink: 0;
}

.wz-step.active .wz-step-num {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}

.wz-step.done .wz-step-num {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent);
}

.wz-divider {
  width: 20px;
  height: 1px;
  background: var(--line);
}

.wz-body {
  display: grid;
  grid-template-columns: 260px 1fr 220px;
  overflow: hidden;
}

.wz-sidebar {
  border-right: 0.5px solid var(--line);
  padding: 14px;
  background: var(--surface);
  overflow-y: auto;
}

.wz-panel-title {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  margin: 0 0 10px;
}

.wz-node {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border: 0.5px solid var(--line);
  border-radius: 10px;
  margin-bottom: 5px;
  cursor: pointer;
  background: var(--surface);
  transition: border-color 0.15s, background 0.15s;
}

.wz-node:hover { border-color: var(--surface-3); background: var(--surface-2); }
.wz-node.selected { border-color: #6366f1; background: #f5f3ff; }
[data-theme="dark"] .wz-node.selected { background: #1e1b4b; }

.wz-node-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.wz-node-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 2px;
}

.wz-node-desc {
  font-size: 10px;
  color: var(--muted);
  margin: 0;
}

.wz-canvas {
  padding: 20px;
  background: var(--surface-2);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.wz-canvas-hint {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}

.flow-node {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: 12px;
  position: relative;
}

.flow-node.trigger { border-color: #6366f1; }
.flow-node.action-read { border-color: #d97706; background: #fffbeb; }
.flow-node.action-ai { border-color: #6366f1; background: #f5f3ff; }
.flow-node.action-slack { border-color: #16a34a; background: #f0fdf4; }
.flow-node.action-email { border-color: #9333ea; background: #fdf4ff; }
[data-theme="dark"] .flow-node.action-read { background: #1c1400; }
[data-theme="dark"] .flow-node.action-ai { background: #1e1b4b; }
[data-theme="dark"] .flow-node.action-slack { background: #052e16; }
[data-theme="dark"] .flow-node.action-email { background: #2e1065; }

.flow-node-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.flow-node-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 2px;
}

.flow-node-sub {
  font-size: 11px;
  color: var(--muted);
  margin: 0;
}

.flow-connector {
  width: 2px;
  height: 24px;
  background: var(--line);
  margin: 0 0 0 20px;
  position: relative;
}

.flow-connector::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: -3px;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--line);
  border-bottom: 1.5px solid var(--line);
  transform: rotate(45deg);
}

.flow-add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px dashed var(--surface-3);
  border-radius: 12px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.flow-add-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.wz-settings {
  border-left: 0.5px solid var(--line);
  padding: 14px;
  background: var(--surface);
  overflow-y: auto;
}

.wz-settings-label {
  font-size: 11px;
  color: var(--muted);
  margin: 0 0 5px;
}

.wz-settings input,
.wz-settings select {
  width: 100%;
  padding: 7px 9px;
  font-size: 12px;
  border: 0.5px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--ink);
  margin-bottom: 12px;
  box-sizing: border-box;
  outline: none;
}

.wz-settings input:focus,
.wz-settings select:focus {
  border-color: #6366f1;
}

.wz-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-top: 0.5px solid var(--line);
  background: var(--surface);
}

.wz-footer-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}

.wz-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

.wz-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 500;
}

.wz-auto-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
}

.wz-auto-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color 0.15s;
}

.wz-auto-card:hover { border-color: var(--surface-3); }

.wz-auto-card-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
}

.wz-auto-card-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 3px;
}

.wz-auto-card-sub {
  font-size: 11px;
  color: var(--muted);
  margin: 0;
}

.wz-toggle {
  width: 32px;
  height: 18px;
  background: var(--surface-3);
  border-radius: 9px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}

.wz-toggle.on { background: var(--accent); }

.wz-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}

.wz-toggle.on::after { transform: translateX(14px); }

@media (max-width: 768px) {
  .wz-body { grid-template-columns: 1fr; }
  .wz-sidebar, .wz-settings { display: none; }
}

/* ── Workflow Builder ── */
.wf-shell {
  display: grid;
  grid-template-rows: 52px 1fr 36px;
  height: calc(100vh - 60px);
}
.wf-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 0.5px solid var(--line);
  background: var(--surface);
  gap: 12px;
}
.wf-name-input {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  border: none;
  background: transparent;
  outline: none;
  min-width: 140px;
}
.wf-name-input:focus {
  background: var(--surface-2);
  border-radius: 6px;
  padding: 2px 6px;
}
.wf-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.wf-badge.draft  { background: var(--surface-3); color: var(--muted); }
.wf-badge.active { background: var(--accent-soft); color: var(--accent); }
.wf-badge.run    { background: #fef3c7; color: #d97706; }
.wf-btn {
  padding: 6px 12px; font-size: 12px; border-radius: 8px;
  border: 0.5px solid var(--line); background: transparent; color: var(--ink);
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: background 0.12s; white-space: nowrap;
}
.wf-btn:hover        { background: var(--surface-2); }
.wf-btn.primary      { background: var(--accent); color: #fff; border-color: var(--accent); }
.wf-btn.primary:hover { opacity: .9; }
.wf-btn.violet       { background: #6366f1; color: #fff; border-color: #6366f1; }
.wf-btn.violet:hover  { opacity: .9; }
.wf-btn.danger       { color: var(--rose); }
.wf-body {
  display: grid;
  grid-template-columns: 260px 1fr 0px;
  overflow: hidden;
  transition: grid-template-columns .2s;
}
.wf-body.panel-open { grid-template-columns: 260px 1fr 256px; }
.wf-sidebar {
  border-right: 0.5px solid var(--line);
  background: var(--surface);
  display: flex; flex-direction: column; overflow: hidden;
}
.wf-sidebar-head { padding: 10px 12px; border-bottom: 0.5px solid var(--line); }
.wf-search {
  width: 100%; padding: 6px 9px; font-size: 12px;
  border: 0.5px solid var(--line); border-radius: 8px;
  background: var(--surface-2); color: var(--ink);
  outline: none; box-sizing: border-box;
}
.wf-search:focus { border-color: #6366f1; }
.wf-sidebar-body { flex: 1; overflow-y: auto; padding: 8px 10px; }
.wf-cat-label {
  font-size: 10px; color: var(--muted);
  letter-spacing: .07em; text-transform: uppercase;
  padding: 8px 4px 4px; display: block;
}
.wf-node-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 9px; border-radius: 8px;
  cursor: grab; transition: background .12s; user-select: none;
}
.wf-node-row:hover  { background: var(--surface-2); }
.wf-node-row:active { cursor: grabbing; }
.wf-node-ico {
  width: 30px; height: 30px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.wf-node-lbl { font-size: 12px; font-weight: 500; color: var(--ink); margin: 0 0 1px; }
.wf-node-sub { font-size: 10px; color: var(--muted); margin: 0; }
.wf-canvas { background: var(--bg); position: relative; overflow: hidden; }
.react-flow__background { background: var(--bg) !important; }
.react-flow__controls {
  border: 0.5px solid var(--line) !important; border-radius: 10px !important;
  background: var(--surface) !important; box-shadow: none !important;
}
.react-flow__controls-button {
  background: var(--surface) !important; border: none !important;
  border-bottom: 0.5px solid var(--line) !important; color: var(--ink) !important;
}
.react-flow__minimap {
  border: 0.5px solid var(--line) !important; border-radius: 10px !important;
  background: var(--surface) !important;
}
.react-flow__handle {
  width: 10px !important; height: 10px !important;
  border-radius: 50% !important; border: 2px solid var(--surface) !important;
}
.react-flow__handle-source { background: var(--accent) !important; }
.react-flow__handle-target { background: #6366f1 !important; }
.react-flow__edge-path { stroke: var(--muted) !important; stroke-width: 1.5 !important; }
.wf-flow-card {
  background: var(--surface); border: 0.5px solid var(--line);
  border-radius: 12px; padding: 11px 13px;
  min-width: 190px; max-width: 250px;
  cursor: pointer; transition: border-color .15s; font-family: inherit;
}
.wf-flow-card:hover       { border-color: var(--surface-3); }
.wf-flow-card.selected    { border-color: #6366f1; box-shadow: 0 0 0 3px #eef2ff; }
.wf-flow-card.is-trigger  { border-color: #6366f1; border-width: 1.5px; }
.wf-flow-card.st-error    { border-color: var(--rose); }
.wf-flow-card.st-success  { border-color: var(--accent); }
[data-theme="dark"] .wf-flow-card.selected { box-shadow: 0 0 0 3px #1e1b4b; }
.wf-fc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.wf-fc-icon { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.wf-fc-name { font-size: 12px; font-weight: 500; color: var(--ink); margin: 0; }
.wf-fc-op   { font-size: 10px; color: var(--muted); margin: 0; }
.wf-fc-body { border-top: 0.5px solid var(--line); padding-top: 5px; margin-top: 5px; }
.wf-fc-cfg  { font-size: 10px; color: var(--ink-2); margin-bottom: 2px; font-family: monospace; }
.wf-fc-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.wf-panel {
  border-left: 0.5px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; overflow: hidden; min-width: 0;
}
.wf-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 13px; border-bottom: 0.5px solid var(--line); flex-shrink: 0;
}
.wf-panel-title { font-size: 13px; font-weight: 500; color: var(--ink); margin: 0; }
.wf-panel-body  { flex: 1; overflow-y: auto; padding: 13px; }
.wf-field       { margin-bottom: 12px; }
.wf-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.wf-input, .wf-select, .wf-textarea {
  width: 100%; padding: 6px 8px; font-size: 12px;
  border: 0.5px solid var(--line); border-radius: 8px;
  background: var(--surface-2); color: var(--ink);
  outline: none; font-family: inherit; box-sizing: border-box;
}
.wf-input:focus, .wf-select:focus, .wf-textarea:focus { border-color: #6366f1; }
.wf-textarea { resize: vertical; min-height: 56px; }
.wf-op-list  { display: flex; flex-direction: column; gap: 3px; margin-bottom: 12px; }
.wf-op-item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 9px; border: 0.5px solid var(--line);
  border-radius: 7px; cursor: pointer; font-size: 11px;
  color: var(--ink); background: var(--surface);
  transition: background .1s, border-color .1s;
}
.wf-op-item:hover { background: var(--surface-2); }
.wf-op-item.sel   { border-color: #6366f1; background: #eef2ff; color: #4338ca; font-weight: 500; }
[data-theme="dark"] .wf-op-item.sel { background: #1e1b4b; }
.wf-sec-title {
  font-size: 10px; color: var(--muted);
  letter-spacing: .07em; text-transform: uppercase; margin: 0 0 7px;
}
.wf-bottombar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; border-top: 0.5px solid var(--line);
  background: var(--surface); font-size: 11px; color: var(--muted);
}
.wf-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.25);
  z-index: 500; display: flex; align-items: center; justify-content: center;
}
.wf-modal {
  background: var(--surface); border-radius: 16px;
  width: 540px; max-height: 78vh;
  display: flex; flex-direction: column; border: 0.5px solid var(--line);
}
.wf-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 18px; border-bottom: 0.5px solid var(--line);
}
.wf-modal-item {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 18px; border-bottom: 0.5px solid var(--line);
  cursor: pointer; transition: background .12s;
}

  // Fallback: scan localStorage manually

  }

  // Expose token to React script block (let is not window-scoped across script tags)

  // Update avatar

    const userRaw = localStorage.getItem('mocksheets-user') || localStorage.getItem('ms-user');

    }
  } catch {}
}

function getFreshToken() {
  for (const [k, v] of Object.entries(localStorage)) {
    if (k.includes('supabase') || k.includes('sb-')) {

        const p = JSON.parse(v);
        const t = p?.access_token || p?.session?.access_token || p?.currentSession?.access_token;
        if (t) return t;
      } catch {}
    }
  }
  return authToken;
}

function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  const t = getFreshToken();
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}

// ── RENDER TEMPLATES ───────────────────────────────────────────────────────
function openTemplateById(id) {
  const t = TEMPLATES.find(t => t.id === id);
  if (t) openBuilder(t.data);
}

let activeTplCat = 'all';

function filterTemplates(cat) {
  activeTplCat = cat;
  document.querySelectorAll('.tpl-cat').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  renderTemplates();
}

function renderTemplates() {
  const el = document.getElementById('template-scroll');
  const list = activeTplCat === 'all' ? TEMPLATES : TEMPLATES.filter(t => t.category === activeTplCat);
  document.getElementById('tpl-count-badge').textContent = list.length + ' şablon';
  el.innerHTML = list.map(t => `
    <div class="tpl-card" data-tpl-id="${t.id}" onclick="openTemplateById(this.dataset.tplId)">
      <div class="tpl-icon" style="background:${t.iconBg}">${t.icon}</div>
      <div class="tpl-name">${t.name}</div>
      <div class="tpl-desc">${t.desc}</div>
      <div class="tpl-tags">${t.tags.map(g => `<span class="tpl-tag">${g}</span>`).join('')}</div>
    </div>
  `).join('');
}

// ── LOAD RULES ─────────────────────────────────────────────────────────────
async function loadRules() {
  try {
    const res = await fetch(API + '/api/automations', { headers: authHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allRules = data.rules || data || [];
  } catch (e) {
    allRules = [];
    console.warn('loadRules:', e.message);
  }
  renderRules();
  updateStats();
}

function filterRules() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const status = document.getElementById('status-filter').value;
  const filtered = allRules.filter(r => {
    const nameMatch = r.name.toLowerCase().includes(q);
    const statusMatch = status === 'all' || (status === 'active' ? r.enabled : !r.enabled);
    return nameMatch && statusMatch;
  });
  renderRules(filtered);
}

function updateStats() {
  const active = allRules.filter(r => r.enabled).length;
  document.getElementById('stat-active').textContent = active + ' aktif';
  document.getElementById('stat-dot-active').style.background = active > 0 ? '#16a34a' : '#f59e0b';
  document.getElementById('stat-dot-active').classList.toggle('amber', active === 0);

  const totalRuns = allRuns.length;
  document.getElementById('stat-runs').textContent = totalRuns + ' çalışma';

  const successRuns = allRuns.filter(r => r.status === 'success').length;
  const rate = totalRuns > 0 ? Math.round((successRuns / totalRuns) * 100) : null;
  document.getElementById('stat-success').textContent = rate !== null ? '%' + rate + ' başarı' : '— başarı';
  document.getElementById('chip-success').style.display = rate !== null ? '' : 'none';
}

// ── LOAD RUNS ──────────────────────────────────────────────────────────────
async function loadRuns() {
  try {
    const res = await fetch(API + '/api/automations/runs?limit=20', { headers: authHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allRuns = data.runs || data || [];
  } catch (e) {
    allRuns = [];
  }
  renderRuns();
  updateStats();
}

function renderRuns() {
  const el = document.getElementById('runs-list');
  document.getElementById('run-count-badge').textContent = allRuns.length;

  if (!allRuns.length) {
    el.innerHTML = `<div class="empty-state" style="padding:24px"><p style="font-size:13px;color:var(--muted)">İlk workflow'unu çalıştırdığında burada görünecek.</p></div>`;
    return;
  }

  el.innerHTML = allRuns.map(r => {
    const statusIcon = { success: '✓', error: '✕', skipped: '→', pending: '…' }[r.status] || '?';
    const badgeCls = 'badge-' + (r.status || 'pending');
    const time = r.started_at ? new Date(r.started_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '—';
    const dur = r.duration_ms ? (r.duration_ms < 1000 ? r.duration_ms + 'ms' : (r.duration_ms / 1000).toFixed(1) + 's') : '—';
    const trigLabel = { manual: 'Manuel', schedule: 'Zamanlama', test: 'Test', 'sheet-change': 'Sheet' }[r.triggered_by] || r.triggered_by || '—';
    return `
      <div class="run-row" onclick="showRunDetail('${r.id}')">
        <div class="run-status status-${r.status || 'pending'}">${statusIcon}</div>
        <div class="run-time">${time}</div>
        <div class="run-name">${escHtml(r.rule_name || r.rule_id || '—')}</div>
        <div class="run-trigger">${trigLabel}</div>
        <span class="run-badge ${badgeCls}">${STATUS_LABELS[r.status] || r.status}</span>
        <div class="run-duration">${dur}</div>
      </div>`;
  }).join('');
}

// ── RULE ACTIONS ───────────────────────────────────────────────────────────
async function toggleRule(id, enabled) {
  try {
    await fetch(API + '/api/automations/' + id, {
      method: 'PUT', headers: authHeaders(),
      body: JSON.stringify({ enabled })
    });
    const r = allRules.find(r => r.id === id);
    if (r) r.enabled = enabled;
    updateStats();
  } catch { toast('Güncelleme başarısız', 'error'); }
}

async function runRule(id) {
  const btn = document.querySelector(`#rule-${id} .run-btn`);
  if (btn) btn.innerHTML = '<div class="spin spin-dark"></div>';
  try {
    const res = await fetch(API + '/api/automations/' + id + '/run', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({})
    });
    const data = await res.json();
    if (res.ok) {
      toast('Otomasyon çalıştırıldı', 'success');
      await loadRuns();
      const rule = allRules.find(r => r.id === id);
      if (rule) { rule.last_fired = new Date().toISOString(); rule.run_count = (rule.run_count || 0) + 1; }
      renderRules();
    } else {
      toast(data.error || 'Hata oluştu', 'error');
    }
  } catch (e) { toast('Bağlantı hatası', 'error'); }
  if (btn) btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
}

async function testWorkflowCard(id, btn) {
  const resultDiv = document.getElementById('test-result-' + id);
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⟳ Test çalışıyor...';
  if (resultDiv) resultDiv.style.display = 'none';

  try {
    const res = await fetch(API + '/api/automations/' + id + '/test', {
      method: 'POST', headers: authHeaders()
    });
    const data = await res.json();

    if (resultDiv) {
      const ok = data.success;
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <div style="background:${ok ? '#052e16' : '#2d0a0a'};border:1px solid ${ok ? '#16a34a' : '#ef4444'};
                    border-radius:8px;padding:10px 12px">
          <div style="font-size:12px;font-weight:600;color:${ok ? '#4ade80' : '#f87171'};margin-bottom:6px">
            ${data.message || (ok ? '✓ Başarılı' : '✗ Başarısız')}
          </div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px">⏱ ${data.duration}</div>
          ${(data.actions || []).map(a => `
            <div style="display:flex;align-items:center;gap:6px;font-size:11px;
                        color:${a.success ? '#4ade80' : '#f87171'};margin-top:3px">
              ${a.success ? '✓' : '✗'} <strong>${a.label}</strong>
              <span style="color:var(--muted)">— ${a.detail}</span>
              ${a.simulated ? '<span style="color:#475569;font-size:10px">(simülasyon)</span>' : ''}
            </div>`).join('')}
        </div>`;
    }

    const rule = allRules.find(r => r.id === id);
    if (rule) {
      rule.last_fired = new Date().toISOString();
      rule.run_count = (rule.run_count || 0) + 1;
    }
    updateStats();
    const card = document.getElementById('rule-' + id);
    if (card && rule) {
      const stats = card.querySelectorAll('.flow-stat');
      if (stats[0]) stats[0].textContent = rule.run_count + ' çalışma';
      if (stats[1]) stats[1].textContent = 'Son: az önce';
    }

  } catch (err) {
    if (resultDiv) {
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <div style="background:#2d0a0a;border:1px solid #ef4444;border-radius:8px;
                    padding:10px;font-size:12px;color:#f87171">
          ✗ Test çalıştırılamadı: ${err.message}
        </div>`;
    }
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}

async function deleteRule(id) {
  if (!confirm('Bu otomasyonu silmek istediğinizden emin misiniz?')) return;
  try {
    await fetch(API + '/api/automations/' + id, { method: 'DELETE', headers: authHeaders() });
    allRules = allRules.filter(r => r.id !== id);
    renderRules();
    updateStats();
    toast('Otomasyon silindi');
  } catch { toast('Silme başarısız', 'error'); }
}

function editRule(id) {
  const rule = allRules.find(r => r.id === id);
  if (!rule) return;
  openBuilder(rule, id);
}

// ── SHOW RUN DETAIL ────────────────────────────────────────────────────────
function showRunDetail(id) {
  const run = allRuns.find(r => r.id === id);
  if (!run) return;
  currentRunId = run.rule_id;

  const dur = run.duration_ms ? (run.duration_ms / 1000).toFixed(2) + 's' : '—';
  const started = run.started_at ? new Date(run.started_at).toLocaleString('tr-TR') : '—';
  const actionResults = Array.isArray(run.action_results) ? run.action_results : [];

  document.getElementById('run-detail-body').innerHTML = `
    <div class="run-detail-grid">
      <div class="rd-cell"><div class="rd-cell-label">Durum</div><div class="rd-cell-val"><span class="run-badge badge-${run.status}">${STATUS_LABELS[run.status] || run.status}</span></div></div>
      <div class="rd-cell"><div class="rd-cell-label">Süre</div><div class="rd-cell-val">${dur}</div></div>
      <div class="rd-cell"><div class="rd-cell-label">Başlangıç</div><div class="rd-cell-val" style="font-size:12px">${started}</div></div>
      <div class="rd-cell"><div class="rd-cell-label">Tetikleyen</div><div class="rd-cell-val">${run.triggered_by || '—'}</div></div>
    </div>
    ${run.error_message ? `<div style="background:var(--rose-soft);border:1px solid var(--rose-line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--rose);margin-bottom:14px"><strong>Hata:</strong> ${escHtml(run.error_message)}</div>` : ''}
    ${actionResults.length ? `
      <div class="section-label" style="margin-bottom:8px">Aksiyon Sonuçları</div>
      ${actionResults.map(ar => `
        <div class="action-result-row">
          <div class="ar-icon status-${ar.status || 'pending'}">${ar.status === 'success' ? '✓' : ar.status === 'error' ? '✕' : '→'}</div>
          <div class="ar-body">
            <div class="ar-type">${ACTION_LABELS[ar.type] || ar.type}</div>
            <div class="ar-status">${ar.status === 'error' ? (ar.error || 'Hata') : ar.status === 'skipped' ? (ar.result?.reason || 'Atlandı') : 'Başarılı'}</div>
          </div>
        </div>`).join('')}` : '<p style="font-size:13px;color:var(--muted)">Aksiyon detayı yok.</p>'}
  `;

  document.getElementById('run-overlay').classList.add('open');
}

async function retryRun() {
  if (!currentRunId) return;
  document.getElementById('run-overlay').classList.remove('open');
  await runRule(currentRunId);
}

function openBuilder(prefillOrApp, id) {
  builderTrigger = null;
  builderActions = [];
  builderSelectedNode = null;
  builderEditId = id || null;
  document.getElementById('builder-name').value = '';

  if (prefillOrApp && typeof prefillOrApp === 'object' && (prefillOrApp.trigger_config || prefillOrApp.name)) {
    // Full rule prefill (edit or template)
    const p = prefillOrApp;
    document.getElementById('builder-name').value = p.name || '';
    if (p.trigger_config) builderTrigger = JSON.parse(JSON.stringify(p.trigger_config));
    const ac = p.action_config;
    builderActions = Array.isArray(ac) ? JSON.parse(JSON.stringify(ac)) : (ac ? [JSON.parse(JSON.stringify(ac))] : []);
  } else if (typeof prefillOrApp === 'string') {
    // App tile clicked — preset first action
    builderActions = [{ type: prefillOrApp }];
  } else {
    builderActions = [];
  }

  const section = document.getElementById('builder-section');
  section.classList.add('open');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  renderBuilderCanvas();
  renderBuilderConfig();
}

function closeBuilder() {
  document.getElementById('builder-section').classList.remove('open');
  document.getElementById('builder-config').classList.remove('open');
  builderTrigger = null;
  builderActions = [];
  builderSelectedNode = null;
  builderEditId = null;
}

function renderBuilderCanvas() {
  const canvas = document.getElementById('builder-canvas');
  let html = '';

  // Trigger node
  const tSel = builderSelectedNode === 'trigger';
  const tType = builderTrigger ? BUILDER_TRIGGER_TYPES.find(t => t.v === builderTrigger.type) : null;
  html += `<div class="c-node trigger-node${tSel ? ' selected' : ''}" onclick="selectBuilderNode('trigger')">
    <div class="c-node-badge">Tetikleyici</div>
    <div class="c-node-icon">${tType ? tType.icon : '⚡'}</div>
    <div class="c-node-label">${tType ? tType.l : 'Tetikleyici Seç'}</div>
    ${builderTrigger?.column ? `<div class="c-node-sub">${escHtml(builderTrigger.column)}</div>` : ''}
  </div>`;

  // Action nodes
  builderActions.forEach((act, i) => {
    const aSel = builderSelectedNode === i;
    const aType = act.type ? BUILDER_APP_TYPES.find(a => a.v === act.type) : null;
    html += `<div class="c-connector"><div class="c-conn-line"></div><div class="c-conn-arrow"></div></div>
    <div class="c-node action-node${aSel ? ' selected' : ''}" onclick="selectBuilderNode(${i})">
      <button class="c-node-del" onclick="event.stopPropagation();removeBuilderAction(${i})">✕</button>
      <div class="c-node-badge">Aksiyon ${builderActions.length > 1 ? i + 1 : ''}</div>
      <div class="c-node-icon">${aType ? aType.icon : '📤'}</div>
      <div class="c-node-label">${aType ? aType.l : 'Uygulama Seç'}</div>
      ${act.to ? `<div class="c-node-sub">${escHtml(act.to)}</div>` : act.webhookUrl ? `<div class="c-node-sub">webhook</div>` : ''}
    </div>`;
  });

  // Add action button
  html += `<div class="c-connector"><div class="c-conn-line"></div><div class="c-conn-arrow"></div></div>
  <button class="c-add-btn" onclick="addBuilderAction()" title="Aksiyon Ekle">+</button>`;

  canvas.innerHTML = html;

  const hint = document.getElementById('builder-hint');
  const testBtn = document.getElementById('btn-test-builder');
  if (!builderTrigger) {
    hint.textContent = 'Tetikleyici node\'una tıklayarak başlayın';
  } else if (!builderActions.length || !builderActions[0]?.type) {
    hint.textContent = '→ Şimdi bir aksiyon uygulaması seçin';
  } else {
    hint.textContent = '✓ Workflow hazır — Kaydet\'e tıklayın';
  }
  testBtn.style.display = builderEditId ? '' : 'none';
}

function selectBuilderNode(nodeId) {
  builderSelectedNode = nodeId;
  renderBuilderCanvas();
  renderBuilderConfig();
}

function renderBuilderConfig() {
  const el = document.getElementById('builder-config');
  if (builderSelectedNode === null) { el.classList.remove('open'); el.innerHTML = ''; return; }
  el.classList.add('open');
  if (builderSelectedNode === 'trigger') {
    el.innerHTML = renderTriggerPicker();
  } else {
    el.innerHTML = renderActionPicker(builderSelectedNode) + renderActionConfigFields(builderSelectedNode);
  }
}

function renderTriggerPicker() {
  const sel = builderTrigger?.type;
  const grid = BUILDER_TRIGGER_TYPES.map(t => `
    <div class="trigger-type-card${sel === t.v ? ' selected' : ''}" onclick="selectBuilderTrigger('${t.v}')">
      <span class="trigger-type-card-icon">${t.icon}</span>
      <span class="trigger-type-card-name">${t.l}</span>
    </div>`).join('');

  const fields = builderTrigger ? renderTriggerConfigFieldsInner() : '';
  return `<div class="cfg-title">⚡ Tetikleyici Tipi</div>
    <div class="trigger-type-grid">${grid}</div>${fields}`;
}

function selectBuilderTrigger(type) {
  builderTrigger = { type };
  renderBuilderCanvas();
  renderBuilderConfig();
}

function selectBuilderAction(idx, type) {

// ── DEĞİŞKEN CHIPS YARDIMCILARI ──────────────────────────────────────────
const COMMON_VARS = ['Müşteri', 'Ürün', 'Tutar', 'Tarih', 'Durum', 'Stok', 'Temsilci'];

function getBuilderVars() {
  const triggerCol = builderTrigger?.column;
  const cols = triggerCol ? [triggerCol, ...COMMON_VARS.filter(c => c !== triggerCol)] : COMMON_VARS;
  return cols.slice(0, 6);
}

function renderVarChipsHtml(idx, targetId) {
  const vars = getBuilderVars();
  const chips = vars.map(v =>
    `<button type="button" class="var-chip" onclick="insertVar('${targetId}','${v}',${idx})">{${v}}</button>`
  ).join('');
  return `<div class="var-chips-wrap"><div class="var-chips">${chips}</div><div class="var-chips-hint">Sütun adına tıklayarak mesaja ekle</div></div>`;
}

function insertVar(targetId, varName, idx) {
  const el = document.getElementById(targetId);
  if (!el) return;
  const pos = el.selectionStart ?? el.value.length;
  const ins = `{${varName}}`;
  el.value = el.value.slice(0, pos) + ins + el.value.slice(pos);
  el.dispatchEvent(new Event('input'));
  el.focus();
  el.setSelectionRange(pos + ins.length, pos + ins.length);
}

function previewMsg(msg) {
  if (!msg) return '<span style="color:var(--muted)">Mesaj yazınca önizleme burada görünür</span>';
  const vars = getBuilderVars();
  let out = escHtml(msg);
  const samples = { Müşteri:'ACME Ltd.', Ürün:'Laptop Kılıfı', Tutar:'1.500 ₺', Tarih:'31.05.2026', Durum:'Onaylandı', Stok:'3', Temsilci:'Ahmet Y.' };
  vars.forEach(v => { out = out.replace(new RegExp(`\\{${v}\\}`, 'g'), `<strong>${samples[v] || v}</strong>`); });
  return out;
}

function updateMsgPreview(inputId, previewId) {
  const inp = document.getElementById(inputId);
  const box = document.getElementById(previewId);
  if (!inp || !box) return;
  box.querySelector('.msg-preview-text').innerHTML = previewMsg(inp.value);
}

function renderActionConfigFields(idx) {
  const act = builderActions[idx];
  if (!act || !act.type) return '';
  const esc = escHtml;
  let html = '<div class="field-row" style="margin-top:4px">';
  switch (act.type) {
    case 'gmail':
      html += `
        <div class="field"><label class="lbl">Alıcı (To)</label>

        </div>`;
      break;
    case 'slack':
    case 'teams':
      html += `
        <div class="field"><label class="lbl">Webhook URL</label>
          <input class="inp" type="url" placeholder="https://hooks.slack.com/..." value="${esc(act.webhookUrl||'')}" oninput="builderActions[${idx}].webhookUrl=this.value">

          <input class="inp" id="act-msg-${idx}" type="text" placeholder="Mesaj metni, {Sütun} kullanabilirsiniz" value="${esc(act.message||'')}" oninput="builderActions[${idx}].message=this.value;updateMsgPreview('act-msg-${idx}','msg-prev-${idx}')">
          ${renderVarChipsHtml(idx, 'act-msg-' + idx)}
          <div class="msg-preview-box" id="msg-prev-${idx}"><div class="msg-preview-label">Önizleme</div><div class="msg-preview-text">${previewMsg(act.message||'')}</div></div>
