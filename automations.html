<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automations – Mocksheets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='23' text-anchor='middle' font-family='Arial Black,sans-serif' font-weight='900' font-size='18' fill='white'>M</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FAFAF7; --surface:#FFFFFF; --surface-2:#F5F5F1;
  --line:#E8E7E1; --line-2:#EFEEE8;
  --ink:#0E1116; --ink-2:#3A3F47; --muted:#7A7F87; --muted-2:#A6A9AF;
  --accent:#4F46E5; --accent-soft:#EEF0FF;
  --green:#0F9D58; --green-soft:#E4F5EC;
  --amber:#B45309; --amber-soft:#FDF3E1;
  --rose:#E11D48; --rose-soft:#FCE7EE;
  --blue:#2563EB; --blue-soft:#E6EEFE;
  --violet:#7C3AED; --violet-soft:#F0E7FE;
  --teal:#0D9488; --teal-soft:#DDF3F1;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOP BAR */
#top-bar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{width:32px;height:32px;border-radius:8px;object-fit:contain;flex-shrink:0}
.tb-brand{font-weight:700;font-size:15px;color:var(--ink);flex-shrink:0}
.tb-sep{color:var(--muted-2);font-size:14px;flex-shrink:0}
.tb-breadcrumb{color:var(--muted);font-size:13px;font-weight:500;flex-shrink:0}
#tb-title{background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);outline:none;min-width:120px;max-width:220px;padding:4px 6px;border-radius:6px;transition:background .15s}
#tb-title:hover,#tb-title:focus{background:var(--surface-2)}
.tb-dirty{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0}
.tb-spacer{flex:1}
.tb-btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .12s;white-space:nowrap}
.tb-btn:hover{background:var(--surface-2)}
.tb-btn-save{background:var(--ink);color:#fff;border-color:transparent}
.tb-btn-save:hover{background:#1e2329}
.tb-btn-run{background:var(--accent);color:#fff;border-color:transparent}
.tb-btn-run:hover{background:#4338CA}
.tb-btn-run.running{background:var(--green)}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}

/* BODY */
#body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{width:308px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:12px 12px 0}
.sb-search{width:100%;height:38px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px}
.sb-search input{background:none;border:none;outline:none;font-family:inherit;font-size:13px;color:var(--ink);flex:1}
.sb-search input::placeholder{color:var(--muted-2)}
.sb-filters{display:flex;gap:6px;padding:8px 12px}
.sb-chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .12s}
.sb-chip.active{background:var(--ink);color:#fff;border-color:transparent}
.sb-list{flex:1;overflow-y:auto;padding:4px 8px 16px}
.sb-list::-webkit-scrollbar{width:4px}
.sb-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.sb-section-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted-2);text-transform:uppercase;padding:12px 4px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:grab;transition:background .1s;user-select:none}
.sb-item:hover{background:var(--surface-2)}
.sb-item:active{cursor:grabbing}
.sb-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-info{flex:1;min-width:0}
.sb-name{font-size:13px;font-weight:600;color:var(--ink)}
.sb-desc{font-size:11px;color:var(--muted);margin-top:1px}

/* CANVAS */
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#canvas{width:100%;height:100%;position:absolute;inset:0;cursor:default}
#world{position:absolute;top:0;left:0;transform-origin:0 0;width:0;height:0}
#edge-svg{position:absolute;top:0;left:0;width:0;height:0;overflow:visible;pointer-events:none;z-index:2}

/* NODE CARDS */
.node-card{position:absolute;width:220px;height:76px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:border-color .15s,box-shadow .15s;user-select:none}
.node-card:hover{border-color:var(--muted-2)}
.node-card.selected{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.node-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.node-body{flex:1;min-width:0}
.node-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:1px}
.node-title{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-dot{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%}
.node-dot.cfg{background:var(--green)}
.node-dot.pend{background:var(--muted-2)}
.node-port{position:absolute;width:14px;height:14px;border-radius:50%;top:31px;background:var(--surface);border:2px solid var(--muted-2);cursor:crosshair;z-index:10;transition:border-color .12s,transform .12s}
.node-port:hover{border-color:var(--accent);transform:scale(1.25)}
.node-port.port-out{right:-7px}
.node-port.port-in{left:-7px}
@keyframes nodeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.node-new{animation:nodeIn .18s ease}

/* INSPECTOR */
#inspector{width:340px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.ins-head{padding:16px 20px 14px;border-bottom:1px solid var(--line-2);flex-shrink:0}
.ins-head-title{font-size:15px;font-weight:700;color:var(--ink)}
.ins-head-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ins-body{flex:1;overflow-y:auto;padding:16px 20px}
.ins-body::-webkit-scrollbar{width:4px}
.ins-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.ins-section{margin-bottom:20px}
.ins-section-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px}
.ins-field{margin-bottom:12px}
.ins-label{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block}
.ins-select,.ins-input{width:100%;height:36px;padding:0 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;color:var(--ink);outline:none;transition:border-color .12s}
.ins-select:focus,.ins-input:focus{border-color:var(--accent)}
.ins-segmented{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.ins-seg-btn{flex:1;height:28px;border:none;background:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .12s}
.ins-seg-btn.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ins-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2)}
.ins-toggle-row:last-child{border-bottom:none}
.ins-toggle-lbl{font-size:13px;color:var(--ink-2)}
.ins-toggle{width:36px;height:20px;background:var(--muted-2);border-radius:10px;position:relative;cursor:pointer;transition:background .15s;border:none;flex-shrink:0}
.ins-toggle.on{background:var(--accent)}
.ins-toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.ins-toggle.on::after{left:18px}
.ins-action-btn{width:100%;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .12s;margin-top:8px}
.ins-action-btn:hover{background:var(--surface-2)}
.ins-action-btn.danger{color:var(--rose);border-color:var(--rose-soft)}
.ins-action-btn.danger:hover{background:var(--rose-soft)}
.ins-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.ins-stat{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:12px}
.ins-stat-val{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:var(--ink)}
.ins-stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.ins-shortcut-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2)}
.ins-shortcut-row:last-child{border-bottom:none}
.ins-shortcut-desc{font-size:12px;color:var(--muted)}
.ins-shortcut-key{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:2px 6px}

/* SIDEBAR SUGGEST */
.sb-suggest-btn{width:100%;height:34px;margin-top:8px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.sb-suggest-btn:hover{background:var(--accent);color:#fff}
.sb-suggest-btn:disabled{opacity:.5;cursor:default}

/* SAVED RULES */
.saved-rule-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line-2);margin-bottom:6px;background:var(--surface)}
.saved-rule-info{flex:1;min-width:0}
.saved-rule-name{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-rule-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-top:2px;display:inline-block}
.saved-rule-del{width:28px;height:28px;border:none;background:none;color:var(--muted-2);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.saved-rule-del:hover{background:var(--rose-soft);color:var(--rose)}

/* HUD */
#hud-count{position:absolute;top:16px;right:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink-2);box-shadow:0 1px 4px rgba(0,0,0,.07);pointer-events:none}
#hud-legend{position:absolute;bottom:20px;left:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.07);pointer-events:none}
.hud-leg-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.hud-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#hud-zoom{position:absolute;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.hud-zoom-btn{width:36px;height:36px;border:none;background:none;font-size:16px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s}
.hud-zoom-btn:hover{background:var(--surface-2)}
#hud-zoom-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2);min-width:46px;text-align:center;border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);height:36px;display:flex;align-items:center;justify-content:center}
#empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.empty-hint-icon{width:52px;height:52px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty-hint-title{font-size:16px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.empty-hint-sub{font-size:13px;color:var(--muted);text-align:center;max-width:230px;line-height:1.5}

/* TOASTS */
#toast-area{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:10px 18px;border-radius:100px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:toastIn .22s ease;pointer-events:auto}
.toast-light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.toast-dark{background:#0E1116;color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulseAnim 1s ease infinite;flex-shrink:0}
@keyframes pulseAnim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
</style>
</head>
<body>

<div id="top-bar"></div>
<div id="body">
  <div id="sidebar">
    <div class="sb-head">
      <div class="sb-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted-2);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="sb-search-input" placeholder="Ara…" type="text" autocomplete="off">
      </div>
      <button class="sb-suggest-btn" id="sb-suggest-btn" onclick="suggestRules()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l1.9 5.8L20 10l-6.1 2.2L12 18l-1.9-5.8L4 10l6.1-2.2z"/></svg>
        AI Öner
      </button>
    </div>
    <div class="sb-filters">
      <button class="sb-chip active" data-filter="Tümü">Tümü</button>
      <button class="sb-chip" data-filter="Tetikleyici">Tetikleyici</button>
      <button class="sb-chip" data-filter="Aksiyon">Aksiyon</button>
    </div>
    <div class="sb-list" id="sb-list"></div>
  </div>

  <div id="canvas-wrap">
    <div id="canvas">
      <div id="world">
        <svg id="edge-svg"></svg>
      </div>
    </div>
    <div id="empty-hint">
      <div class="empty-hint-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--muted-2)" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="empty-hint-title">Otomasyon oluştur</div>
      <div class="empty-hint-sub">Soldaki panelden bir tetikleyici sürükleyerek başla</div>
    </div>
    <div id="hud-count"></div>
    <div id="hud-legend">
      <div class="hud-leg-row"><div class="hud-dot" style="background:var(--green)"></div>Yapılandırıldı</div>
      <div class="hud-leg-row"><div class="hud-dot" style="background:var(--muted-2)"></div>Bekliyor</div>
    </div>
    <div id="hud-zoom">
      <button class="hud-zoom-btn" onclick="adjustZoom(-1)">−</button>
      <div id="hud-zoom-val">100%</div>
      <button class="hud-zoom-btn" onclick="adjustZoom(1)">+</button>
      <button class="hud-zoom-btn" style="font-size:12px;font-weight:600;width:42px" onclick="fitView()">Sığ</button>
    </div>
  </div>

  <div id="inspector"></div>
</div>
<div id="toast-area"></div>

<script src="api.js" onerror="console.warn('api.js yüklenemedi')"></script>
<script src="js/automations.js" onerror="console.warn('js/automations.js yüklenemedi')"></script>
<script>
// ── AUTH GUARD ────────────────────────────────────────────────
(function(){
  const k = Object.keys(localStorage).find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
  if (!k || !localStorage.getItem(k)) window.location.href = 'auth.html';
})();

// ── NODE DEFINITIONS ──────────────────────────────────────────
const NODE_W = 220, NODE_H = 76;

const TONES = {
  amber:  { bg:'var(--amber-soft)',  fg:'var(--amber)'  },
  violet: { bg:'var(--violet-soft)', fg:'var(--violet)' },
  teal:   { bg:'var(--teal-soft)',   fg:'var(--teal)'   },
  blue:   { bg:'var(--blue-soft)',   fg:'var(--blue)'   },
  rose:   { bg:'var(--rose-soft)',   fg:'var(--rose)'   },
  green:  { bg:'var(--green-soft)',  fg:'var(--green)'  },
};

const DEFS = [
  { defId:'sheet-change',  name:'Sheet Değişikliği', kind:'trigger', tone:'amber',  desc:'Sayfa güncellenince tetikle' },
  { defId:'cell-condition',name:'Hücre Koşulu',      kind:'trigger', tone:'violet', desc:'Koşul sağlandığında tetikle' },
  { defId:'schedule',      name:'Zamanlama',          kind:'trigger', tone:'teal',   desc:'Belirli aralıklarla çalıştır' },
  { defId:'form-submit',   name:'Form Gönder',        kind:'trigger', tone:'blue',   desc:'Form gönderilince tetikle' },
  { defId:'webhook',       name:'Webhook',             kind:'trigger', tone:'rose',   desc:'HTTP isteğinde tetikle' },
  { defId:'slack',         name:'Slack',               kind:'action',  tone:'violet', desc:'Slack kanalına mesaj gönder' },
  { defId:'make',          name:'Make',                kind:'action',  tone:'violet', desc:'Make senaryosu tetikle' },
  { defId:'teams',         name:'Microsoft Teams',     kind:'action',  tone:'blue',   desc:'Teams kanalına mesaj gönder' },
  { defId:'notion',        name:'Notion',              kind:'action',  tone:'amber',  desc:'Notion veritabanına yaz' },
  { defId:'sheets',        name:'Google Sheets',       kind:'action',  tone:'green',  desc:'Google Sheets güncelle' },
  { defId:'airtable',      name:'Airtable',            kind:'action',  tone:'blue',   desc:'Airtable kaydı oluştur' },
  { defId:'email',         name:'E-posta',             kind:'action',  tone:'rose',   desc:'E-posta gönder' },
  { defId:'filter',        name:'Filtre',              kind:'action',  tone:'teal',   desc:'Koşullu dal oluştur' },
];

function getDef(defId){ return DEFS.find(d => d.defId === defId); }

// ── ICONS ────────────────────────────────────────────────────
const ICONS = {
  'sheet-change'  :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  'cell-condition':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
  'schedule'      :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',

  'webhook'       :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 16.98h-5.99c-1.1 0-1.95.94-2.48 1.9A4 4 0 0 1 2 17c.01-.7.2-1.4.57-2"/><path d="m6 17 3.13-5.78c.53-.97.1-2.18-.5-3.1a4 4 0 1 1 6.89-4.06"/><path d="m12 6 3.13 5.73C15.66 12.7 16.9 13 18 13a4 4 0 0 1 0 8"/></svg>',

// ── SIDEBAR ──────────────────────────────────────────────────
function initSidebar(){
  $id('sb-search-input').addEventListener('input', e => { S.query = e.target.value; updateSidebarList(); });
  document.querySelectorAll('.sb-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      S.filter = btn.dataset.filter;
      document.querySelectorAll('.sb-chip').forEach(b => b.classList.toggle('active', b === btn));
      updateSidebarList();
    });
  });
  updateSidebarList();
}

function updateSidebarList(){
  const q = S.query.toLowerCase();
  const filtered = DEFS.filter(d => {
    const km = S.filter==='Tümü' || (S.filter==='Tetikleyici'&&d.kind==='trigger') || (S.filter==='Aksiyon'&&d.kind==='action');
    const qm = !q || d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q);
    return km && qm;
  });
  const trigs = filtered.filter(d => d.kind==='trigger');
  const acts  = filtered.filter(d => d.kind==='action');
  let html = '';
  if(trigs.length){ html += '<div class="sb-section-label">Tetikleyiciler</div>' + trigs.map(sbRow).join(''); }
  if(acts.length){  html += '<div class="sb-section-label">Aksiyonlar</div>'    + acts.map(sbRow).join(''); }
  if(!filtered.length) html = '<div style="padding:24px 12px;text-align:center;color:var(--muted);font-size:13px">Sonuç bulunamadı</div>';
  $id('sb-list').innerHTML = html;
  $id('sb-list').querySelectorAll('.sb-item').forEach(el => {
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('defId', el.dataset.defId); e.dataTransfer.effectAllowed='copy'; });
    el.addEventListener('dblclick', () => {
      const wrap = $id('canvas-wrap');
      const cx = (wrap.offsetWidth/2 - S.pan.x) / S.zoom;
      const cy = (wrap.offsetHeight/2 - S.pan.y) / S.zoom;
      addNode(el.dataset.defId, cx - NODE_W/2, cy - NODE_H/2);
    });
  });
}

function sbRow(d){
  const t = TONES[d.tone];
  return `<div class="sb-item" data-def-id="${d.defId}">
    <div class="sb-icon" style="background:${t.bg};color:${t.fg}">${icon(d.defId, 18)}</div>
    <div class="sb-info"><div class="sb-name">${esc(d.name)}</div><div class="sb-desc">${esc(d.desc)}</div></div>
  </div>`;
}

function sel(name, opts, val){ return `<select class="ins-select" data-cfg="${name}">${opts.map(o=>`<option value="${o.v}" ${val===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`; }
function inp(name, placeholder, val, type){ return `<input class="ins-input" type="${type||'text'}" data-cfg="${name}" value="${esc(val||'')}" placeholder="${esc(placeholder||'')}"/>`; }
function fld(label, inner){ return `<div class="ins-field"><label class="ins-label">${label}</label>${inner}</div>`; }
function seg(label, name, opts, val){
  const btns = opts.map(o=>`<button class="ins-seg-btn ${(val||opts[0].v)===o.v?'active':''}" data-cfg="${name}" data-val="${o.v}" onclick="clickSeg(this)">${o.l}</button>`).join('');
  return `<div class="ins-field"><label class="ins-label">${label}</label><div class="ins-segmented">${btns}</div></div>`;
}

function buildConfig(defId, c){
  let html = '<div class="ins-section"><div class="ins-section-label">Yapılandırma</div>';
  switch(defId){
    case 'sheet-change':
      html += fld('Sheet', sel('sheet',[{v:'active',l:'Aktif Sheet'},{v:'Sheet1',l:'Sheet1'},{v:'Sheet2',l:'Sheet2'},{v:'all',l:'Tümü'}], c.sheet||'active'));
      html += fld('Kolon', inp('column','A',c.column));
      html += seg('Olay','event',[{v:'edit',l:'Düzenlenince'},{v:'add',l:'Eklenince'},{v:'delete',l:'Silinince'}], c.event);
      break;
    case 'cell-condition':
      html += fld('Sütun adı', inp('column','ÖrnekSütun',c.column));
      html += fld('Operatör', sel('operator',[{v:'equals',l:'Eşittir'},{v:'not_equals',l:'Eşit değil'},{v:'greater_than',l:'Büyüktür'},{v:'less_than',l:'Küçüktür'},{v:'contains',l:'İçerir'},{v:'is_empty',l:'Boş'}], c.operator||'equals'));
      html += fld('Değer', inp('value','',c.value));
      break;
    case 'schedule':
      html += fld('Aralık', sel('interval',[{v:'5m',l:'Her 5 dakika'},{v:'15m',l:'Her 15 dakika'},{v:'1h',l:'Her saat'},{v:'1d',l:'Her gün'},{v:'1w',l:'Her hafta'}], c.interval||'1h'));
      html += fld('Saat dilimi', sel('timezone',[{v:'Europe/Istanbul',l:'İstanbul (UTC+3)'},{v:'UTC',l:'UTC'},{v:'Europe/London',l:'Londra'}], c.timezone||'Europe/Istanbul'));
      break;
    case 'form-submit':
      html += fld('Form ID', inp('formId','',c.formId));
      html += fld('Yönlendirme URL', inp('redirectUrl','https://',c.redirectUrl));
      break;
    case 'webhook':
      html += `<div class="ins-field"><label class="ins-label">Webhook URL</label><div style="display:flex;gap:6px"><input class="ins-input" style="font-family:'JetBrains Mono',monospace;font-size:11px" value="https://hook.mocksheet.app/wh/..." readonly><button class="ins-action-btn" style="width:78px;margin:0;flex-shrink:0" onclick="showToast('URL kopyalandı','light',2000)">Kopyala</button></div></div>`;
      html += fld('Yöntem', sel('method',[{v:'POST',l:'POST'},{v:'GET',l:'GET'},{v:'PUT',l:'PUT'}], c.method||'POST'));
      break;
    case 'slack':
      html += fld('Webhook URL', inp('webhookUrl','https://hooks.slack.com/services/…',c.webhookUrl));
      html += fld('Kanal', inp('channel','#genel',c.channel));
      html += fld('Mesaj', inp('message','{Ad} güncellendi',c.message));
      break;
    case 'make':
      html += fld('Webhook URL', inp('webhookUrl','https://hook.make.com/…',c.webhookUrl));
      html += fld('Olay adı', inp('event','auto_trigger',c.event));
      break;
    case 'teams':
      html += fld('Webhook URL', inp('webhookUrl','https://…webhook.office.com/…',c.webhookUrl));
      html += fld('Mesaj', inp('message','{Ad} güncellendi',c.message));
      break;
    case 'notion':
      html += fld('API Token', inp('token','secret_…',c.token,'password'));
      html += fld('Veritabanı ID', inp('databaseId','',c.databaseId));
      html += fld('Başlık alanı', inp('titleField','Name',c.titleField));
      break;
    case 'sheets':
      html += fld('Spreadsheet ID', inp('spreadsheetId','',c.spreadsheetId));
      html += fld('Sheet adı', inp('sheetName','Sheet1',c.sheetName));
      html += fld('İşlem', sel('operation',[{v:'append',l:'Satır ekle'},{v:'update',l:'Güncelle'},{v:'read',l:'Oku'}], c.operation||'append'));
      break;
    case 'airtable':
      html += fld('API Key', inp('apiKey','pat…',c.apiKey,'password'));
      html += fld('Base ID', inp('baseId','app…',c.baseId));
      html += fld('Tablo adı', inp('tableName','',c.tableName));
      html += fld('İşlem', sel('operation',[{v:'create',l:'Kayıt oluştur'},{v:'update',l:'Güncelle'},{v:'find',l:'Bul'}], c.operation||'create'));
      break;
    case 'email':
      html += fld('Alıcı', inp('to','',c.to,'email'));
      html += fld('Konu', inp('subject','',c.subject));
      html += fld('İçerik', inp('body','',c.body));
      break;
    case 'filter':
      html += fld('Girdi', inp('input','',c.input));
      html += fld('Koşul', sel('condition',[{v:'truthy',l:'Doğruysa devam'},{v:'falsy',l:'Yanlışsa devam'},{v:'always',l:'Her zaman'}], c.condition||'truthy'));
      break;
  }
  return html + '</div>';
}

function updateCfg(el){
  if(!S.selectedId) return;
  const node = S.nodes[S.selectedId];
  if(!node.config) node.config = {};
  node.config[el.dataset.cfg] = el.value;
  node.configured = isConfigured(node);
  S.dirty = true;
  renderNodeCard(S.selectedId);
  syncIntConfig(node);
}

function syncIntConfig(node){
  const c = node.config || {};
  const def = getDef(node.defId);
  if(!def || def.kind !== 'action') return;
  if(c.webhookUrl) localStorage.setItem(`int_${node.defId}`, JSON.stringify({url: c.webhookUrl}));
  if(node.defId === 'notion'   && c.token)  localStorage.setItem('int_notion',   JSON.stringify({token: c.token,  databaseId: c.databaseId}));
  if(node.defId === 'airtable' && c.apiKey) localStorage.setItem('int_airtable', JSON.stringify({token: c.apiKey, baseId: c.baseId}));
}

function toggleCfg(btn){
  if(!S.selectedId) return;
  const node = S.nodes[S.selectedId];
  if(!node.config) node.config = {};
  const k = btn.dataset.cfg;
  node.config[k] = !node.config[k];
  btn.classList.toggle('on', !!node.config[k]);
  S.dirty = true;
}

function clickSeg(btn){
  btn.closest('.ins-segmented').querySelectorAll('.ins-seg-btn').forEach(b => b.classList.toggle('active', b===btn));
  if(!S.selectedId) return;
  const node = S.nodes[S.selectedId];
  if(!node.config) node.config = {};
  node.config[btn.dataset.cfg] = btn.dataset.val;
  S.dirty = true;
}

function isConfigured(node){
  const c = node.config||{};
  switch(node.defId){
    case 'sheet-change':   return !!c.sheet;
    case 'cell-condition': return !!(c.column && c.operator);
    case 'schedule':       return !!c.interval;
    case 'slack':          return !!(c.webhookUrl && c.channel && c.message);
    case 'make':           return !!c.webhookUrl;
    case 'teams':          return !!(c.webhookUrl && c.message);
    case 'email':          return !!(c.to && c.subject);
    case 'notion':         return !!(c.token && c.databaseId);
    case 'sheets':         return !!c.spreadsheetId;
    case 'airtable':       return !!(c.apiKey && c.baseId && c.tableName);
    default:               return false;
  }
}

// ── CANVAS WORLD ─────────────────────────────────────────────
function applyTransform(){
  $id('world').style.transform = `translate(${S.pan.x}px,${S.pan.y}px) scale(${S.zoom})`;
  const sz = 24 * S.zoom;
  const c = $id('canvas');
  c.style.backgroundImage = 'radial-gradient(circle, #CBD5E1 1px, transparent 1px)';
  c.style.backgroundSize  = `${sz}px ${sz}px`;
  c.style.backgroundPosition = `${S.pan.x % sz}px ${S.pan.y % sz}px`;
  $id('hud-zoom-val').textContent = `${Math.round(S.zoom*100)}%`;
}

function renderNodes(){
  const world = $id('world');
  const existing = new Set([...world.querySelectorAll('.node-card')].map(el=>el.dataset.id));
  const current  = new Set(Object.keys(S.nodes));
  existing.forEach(id => { if(!current.has(id)){ const el=world.querySelector(`.node-card[data-id="${id}"]`); if(el) el.remove(); } });
  current.forEach(id  => {
    if(!existing.has(id)){
      const el = document.createElement('div');
      el.className = 'node-card node-new';
      el.dataset.id = id;
      world.appendChild(el);
      attachNodeEvents(el, id);
    }
    renderNodeCard(id);
  });
}

function renderNodeCard(id){
  const el = $id('world').querySelector(`.node-card[data-id="${id}"]`);
  if(!el) return;
  const n = S.nodes[id];
  const def = getDef(n.defId);
  const t = TONES[def.tone];
  el.style.left = `${n.x}px`;
  el.style.top  = `${n.y}px`;
  el.classList.toggle('selected', S.selectedId===id);
  el.innerHTML = `
    <div class="node-icon" style="background:${t.bg};color:${t.fg}">${icon(def.defId, 20)}</div>
    <div class="node-body">
      <div class="node-eyebrow">${def.kind==='trigger'?'Tetikleyici':'Aksiyon'}</div>
      <div class="node-title">${esc(def.name)}</div>
      ${n.subtitle?`<div class="node-sub">${esc(n.subtitle)}</div>`:''}
    </div>
    <div class="node-dot ${n.configured?'cfg':'pend'}"></div>
    ${def.kind==='action'?`<div class="node-port port-in" data-port="in" data-node="${id}"></div>`:''}
    <div class="node-port port-out" data-port="out" data-node="${id}"></div>`;
}

function attachNodeEvents(el, id){
  el.addEventListener('mousedown', e => {
    if(e.target.classList.contains('node-port')){
      if(e.target.dataset.port !== 'out') return;
      e.stopPropagation(); e.preventDefault();
      startDrawEdge(id);
      return;
    }
    e.stopPropagation();
    const n = S.nodes[id];
    const origX=n.x, origY=n.y, sx=e.clientX, sy=e.clientY;
    let moved = false;
    const onMove = mv => {
      const dx=(mv.clientX-sx)/S.zoom, dy=(mv.clientY-sy)/S.zoom;
      if(!moved && (Math.abs(dx)>3||Math.abs(dy)>3)) moved=true;
      if(moved){ n.x=origX+dx; n.y=origY+dy; renderNodeCard(id); redrawEdges(); S.dirty=true; }
    };
    const onUp = () => {
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      if(!moved) selectNode(S.selectedId===id ? null : id);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
}

function startDrawEdge(fromId){
  S.drawingEdge = { fromId, curX:null, curY:null };
  const wrap = $id('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const onMove = mv => {
    S.drawingEdge.curX = (mv.clientX-rect.left-S.pan.x)/S.zoom;
    S.drawingEdge.curY = (mv.clientY-rect.top -S.pan.y)/S.zoom;
    redrawEdges();
  };
  const onUp = ev => {
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    const target = ev.target.closest ? ev.target.closest('.node-port') : null;
    if(target && target.dataset.port==='in' && target.dataset.node !== fromId){
      const toId = target.dataset.node;
      if(!S.edges.find(e=>e.from===fromId&&e.to===toId)){
        S.edges.push({id:`e${Date.now()}`,from:fromId,to:toId});
        S.dirty = true;
        renderHUD();
        renderInspector();
      }
    }
    S.drawingEdge = null;
    redrawEdges();
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ── EDGES ────────────────────────────────────────────────────
function bezier(ax,ay,bx,by){
  const dx = Math.max(60, Math.abs(bx-ax)*0.5);
  return `M ${ax} ${ay} C ${ax+dx} ${ay}, ${bx-dx} ${by}, ${bx} ${by}`;
}
function portCoord(id, port){
  const n = S.nodes[id]; if(!n) return null;
  return port==='out' ? {x:n.x+NODE_W, y:n.y+NODE_H/2} : {x:n.x, y:n.y+NODE_H/2};
}

function redrawEdges(){
  const svg = $id('edge-svg');
  let out = `<defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="var(--muted-2)"/></marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="var(--accent)"/></marker>
  </defs>`;
  S.edges.forEach(edge => {
    const a=portCoord(edge.from,'out'), b=portCoord(edge.to,'in');
    if(!a||!b) return;
    const d = bezier(a.x,a.y,b.x,b.y);
    const hi = S.selectedId===edge.from || S.selectedId===edge.to;
    out += `<path d="${d}" fill="none" stroke="${hi?'var(--accent)':'var(--muted-2)'}" stroke-width="${hi?2:1.5}" marker-end="url(#${hi?'arr-a':'arr'})" ${S.running?'stroke-dasharray="6 3"':''}/>`;
    if(S.running){
      out += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="8 16" opacity=".5"><animate attributeName="stroke-dashoffset" values="24;0" dur=".6s" repeatCount="indefinite"/></path>`;
    }
  });
  if(S.drawingEdge && S.drawingEdge.curX !== null){
    const a=portCoord(S.drawingEdge.fromId,'out');
    if(a) out += `<path d="${bezier(a.x,a.y,S.drawingEdge.curX,S.drawingEdge.curY)}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>`;
  }
  svg.innerHTML = out;
}

// ── HUD ──────────────────────────────────────────────────────
function renderHUD(){
  const nc=Object.keys(S.nodes).length, ec=S.edges.length;
  $id('hud-count').textContent = `${nc} node · ${ec} bağlantı`;
  $id('empty-hint').style.display = nc>0 ? 'none' : 'flex';
}

// ── NODE OPS ─────────────────────────────────────────────────
function addNode(defId, x, y){
  const id = `n${S.nextId++}`;
  S.nodes[id] = {id, defId, kind:getDef(defId).kind, x, y, configured:false, config:{}};
  S.dirty = true;
  renderNodes(); redrawEdges(); renderHUD();
  selectNode(id);
}

function removeNode(id){
  if(!id||!S.nodes[id]) return;
  delete S.nodes[id];
  S.edges = S.edges.filter(e=>e.from!==id&&e.to!==id);
  const el=$id('world').querySelector(`.node-card[data-id="${id}"]`);
  if(el) el.remove();
  if(S.selectedId===id) S.selectedId=null;
  S.dirty=true;
  redrawEdges(); renderHUD(); renderInspector(); renderTopBar();
}

function duplicateNode(id){
  const n=S.nodes[id]; if(!n) return;
  const newId=`n${S.nextId++}`;
  S.nodes[newId]={...n, id:newId, x:n.x+30, y:n.y+30, config:{...n.config}};
  S.dirty=true;
  renderNodes(); redrawEdges(); renderHUD(); selectNode(newId);
}

function selectNode(id){
  const prev=S.selectedId;
  S.selectedId=id;
  if(prev&&S.nodes[prev]) renderNodeCard(prev);
  if(id&&S.nodes[id]) renderNodeCard(id);
  renderInspector();
  redrawEdges();
}

async function testNode(){
  if(!S.selectedId) return;
  const node = S.nodes[S.selectedId];
  const def = getDef(node.defId);
  if(!isConfigured(node)){ showToast('⚠ Node yapılandırılmamış — önce ayarları doldurun','light',2500); return; }
  if(def.kind === 'trigger'){ showToast('✓ Tetikleyici yapılandırması geçerli','light',2000); return; }
  syncIntConfig(node);
  const c = node.config || {};
  const BACKEND = window.BACKEND_URL || (window.location.hostname==='localhost' ? 'http://localhost:3001' : 'https://upsheet-ai.onrender.com');
  const token = getAuthToken();
  let endpoint, body;
  switch(node.defId){
    case 'slack':
      endpoint = `${BACKEND}/api/integrations/slack/notify`;
      body = { webhookUrl: c.webhookUrl, title:'Test', message:'Mocksheets otomasyon testi \u2713', fields:[] };
      break;
    case 'make':
      endpoint = `${BACKEND}/api/integrations/make/trigger`;
      body = { webhookUrl: c.webhookUrl, event:'test', data:{ source:'mocksheets_test', timestamp: new Date().toISOString() } };
      break;
    case 'teams':
      endpoint = `${BACKEND}/api/integrations/teams/notify`;
      body = { webhookUrl: c.webhookUrl, title:'Test', message:'Mocksheets otomasyon testi \u2713', fields:[] };
      break;
    default:
      showToast(`\u2713 ${def.name} yap\u0131land\u0131rmas\u0131 ge\u00e7erli`,'light',2000);
      return;
  }
  showToast('<div class="pulse"></div> Test g\u00f6nderiliyor\u2026','dark',2500);
  try {
    const res = await fetch(endpoint, {
      method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${token}`},
      body: JSON.stringify(body)
    });
    if(res.ok){ showToast(`\u2713 ${def.name} test ba\u015far\u0131l\u0131 \u2014 mesaj g\u00f6nderildi`,'light',3000); }
    else { const d = await res.json().catch(()=>({})); showToast(`\u26a0 Test ba\u015far\u0131s\u0131z: ${d.error||res.status}`,'light',3000); }
  } catch(e){ showToast(`\u26a0 Test hatas\u0131: ${e.message}`,'light',3000); }
}

// ── WORKFLOW OPS ─────────────────────────────────────────────
function workflowToRulePairs(){
  const pairs=[];
  const triggerNodes=Object.values(S.nodes).filter(n=>getDef(n.defId)?.kind==='trigger');
  for(const trigger of triggerNodes){
    const connectedActionIds=S.edges.filter(e=>e.from===trigger.id).map(e=>e.to);
    const actionNodes=connectedActionIds.map(id=>S.nodes[id]).filter(n=>n&&getDef(n.defId)?.kind==='action');
    if(!actionNodes.length) continue;
    for(const action of actionNodes){
      const tc=trigger.config||{}, ac=action.config||{};
      const integration=action.defId==='sheets'?'google_sheets':action.defId;
      pairs.push({
        nodeId:trigger.id,
        actionId:action.id,
        rule:{
          name:`${S.name}${actionNodes.length>1?' → '+getDef(action.defId).name:''}`,
          integration,
          trigger_config:{ type:trigger.defId, column:tc.column||'', operator:tc.operator||'equals', value:tc.value||'' },
          action_config:{ event:`${action.defId}_trigger`, message:ac.message||`${S.name} tetiklendi`, include_columns:[] },
          throttle_seconds:3600,
          enabled:true
        }
      });
    }
  }
  return pairs;
}

async function saveWorkflow(){
  const data={name:S.name, nodes:S.nodes, edges:S.edges};
  localStorage.setItem('mocksheet_automation', JSON.stringify(data));
  S.dirty=false;
  renderTopBar();

  if(window.Automations){
    const pairs=workflowToRulePairs();
    let saved=0;
    for(const {nodeId, actionId, rule} of pairs){
      try{
        const actionNode=S.nodes[actionId];
        if(actionNode?.ruleId){
          await window.Automations.update(actionNode.ruleId, rule);
        } else {
          const created=await window.Automations.save(rule);
          if(actionNode && created?.id) actionNode.ruleId=created.id;
        }
        saved++;
      }catch(e){ console.warn('Kural kaydedilemedi:',e); }
    }
    // persist ruleIds
    localStorage.setItem('mocksheet_automation', JSON.stringify({name:S.name, nodes:S.nodes, edges:S.edges}));
    await loadSavedRules();
    const msg=pairs.length
      ?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Otomasyon kaydedildi (${saved}/${pairs.length} kural)`
      :'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Otomasyon kaydedildi';
    showToast(msg,'light',3000);
  } else {
    showToast('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Otomasyon kaydedildi','light',2400);
  }
}

function loadWorkflow(){
  try{
    const raw=localStorage.getItem('mocksheet_automation'); if(!raw) return;
    const data=JSON.parse(raw);
    if(data.name) S.name=data.name;
    if(data.nodes){
      S.nodes=data.nodes;
      const ids=Object.keys(data.nodes).map(id=>parseInt(id.replace('n',''))).filter(Boolean);
      S.nextId=ids.length?Math.max(...ids)+1:1;
    }
    if(data.edges) S.edges=data.edges;
  }catch(err){ console.warn('Load err',err); }
}

async function loadSavedRules(){
  if(!window.Automations) return;
  try{
    S.savedRules = await window.Automations.load();
    renderInspector();
  }catch(e){ console.warn('Kurallar yüklenemedi:',e); }
}

async function toggleSavedRule(id, currentEnabled){
  if(!window.Automations) return;
  try{
    await window.Automations.update(id, { enabled:!currentEnabled });
    const rule=S.savedRules.find(r=>r.id===id);
    if(rule) rule.enabled=!currentEnabled;
    renderInspector();
    showToast(currentEnabled?'Kural devre dışı bırakıldı':'Kural etkinleştirildi','light',2000);
  }catch(e){ showToast('Kural güncellenemedi','light',2000); }
}

async function deleteSavedRule(id){
  if(!window.Automations) return;
  try{
    await window.Automations.remove(id);
    S.savedRules=S.savedRules.filter(r=>r.id!==id);
    // clear ruleId from any nodes
    Object.values(S.nodes).forEach(n=>{ if(n.ruleId===id) delete n.ruleId; });
    renderInspector();
    showToast('Kural silindi','light',2000);
  }catch(e){ showToast('Kural silinemedi','light',2000); }
}

async function suggestRules(){
  const btn=$id('sb-suggest-btn');
  if(!window.Automations){ showToast('⚠ Otomasyon motoru yüklenemedi','light',2500); return; }
  let headers=[];
  try{
    const raw=localStorage.getItem('mocksheet_state');
    if(raw){
      const state=JSON.parse(raw);
      const sheetName=state.activeSheet||Object.keys(state.sheets||{})[0];
      const rows=state.sheets?.[sheetName];
      if(Array.isArray(rows)&&rows.length) headers=rows[0].filter(Boolean);
    }
  }catch(e){}
  if(!headers.length){
    showToast("⚠ Önce app.html'de bir tablo açın — sütun başlığı bulunamadı",'light',3500);
    return;
  }
  btn.disabled=true;
  btn.textContent='Yükleniyor…';
  showToast('<div class="pulse"></div> AI öneri hazırlanıyor…','dark',4000);
  try{
    const result=await window.Automations.suggest(headers,'make');
    const suggestions=result.suggestions||[];
    if(!suggestions.length){ showToast('Öneri bulunamadı','light',2000); return; }
    const wrap=$id('canvas-wrap');
    const cx=(wrap.offsetWidth/2-S.pan.x)/S.zoom;
    const cy=(wrap.offsetHeight/2-S.pan.y)/S.zoom;
    let added=0;
    suggestions.forEach((sug,i)=>{
      const triggerType=sug.trigger_config?.type||'cell-condition';
      const trigDef=getDef(triggerType)||getDef('cell-condition');
      const actionMap={make:'make',slack:'slack',webhook:'webhook',notion:'notion',airtable:'airtable',email:'email'};
      const actionDefId=actionMap[sug.integration]||'filter';
      const ox=cx-110+(i-1)*280, oy=cy-100+i*60;
      const tid=`n${S.nextId++}`;
      S.nodes[tid]={id:tid,defId:trigDef.defId,kind:'trigger',x:ox,y:oy,configured:true,config:{column:sug.trigger_config?.column||'',operator:sug.trigger_config?.operator||'equals',value:sug.trigger_config?.value||''}};
      const aid=`n${S.nextId++}`;
      S.nodes[aid]={id:aid,defId:actionDefId,kind:'action',x:ox+280,y:oy,configured:false,config:{message:sug.action_config?.message||sug.name}};
      S.edges.push({id:`e${Date.now()+i}`,from:tid,to:aid});
      added++;
    });
    S.dirty=true;
    renderNodes(); redrawEdges(); renderHUD(); renderInspector(); renderTopBar();
    showToast(`✓ ${added} kural önerildi ve canvas'a eklendi`,'light',3000);
  }catch(e){
    showToast(`Hata: ${e.message}`,'light',3000);
  }finally{
    btn.disabled=false;
    btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l1.9 5.8L20 10l-6.1 2.2L12 18l-1.9-5.8L4 10l6.1-2.2z"/></svg> AI Öner';
  }
}

async function runWorkflow(){
  if(S.running) return;
  S.running=true; renderTopBar(); redrawEdges();
  showToast('<div class="pulse"></div> Otomasyon çalışıyor\u2026','dark',3500);

  try{
    let sheetData=null;
    try{
      const raw=localStorage.getItem('mocksheet_state');
      if(raw){
        const state=JSON.parse(raw);
        const sheetName=state.activeSheet||Object.keys(state.sheets||{})[0];
        const rows=state.sheets?.[sheetName];
        if(Array.isArray(rows)&&rows.length>1) sheetData=rows;
      }
    }catch(e){ /* sheet verisi okunamadı */ }

    if(window.Automations&&sheetData){
      await window.Automations.evaluate(sheetData);
      showToast('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Otomasyon tamamlandı','light',2500);
    }else if(!sheetData){
      showToast("⚠ Önce app.html'de bir sayfa açın — sheet verisi bulunamadı",'light',3500);
    }else{
      showToast('⚠ Otomasyon motoru yüklenemedi','light',3000);
    }
  }catch(e){
    showToast(`Hata: ${e.message}`,'light',3000);
  }finally{
    S.running=false; renderTopBar(); redrawEdges();
  }
}

// ── TOASTS ───────────────────────────────────────────────────
function showToast(html, style, dur){
  const div=document.createElement('div');
  div.className=`toast toast-${style||'light'}`;
  div.innerHTML=html;
  $id('toast-area').appendChild(div);
  setTimeout(()=>div.remove(), dur||2400);
}

// ── ZOOM ─────────────────────────────────────────────────────
function adjustZoom(dir){
  const f=dir>0?1.15:1/1.15;
  const wrap=$id('canvas-wrap');
  const mx=wrap.offsetWidth/2, my=wrap.offsetHeight/2;
  const prev=S.zoom;
  S.zoom=Math.min(3,Math.max(0.15,S.zoom*f));
  S.pan.x=mx-(mx-S.pan.x)*(S.zoom/prev);
  S.pan.y=my-(my-S.pan.y)*(S.zoom/prev);
  applyTransform();
}

function fitView(){
  const nodes=Object.values(S.nodes);
  if(!nodes.length){ S.pan={x:140,y:80}; S.zoom=1; applyTransform(); return; }
  const wrap=$id('canvas-wrap');
  const minX=Math.min(...nodes.map(n=>n.x)), minY=Math.min(...nodes.map(n=>n.y));
  const maxX=Math.max(...nodes.map(n=>n.x+NODE_W)), maxY=Math.max(...nodes.map(n=>n.y+NODE_H));
  const pad=80, fw=wrap.offsetWidth-pad*2, fh=wrap.offsetHeight-pad*2;
  S.zoom=Math.min(1.5,Math.max(0.2,Math.min(fw/(maxX-minX||1),fh/(maxY-minY||1))));
  S.pan.x=pad-minX*S.zoom+(fw-(maxX-minX)*S.zoom)/2;
  S.pan.y=pad-minY*S.zoom+(fh-(maxY-minY)*S.zoom)/2;
  applyTransform();
}

// ── CANVAS EVENTS ────────────────────────────────────────────
function initCanvas(){
  const canvas=$id('canvas');
  const wrap=$id('canvas-wrap');

  canvas.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  canvas.addEventListener('drop', e=>{
    e.preventDefault();
    const defId=e.dataTransfer.getData('defId'); if(!defId) return;
    const rect=wrap.getBoundingClientRect();
    addNode(defId, (e.clientX-rect.left-S.pan.x)/S.zoom - NODE_W/2, (e.clientY-rect.top-S.pan.y)/S.zoom - NODE_H/2);
  });

  canvas.addEventListener('mousedown', e=>{
    if(e.target.closest('.node-card')) return;
    selectNode(null);
    const sx=e.clientX, sy=e.clientY, ox=S.pan.x, oy=S.pan.y;
    const onMove=mv=>{ S.pan.x=ox+(mv.clientX-sx); S.pan.y=oy+(mv.clientY-sy); applyTransform(); };
    const onUp=()=>{ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  canvas.addEventListener('wheel', e=>{
    if(!e.ctrlKey&&!e.metaKey){ S.pan.x-=e.deltaX; S.pan.y-=e.deltaY; applyTransform(); return; }
    e.preventDefault();
    const f=e.deltaY<0?1.08:1/1.08;
    const rect=wrap.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const prev=S.zoom;
    S.zoom=Math.min(3,Math.max(0.15,S.zoom*f));
    S.pan.x=mx-(mx-S.pan.x)*(S.zoom/prev);
    S.pan.y=my-(my-S.pan.y)*(S.zoom/prev);
    applyTransform();
  },{passive:false});
}

// ── KEYBOARD ─────────────────────────────────────────────────
function initKeyboard(){
  document.addEventListener('keydown', e=>{
    const inInput=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    if(e.key==='Escape'){ selectNode(null); return; }
    if(inInput) return;
    if((e.key==='Delete'||e.key==='Backspace')&&S.selectedId){ removeNode(S.selectedId); }
    if((e.ctrlKey||e.metaKey)&&e.key==='d'){ e.preventDefault(); if(S.selectedId) duplicateNode(S.selectedId); }
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveWorkflow(); }
  });
}

// ── INIT ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', ()=>{
  loadWorkflow();
  renderTopBar();
  initSidebar();
  renderNodes();
  redrawEdges();
  renderHUD();
  renderInspector();
  applyTransform();
  initCanvas();
  initKeyboard();
  loadSavedRules();
});
</script>
</body>
