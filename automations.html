  }
  html += '</div>';
  return html;
}

function addBuilderAction() {
  builderActions.push({});
  builderSelectedNode = builderActions.length - 1;
  renderBuilderCanvas();
  renderBuilderConfig();
}

function removeBuilderAction(idx) {
  builderActions.splice(idx, 1);
  if (builderSelectedNode === idx) builderSelectedNode = null;
  else if (typeof builderSelectedNode === 'number' && builderSelectedNode > idx) builderSelectedNode--;
  renderBuilderCanvas();
  renderBuilderConfig();
}

async function saveWorkflow() {
  const name = document.getElementById('builder-name').value.trim();
  if (!name) { toast('Workflow adı gerekli', 'warning'); return; }
  if (!builderTrigger?.type) { toast('Tetikleyici seçin', 'warning'); return; }
  if (!builderActions.length || !builderActions[0]?.type) { toast('En az bir aksiyon seçin', 'warning'); return; }

  const body = {
    name,
    trigger_config: builderTrigger,
    condition_config: [],
    action_config: builderActions,
    throttle_seconds: 3600,
    enabled: true
  };

  const btn = document.querySelector('#builder-section .btn-primary');
  const origHtml = btn.innerHTML;
  btn.innerHTML = '<div class="spin"></div>';
  btn.disabled = true;

  try {
    const url = builderEditId ? API + '/api/automations/' + builderEditId : API + '/api/automations';
    const method = builderEditId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(body) });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('automations_updated', Date.now().toString());
      closeBuilder();
      toast(builderEditId ? 'Workflow güncellendi' : 'Workflow oluşturuldu', 'success');
      await loadRules();
    } else {
      toast(data.error || 'Kaydetme başarısız', 'error');
    }
  } catch { toast('Bağlantı hatası', 'error'); }

  btn.innerHTML = origHtml;
  btn.disabled = false;
}

// ── CREATE/EDIT MODAL ──────────────────────────────────────────────────────
function openCreateModal(prefill, id) {
  editId = id || null;
  currentStep = 1;
  conditions = [];
  actions = [];

  document.getElementById('modal-title').textContent = id ? 'Otomasyonu Düzenle' : 'Yeni Otomasyon';
  document.getElementById('create-overlay').classList.add('open');

  // Reset fields
  document.getElementById('f-name').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-trigger-type').value = 'cell_condition';
  document.getElementById('f-throttle').value = '3600';
  document.getElementById('f-enabled').value = 'true';

  if (prefill) {
    document.getElementById('f-name').value = prefill.name || '';
    document.getElementById('f-desc').value = prefill.description || '';
    const tc = prefill.trigger_config || {};
    document.getElementById('f-trigger-type').value = tc.type || 'cell_condition';
    document.getElementById('f-throttle').value = prefill.throttle_seconds || 3600;
    document.getElementById('f-enabled').value = prefill.enabled === false ? 'false' : 'true';
    conditions = Array.isArray(prefill.condition_config) ? JSON.parse(JSON.stringify(prefill.condition_config)) : [];
    const ac = prefill.action_config;
    actions = Array.isArray(ac) ? JSON.parse(JSON.stringify(ac)) : (ac ? [JSON.parse(JSON.stringify(ac))] : []);
    // Store trigger config for rendering
    window._prefillTrigger = tc;
  } else {
    window._prefillTrigger = null;
    actions = [{ type: 'notification', message: '' }];
  }

  renderTriggerFields(window._prefillTrigger);
  renderStepUI();
}

function closeCreateModal() {
  document.getElementById('create-overlay').classList.remove('open');
}

function renderStepUI() {
  [1, 2, 3].forEach(s => {
    document.getElementById(`step-${s}-body`).style.display = s === currentStep ? '' : 'none';
    const ind = document.getElementById(`step-${s}-ind`);
    ind.className = 'step-item' + (s < currentStep ? ' done' : s === currentStep ? ' active' : '');
  });
  document.getElementById('btn-prev').style.display = currentStep > 1 ? '' : 'none';
  document.getElementById('btn-test').style.display = currentStep === 3 ? '' : 'none';
  document.getElementById('btn-next').textContent = currentStep === 3 ? 'Kaydet ✓' : 'Devam Et →';

  if (currentStep === 2) renderConditions();
  if (currentStep === 3) renderActions();
}

function nextStep() {
  if (currentStep === 1) {
    if (!document.getElementById('f-name').value.trim()) { toast('Lütfen bir otomasyon adı girin', 'warning'); return; }
  }
  if (currentStep < 3) { currentStep++; renderStepUI(); }
  else saveRule();
}

function prevStep() {
  if (currentStep > 1) { currentStep--; renderStepUI(); }
}

function getTriggerConfig() {
  const type = document.getElementById('f-trigger-type').value;
  const config = { type };
  const col = document.getElementById('tc-column');
  const op = document.getElementById('tc-operator');
  const val = document.getElementById('tc-value');
  if (col) config.column = col.value.trim();
  if (op) config.operator = op.value;
  if (val) config.value = val.value.trim();

  if (type === 'schedule') {
    const freq = document.getElementById('tc-freq');
    const time = document.getElementById('tc-time');
    const cron = document.getElementById('tc-cron');
    if (freq) config.frequency = freq.value;
    if (time) config.time = time.value;
    if (cron && freq?.value === 'custom') config.cronExpr = cron.value.trim();
  }
  if (type === 'date_arrived') {
    const days = document.getElementById('tc-days');
    if (days) config.days_before = days.value;
  }
  if (type === 'multi_condition') {
    config.logic = document.getElementById('tc-logic')?.value || 'AND';
    config.col1 = document.getElementById('tc-col1')?.value.trim() || '';
    config.op1 = document.getElementById('tc-op1')?.value || '';
    config.val1 = document.getElementById('tc-val1')?.value.trim() || '';
    config.col2 = document.getElementById('tc-col2')?.value.trim() || '';
    config.op2 = document.getElementById('tc-op2')?.value || '';
    config.val2 = document.getElementById('tc-val2')?.value.trim() || '';
  }
  if (type === 'email_received') {
    config.from_filter = document.getElementById('tc-from')?.value.trim() || '';
    config.subject_filter = document.getElementById('tc-subject')?.value.trim() || '';
  }
  if (type === 'incoming_webhook') {
    config.webhookUrl = document.getElementById('tc-webhookUrl')?.value || '';
    config.event_filter = document.getElementById('tc-event-filter')?.value.trim() || '';
  }
  if (type === 'periodic_ai') {
    config.frequency = document.getElementById('tc-freq')?.value || 'every_day';
    config.time = document.getElementById('tc-time')?.value || '09:00';
    config.ai_prompt = document.getElementById('tc-ai-prompt')?.value.trim() || '';
  }
  return config;
}

  document.getElementById(`action-fields-${i}`).innerHTML = renderActionFields(actions[i], i);
}

  actions.push({ type: 'notification', message: '' });
  renderActions();
}

function removeAction(i) {
  actions.splice(i, 1);
  renderActions();
}

// ── SAVE RULE ──────────────────────────────────────────────────────────────
async function saveRule() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Otomasyon adı gerekli', 'warning'); return; }
  if (!actions.length) { toast('En az bir aksiyon ekleyin', 'warning'); return; }

  const body = {
    name,
    description: document.getElementById('f-desc').value.trim(),
    trigger_config: getTriggerConfig(),
    condition_config: conditions,
    action_config: actions,
    throttle_seconds: parseInt(document.getElementById('f-throttle').value) || 3600,
    enabled: document.getElementById('f-enabled').value === 'true'
  };

  const btn = document.getElementById('btn-next');
  btn.innerHTML = '<div class="spin"></div> Kaydediliyor...';
  btn.disabled = true;

  try {
    const url = editId ? API + '/api/automations/' + editId : API + '/api/automations';
    const method = editId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(body) });
    const data = await res.json();
    if (res.ok) {
      closeCreateModal();
      toast(editId ? 'Otomasyon güncellendi' : 'Otomasyon oluşturuldu', 'success');
      await loadRules();
    } else {
      toast(data.error || 'Kaydetme başarısız', 'error');
    }
  } catch { toast('Bağlantı hatası', 'error'); }

  btn.innerHTML = 'Kaydet ✓';
  btn.disabled = false;
}

async function testCurrentRule() {
  if (!editId) { toast('Test için önce kuralı kaydedin — test gerçek aksiyon gönderir', 'warning'); return; }
  await runRule(editId);
}

function openAIModal() {
  document.getElementById('ai-overlay').classList.add('open');
  document.getElementById('ai-preview').style.display = 'none';
  document.getElementById('ai-loading').style.display = 'none';
  document.getElementById('btn-ai-generate').style.display = '';
  document.getElementById('btn-ai-use').style.display = 'none';
  document.getElementById('ai-query').value = '';
  generatedWorkflow = null;
}

function closeAIModal() {
  document.getElementById('ai-overlay').classList.remove('open');
}

function setAIExample(el) {
  document.getElementById('ai-query').value = el.textContent.trim();
}

async function generateWorkflow() {
  const query = document.getElementById('ai-query').value.trim();
  if (!query) { toast('Lütfen bir açıklama yazın', 'warning'); return; }

  document.getElementById('ai-loading').style.display = '';
  document.getElementById('ai-preview').style.display = 'none';
  document.getElementById('btn-ai-generate').disabled = true;
  document.getElementById('btn-ai-use').style.display = 'none';

  try {
    // 1. AI ile workflow üret
    const genRes = await fetch(API + '/api/automations/generate', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify({ query })
    });
    const genData = await genRes.json();
    if (!genRes.ok || !genData.workflow) {
      toast(genData.error || 'Workflow oluşturulamadı', 'error');
      document.getElementById('ai-loading').style.display = 'none';
      document.getElementById('btn-ai-generate').disabled = false;
      return;
    }

    const wf = genData.workflow;

    // 2. Direkt Supabase'e kaydet (passive)
    const saveRes = await fetch(API + '/api/automations', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        name: wf.name,
        description: wf.description || '',
        trigger_config: wf.trigger_config,
        condition_config: wf.condition_config || [],
        action_config: Array.isArray(wf.action_config) ? wf.action_config : [wf.action_config].filter(Boolean),
        enabled: false
      })
    });
    const saveData = await saveRes.json();
    if (!saveRes.ok || !saveData.rule) {
      toast(saveData.error || 'Otomasyon kaydedilemedi', 'error');
      document.getElementById('ai-loading').style.display = 'none';
      document.getElementById('btn-ai-generate').disabled = false;
      return;
    }

    generatedWorkflow = saveData.rule;
    renderAIPreview(saveData.rule);
    document.getElementById('ai-preview').style.display = '';
    document.getElementById('btn-ai-use').style.display = '';
    loadRules();
  } catch { toast('Bağlantı hatası', 'error'); }

  document.getElementById('ai-loading').style.display = 'none';
  document.getElementById('btn-ai-generate').disabled = false;
}

function renderAIPreview(wf) {
  const tc = wf.trigger_config || {};
  const actions = Array.isArray(wf.action_config) ? wf.action_config : [wf.action_config].filter(Boolean);
  const trigLabel = TRIGGER_LABELS[tc.type] || tc.type || '—';
  const trigDetail = (tc.column ? ` · ${tc.column}` : '') +
    (tc.operator === 'less_than' ? ' < ' : tc.operator === 'greater_than' ? ' > ' : tc.operator === 'equals' ? ' = ' : tc.operator ? ` ${tc.operator} ` : '') +
    (tc.value !== undefined && tc.value !== '' ? tc.value : '') +
    (tc.time ? ` ${tc.time}` : '');

  const actionChips = actions.map(a =>
    `<span style="font-size:11px;background:#fff;border:1px solid #bbf7d0;padding:3px 9px;border-radius:5px;color:#166534">→ ${escHtml(ACTION_LABELS[a?.type] || a?.type || '—')}</span>`
  ).join('');

  document.getElementById('ai-preview-content').innerHTML = `
    <div style="padding:18px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:16px">✅</span>
        <strong style="font-size:14px;color:#166534">${escHtml(wf.name || '—')}</strong>
      </div>
      ${wf.description ? `<p style="font-size:12px;color:#64748b;margin:0 0 10px;line-height:1.5">${escHtml(wf.description)}</p>` : ''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <span style="font-size:11px;background:#fff;border:1px solid #bbf7d0;padding:3px 9px;border-radius:5px;color:#166534">⚡ ${escHtml(trigLabel + trigDetail)}</span>
        ${actionChips}
      </div>
      <button onclick="activateAIRule('${escHtml(wf.id || '')}')"
        style="background:#16a34a;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-right:6px">
        ✓ Aktif Et
      </button>
      <span style="font-size:11px;color:#86efac">Pasif olarak kaydedildi — aktif etmek için tıkla</span>
    </div>
  `;
}

async function activateAIRule(ruleId) {
  if (!ruleId) return;
  try {
    const res = await fetch(API + '/api/automations/' + ruleId, {
      method: 'PUT', headers: authHeaders(), body: JSON.stringify({ enabled: true })
    });
    const data = await res.json();
    if (res.ok) {
      toast('✓ Otomasyon aktif edildi', 'success');
      closeAIModal();
      loadRules();
    } else {
      toast(data.error || 'Aktif edilemedi', 'error');
    }
  } catch { toast('Bağlantı hatası', 'error'); }
}

function useGeneratedWorkflow() {
  if (!generatedWorkflow) return;
  closeAIModal();
  openBuilder(generatedWorkflow);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relativeTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'az önce';
  if (m < 60) return m + 'dk önce';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'sa önce';
  return Math.floor(h / 24) + 'g önce';
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function overlayClose(e, id) {
  if (e.target.id === id) document.getElementById(id).classList.remove('open');
}

let _agentPollInterval = null;

async function checkProMax() {
  try {
    const res = await fetch(`${API}/api/agents/history`, { headers: authHeaders() });
    const overlay = document.getElementById('agents-upgrade-overlay');
    if (res.status === 403) {
      overlay.style.display = 'flex';
    } else {
      overlay.style.display = 'none';
    }
  } catch {}
}

async function runAgent() {
  const prompt = document.getElementById('agent-prompt').value.trim();
  if (!prompt) return;

  const btn = document.getElementById('run-agent-btn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Çalışıyor...';

  const logWrap = document.getElementById('agent-log-wrap');
  logWrap.style.display = 'block';
  document.getElementById('agent-run-title').textContent = prompt.slice(0, 80) + (prompt.length > 80 ? '…' : '');
  document.getElementById('agent-steps-list').innerHTML = '';
  document.getElementById('agent-result').style.display = 'none';
  setAgentStatus('running');

  try {
    const templateId = document.getElementById('agent-template-id')?.value;
    const endpoint = templateId ? `${API}/api/agents/run-template` : `${API}/api/agents/run`;
    const body = templateId
      ? JSON.stringify({ template_id: templateId, context: {} })
      : JSON.stringify({ prompt, context: {} });
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body,
    });
    if (!res.ok) throw new Error('API hatası: ' + res.status);
    const { run_id } = await res.json();
    if (_agentPollInterval) clearInterval(_agentPollInterval);
    pollAgentRun(run_id);
  } catch (e) {
    setAgentStatus('failed');
    btn.disabled = false;
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Agent\'ı Çalıştır';
  }
}

function pollAgentRun(runId) {
  _agentPollInterval = setInterval(async () => {
    try {
      const res = await fetch(`${API}/api/agents/run/${runId}`, { headers: authHeaders() });
      const { run, steps } = await res.json();

      renderAgentSteps(steps);
      setAgentStatus(run.status);

      if (run.status === 'completed' || run.status === 'failed') {
        clearInterval(_agentPollInterval);
        _agentPollInterval = null;
        const btn = document.getElementById('run-agent-btn');
        btn.disabled = false;
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Agent\'ı Çalıştır';
        if (run.result) {
          const parsed = typeof run.result === 'string' ? JSON.parse(run.result) : run.result;
          const resultEl = document.getElementById('agent-result');
          resultEl.style.display = 'block';
          const summary = parsed?.summary || JSON.stringify(parsed, null, 2);
          resultEl.innerHTML = '<strong>Sonuç:</strong><br>' + summary;
        }
        loadAgentHistory();
      }
    } catch {
      clearInterval(_agentPollInterval);
      _agentPollInterval = null;
    }
  }, 2000);
}

function renderAgentSteps(steps) {
  const list = document.getElementById('agent-steps-list');
  if (!steps || !steps.length) { list.innerHTML = ''; return; }

  const icons = { pending: '○', running: '◉', completed: '✓', failed: '✕' };
  const colors = { pending: 'var(--muted)', running: '#f59e0b', completed: 'var(--accent)', failed: 'var(--rose)' };

  list.innerHTML = steps.map(s => {
    const icon = icons[s.status] || '○';
    const color = colors[s.status] || 'var(--muted)';
    return `<div class="agent-step-row">
      <span class="agent-step-icon" style="color:${color}">${icon}</span>
      <span class="agent-step-label">${s.step_label || s.step_type}</span>
      <span class="agent-step-status" style="color:${color}">${s.status}</span>
    </div>`;
  }).join('');
}

function setAgentStatus(status) {
  const badge = document.getElementById('agent-status-badge');
  const map = {
    pending:   { label: 'Bekliyor',   bg: 'var(--surface-2)', color: 'var(--muted)' },
    running:   { label: 'Çalışıyor',  bg: 'var(--amber-soft)', color: 'var(--amber)' },
    completed: { label: 'Tamamlandı', bg: 'var(--accent-soft)', color: 'var(--accent)' },
    failed:    { label: 'Hata',       bg: 'var(--rose-soft)', color: 'var(--rose)' }
  };
  const s = map[status] || map.pending;
  badge.innerHTML = `<span style="background:${s.bg};color:${s.color};font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px">${s.label}</span>`;
}

async function loadAgentHistory() {
  try {
    const res = await fetch(`${API}/api/agents/history`, { headers: authHeaders() });
    if (!res.ok) return;
    const { runs } = await res.json();
    const list = document.getElementById('agent-history-list');

    if (!runs || !runs.length) {
      list.innerHTML = '<p style="font-size:13px;color:var(--muted)">Henüz çalıştırma yok.</p>';
      return;
    }

    const colors = { completed: 'var(--accent)', failed: 'var(--rose)', running: '#f59e0b', pending: 'var(--muted)' };
    list.innerHTML = runs.map(r => {
      const color = colors[r.status] || 'var(--muted)';
      const date = new Date(r.created_at).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      return `<div class="agent-history-row" onclick="loadAgentRun('${r.id}')">
        <span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;flex-shrink:0"></span>
        <span style="font-size:14px;flex:1;color:var(--ink-2)">${r.title || 'İsimsiz'}</span>
        <span style="font-size:12px;color:var(--muted)">${date}</span>
      </div>`;
    }).join('');
  } catch {}
}

async function loadAgentRun(runId) {
  try {
    const res = await fetch(`${API}/api/agents/run/${runId}`, { headers: authHeaders() });
    const { run, steps } = await res.json();
    document.getElementById('agent-log-wrap').style.display = 'block';
    document.getElementById('agent-run-title').textContent = run.title || (run.prompt || '').slice(0, 80);
    document.getElementById('agent-result').style.display = 'none';
    setAgentStatus(run.status);
    renderAgentSteps(steps);
    if (run.result) {
      const parsed = typeof run.result === 'string' ? JSON.parse(run.result) : run.result;
      const resultEl = document.getElementById('agent-result');
      resultEl.style.display = 'block';
      resultEl.innerHTML = '<strong>Sonuç:</strong><br>' + (parsed?.summary || JSON.stringify(parsed, null, 2));
    }
    document.getElementById('agent-log-wrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch {}
}

          <p style="font-size:12px;color:#9ca3af;margin:0">${s.label} · Son: ${s.last_run ? new Date(s.last_run).toLocaleDateString('tr-TR') : 'Henüz çalışmadı'}</p>
        </div>
        <button onclick="deleteSchedule('${s.id}')" style="font-size:12px;color:#ef4444;background:none;border:none;cursor:pointer">Durdur</button>
      </div>
    `).join('');
  } catch {}
}

async function deleteSchedule(scheduleId) {
  await fetch(`${API}/api/agents/schedules/${scheduleId}`, { method: 'DELETE', headers: authHeaders() });
  loadSchedules();
}

// ── AGENT MEMORY ───────────────────────────────────────────────────────────

async function loadMemory() {
  try {
    const res = await fetch(`${API}/api/agents/memory`, { headers: authHeaders() });
    if (!res.ok) return;
    const { memory } = await res.json();
    const list = document.getElementById('agent-memory-list');
    if (!list) return;

    const entries = Object.entries(memory || {});
    if (!entries.length) {
      list.innerHTML = '<p style="font-size:12px;color:#9ca3af;margin:0">Henüz bellek yok — agent çalıştıkça öğrenir.</p>';
      return;
    }
    list.innerHTML = entries.map(([key, value]) => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border,#e5e7eb)">
        <span style="font-size:12px;color:#374151">${key.replace(/_/g, ' ')}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:#16a34a;font-weight:500">${typeof value === 'object' ? JSON.stringify(value) : value}</span>
          <button onclick="deleteMemory('${key}')" style="font-size:11px;color:#9ca3af;background:none;border:none;cursor:pointer">✕</button>
        </div>
      </div>
    `).join('');
  } catch {}
}

async function deleteMemory(key) {
  await fetch(`${API}/api/agents/memory/${encodeURIComponent(key)}`, { method: 'DELETE', headers: authHeaders() });
  loadMemory();
}

// ── INIT ───────────────────────────────────────────────────────────────────
async function init() {
  await initAuth();
  renderTemplates();
  await Promise.all([loadRules(), loadRuns()]);
  const urlTab = new URLSearchParams(window.location.search).get('tab');
  if (urlTab === 'agents') switchPageTab('agents');
}

document.addEventListener('DOMContentLoaded', init);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ['create-overlay','ai-overlay','run-overlay'].forEach(id => {
      document.getElementById(id)?.classList.remove('open');
    });
  }
});
</script>

<script>

const wzState = {

  trigger: null,
  actions: [],

  autoId: null,
  autoName: 'Yeni Otomasyon'
};

const WZ_TRIGGERS = [

  { id: 'data_change', label: 'Veri Değişimi', desc: 'Tablo güncellenince', color: '#fef3c7', iconColor: '#d97706', icon: '📊' },
  { id: 'webhook', label: 'Webhook', desc: 'Dış istek gelince', color: '#f0fdf4', iconColor: '#16a34a', icon: '🔗' },
  { id: 'manual', label: 'Manuel', desc: 'Elle tetikle', color: '#fdf4ff', iconColor: '#9333ea', icon: '👆' }

const WZ_ACTIONS = [
  { id: 'read_data', label: 'Veri Oku', desc: 'Tablo verisini çek', color: '#fffbeb', iconColor: '#d97706', icon: '📄', nodeClass: 'action-read' },
  { id: 'ai_analyze', label: 'AI Analiz', desc: 'Veriyi analiz et', color: '#eef2ff', iconColor: '#6366f1', icon: '✦', nodeClass: 'action-ai' },
  { id: 'send_slack', label: 'Slack Gönder', desc: 'Kanala mesaj at', color: '#f0fdf4', iconColor: '#16a34a', icon: '💬', nodeClass: 'action-slack' },
  { id: 'send_email', label: 'Email Gönder', desc: 'Gmail ile gönder', color: '#fdf4ff', iconColor: '#9333ea', icon: '✉️', nodeClass: 'action-email' },
  { id: 'create_report', label: 'Rapor Oluştur', desc: 'Excel/PDF çıktı', color: '#eff6ff', iconColor: '#2563eb', icon: '📊', nodeClass: '' },
  { id: 'filter_data', label: 'Veri Filtrele', desc: 'Koşula göre filtrele', color: '#fff7ed', iconColor: '#ea580c', icon: '🔍', nodeClass: '' },
  { id: 'update_table', label: 'Tablo Güncelle', desc: 'Veri yaz/güncelle', color: '#fef2f2', iconColor: '#dc2626', icon: '✏️', nodeClass: '' },
  { id: 'send_drive', label: "Drive'a Kaydet", desc: "Google Drive'a gönder", color: '#f0fdf4', iconColor: '#16a34a', icon: '💾', nodeClass: '' }
];

function wzGoStep(n) {
  wzState.step = n;
  document.querySelectorAll('.wz-step').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i + 1 < n) el.classList.add('done');
    else if (i + 1 === n) el.classList.add('active');
  });
  wzRenderStep();
}

function wzNextStep() { if (wzState.step < 4) wzGoStep(wzState.step + 1); }
function wzPrevStep() { if (wzState.step > 1) wzGoStep(wzState.step - 1); }

function wzRenderStep() {
  const sidebarTitle = document.getElementById('wz-sidebar-title');
  const nodeList = document.getElementById('wz-node-list');
  const settings = document.getElementById('wz-settings-content');

  if (wzState.step === 1) {
    sidebarTitle.textContent = 'Tetikleyici seç';
    nodeList.innerHTML = WZ_TRIGGERS.map(t => `
      <div class="wz-node ${wzState.trigger?.id === t.id ? 'selected' : ''}" onclick="wzSelectTrigger('${t.id}')">
        <div class="wz-node-icon" style="background:${t.color};"><span style="font-size:14px;">${t.icon}</span></div>
        <div><p class="wz-node-label">${t.label}</p><p class="wz-node-desc">${t.desc}</p></div>
      </div>`).join('');
    wzRenderFlow();
    wzRenderTriggerSettings();
  } else if (wzState.step === 2) {
    sidebarTitle.textContent = 'Aksiyon ekle';
    nodeList.innerHTML = WZ_ACTIONS.map(a => `
      <div class="wz-node" onclick="wzAddAction('${a.id}')">
        <div class="wz-node-icon" style="background:${a.color};"><span style="font-size:14px;">${a.icon}</span></div>
        <div><p class="wz-node-label">${a.label}</p><p class="wz-node-desc">${a.desc}</p></div>
      </div>`).join('');
    wzRenderFlow();
  } else if (wzState.step === 3) {
    sidebarTitle.textContent = 'Genel ayarlar';
    nodeList.innerHTML = `
      <div style="padding:4px 0;">
        <p class="wz-settings-label">Otomasyon adı</p>
        <input type="text" value="${wzState.autoName}" oninput="wzState.autoName=this.value; document.getElementById('wz-auto-title').textContent=this.value;"
          style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); box-sizing:border-box; outline:none;" />
        <p class="wz-settings-label" style="margin-top:10px;">Hata durumunda</p>
        <select style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink);">
          <option>Durdur ve bildir</option><option>Devam et</option><option>Tekrar dene (3x)</option>
        </select>
        <p class="wz-settings-label" style="margin-top:10px;">Bildirim</p>
        <select style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink);">
          <option>Hata olunca bildir</option><option>Her çalışmada bildir</option><option>Bildirim yok</option>
        </select>
      </div>`;
    wzRenderFlow();
  } else if (wzState.step === 4) {
    sidebarTitle.textContent = 'Test & Yayınla';
    nodeList.innerHTML = `
      <div style="padding:4px 0;">
        <p class="wz-settings-label">Otomasyon hazır</p>
        <button onclick="wzRunAuto()" style="width:100%; padding:9px; font-size:13px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; margin-bottom:8px;">▶ Test Çalıştır</button>
        <button onclick="wzSaveAuto()" style="width:100%; padding:9px; font-size:13px; background:#6366f1; color:#fff; border:none; border-radius:8px; cursor:pointer;">🚀 Yayınla</button>
        <div id="wz-test-result" style="margin-top:12px; font-size:11px; color:var(--muted);"></div>
      </div>`;
    wzRenderFlow();
  }
}

function wzRenderFlow() {
  const flow = document.getElementById('wz-flow');
  let html = '';
  if (wzState.trigger) {
    const t = WZ_TRIGGERS.find(x => x.id === wzState.trigger.id) || {};
    html += `<div class="flow-node trigger">
      <div class="flow-node-icon" style="background:${t.color || '#eef2ff'};"><span style="font-size:14px;">${t.icon || '⚡'}</span></div>
      <div style="flex:1;"><p class="flow-node-name">${t.label || 'Tetikleyici'}</p><p class="flow-node-sub">${wzState.trigger.label || ''}</p></div>
      <span class="wz-badge" style="background:#eef2ff; color:#6366f1;">Tetikleyici</span>
    </div>`;
  } else {
    html += `<div class="flow-add-btn" onclick="wzGoStep(1)">+ Tetikleyici seç</div>`;
  }
  wzState.actions.forEach((a, i) => {
    const def = WZ_ACTIONS.find(x => x.id === a.id) || {};
    html += `<div class="flow-connector"></div>
    <div class="flow-node ${def.nodeClass || ''}" onclick="wzSelectAction(${i})">
      <div class="flow-node-icon" style="background:${def.color || '#f9fafb'};"><span style="font-size:14px;">${def.icon || '⚙️'}</span></div>
      <div style="flex:1;"><p class="flow-node-name">${def.label || a.id}</p><p class="flow-node-sub">${a.config?.desc || def.desc || ''}</p></div>
      <button onclick="event.stopPropagation(); wzRemoveAction(${i})" style="background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 6px;">✕</button>
    </div>`;
  });
  if (wzState.trigger && wzState.step === 2) {
    html += `<div class="flow-connector"></div><div class="flow-add-btn" onclick="document.getElementById('wz-node-list').querySelector('.wz-node')?.focus()">+ Aksiyon ekle</div>`;
  }
  flow.innerHTML = html;
}

function wzSelectTrigger(id) {
  const t = WZ_TRIGGERS.find(x => x.id === id);
  wzState.trigger = { id, label: t?.label };
  document.querySelectorAll('.wz-node').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  wzRenderFlow();
  wzRenderTriggerSettings();
  setTimeout(() => wzGoStep(2), 400);
}

function wzRenderTriggerSettings() {
  const settings = document.getElementById('wz-settings-content');
  if (!wzState.trigger) { settings.innerHTML = '<p style="font-size:12px; color:var(--muted);">Tetikleyici seçin.</p>'; return; }
  if (wzState.trigger.id === 'schedule') {
    settings.innerHTML = `
      <p class="wz-settings-label">Ne zaman çalışsın?</p>
      <select style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); margin-bottom:12px;">
        <option>Her gün 09:00</option><option>Her Pazartesi 09:00</option><option>Her Cuma 18:00</option><option>Her ayın 1'i</option><option>Özel...</option>
      </select>
      <p class="wz-settings-label">Saat dilimi</p>
      <select style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); margin-bottom:12px;">
        <option>Europe/Istanbul (UTC+3)</option><option>UTC</option>
      </select>`;
  } else {
    settings.innerHTML = `<p style="font-size:12px; color:var(--muted);"><strong style="color:var(--ink);">${wzState.trigger.label}</strong> tetikleyicisi seçildi.</p>`;
  }
}

function wzAddAction(id) {
  wzState.actions.push({ id, config: {} });
  wzRenderFlow();
  wzSelectAction(wzState.actions.length - 1);
}

function wzRemoveAction(i) {
  wzState.actions.splice(i, 1);
  wzRenderFlow();
}

function wzSelectAction(i) {
  wzState.selectedNodeId = i;
  const a = wzState.actions[i];
  const def = WZ_ACTIONS.find(x => x.id === a?.id);
  const settings = document.getElementById('wz-settings-content');
  if (!def) return;
  let html = `<p class="wz-settings-label">Node adı</p>
    <input type="text" value="${def.label}" style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); box-sizing:border-box; outline:none; margin-bottom:12px;" />`;
  if (a.id === 'read_data') {
    html += `<p class="wz-settings-label">Veri kaynağı</p>
      <select style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); margin-bottom:12px;">
        <option>Aktif tablo</option><option>Google Sheets</option><option>Shopify siparişleri</option><option>CSV yükle</option>
      </select>
      <p class="wz-settings-label">Zaman aralığı</p>
      <select style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); margin-bottom:12px;">
        <option>Son 7 gün</option><option>Son 30 gün</option><option>Bu ay</option><option>Tüm veri</option>
      </select>`;
  } else if (a.id === 'ai_analyze') {
    html += `<p class="wz-settings-label">Komut</p>
      <textarea style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); box-sizing:border-box; outline:none; resize:vertical; min-height:70px; margin-bottom:12px;" placeholder="ör: Haftalık satış özetini çıkar"></textarea>`;
  } else if (a.id === 'send_slack') {
    html += `<p class="wz-settings-label">Kanal</p>
      <input type="text" placeholder="#ops" style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); box-sizing:border-box; outline:none; margin-bottom:12px;" />
      <p class="wz-settings-label">Mesaj</p>
      <textarea style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); box-sizing:border-box; outline:none; resize:vertical; min-height:60px; margin-bottom:12px;" placeholder="ör: Haftalık rapor hazır ✓"></textarea>`;
  } else if (a.id === 'send_email') {
    html += `<p class="wz-settings-label">Alıcı</p>
      <input type="text" placeholder="email@ornek.com" style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); box-sizing:border-box; outline:none; margin-bottom:12px;" />
      <p class="wz-settings-label">Konu</p>
      <input type="text" placeholder="Haftalık Rapor" style="width:100%; padding:7px 9px; font-size:12px; border:0.5px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); box-sizing:border-box; outline:none; margin-bottom:12px;" />`;
  }
  html += `<div style="border-top:0.5px solid var(--line); padding-top:10px; margin-top:4px;">
    <button onclick="wzRemoveAction(${i})" style="width:100%; padding:7px; font-size:12px; background:none; border:0.5px solid var(--line); border-radius:8px; color:var(--rose); cursor:pointer;">Sil</button>
  </div>`;
  settings.innerHTML = html;
}

function wzShowList() { document.getElementById('wz-list-overlay').style.display = 'flex'; wzLoadList(); }
function wzHideList() { document.getElementById('wz-list-overlay').style.display = 'none'; }

async function wzLoadList() {
  const list = document.getElementById('wz-auto-list');
  try {
    const res = await fetch(API + '/api/automations', { headers: authHeaders() });
    const data = await res.json();
    const rules = data.rules || data || [];
    if (!rules.length) { list.innerHTML = '<p style="font-size:13px; color:var(--muted); text-align:center; padding:20px;">Henüz otomasyon yok.</p>'; return; }
    list.innerHTML = rules.map(r => `
      <div class="wz-auto-card" onclick="wzLoadAuto('${r.id}'); wzHideList();">
        <div class="wz-auto-card-icon">${r.icon || '⚙️'}</div>
        <div style="flex:1;"><p class="wz-auto-card-name">${r.name || r.title || 'İsimsiz'}</p><p class="wz-auto-card-sub">${r.trigger_label || ''} · ${r.action_count || 0} aksiyon</p></div>
        <div class="wz-toggle ${r.active ? 'on' : ''}" onclick="event.stopPropagation(); wzToggleAuto('${r.id}', this)"></div>
      </div>`).join('');
  } catch(e) {
    list.innerHTML = '<p style="font-size:13px; color:var(--muted); text-align:center; padding:20px;">Yüklenemedi.</p>';
  }
}

function wzToggleAuto(id, el) {
  el.classList.toggle('on');
  fetch(API + '/api/automations/' + id + '/toggle', { method: 'POST', headers: authHeaders() }).catch(() => {});
}

function wzLoadAuto(id) {
  document.getElementById('wz-auto-title').textContent = 'Otomasyon #' + id;
  wzState.autoId = id;
  wzGoStep(1);
}

function wzNewAuto() {
  wzState.trigger = null;
  wzState.actions = [];
  wzState.autoId = null;
  wzState.autoName = 'Yeni Otomasyon';
  document.getElementById('wz-auto-title').textContent = 'Yeni Otomasyon';
  wzGoStep(1);
}

async function wzSaveAuto() {
  try {
    const body = { name: wzState.autoName, trigger: wzState.trigger, actions: wzState.actions };
    const url = wzState.autoId ? API + '/api/automations/' + wzState.autoId : API + '/api/automations';
    const res = await fetch(url, { method: wzState.autoId ? 'PUT' : 'POST', headers: authHeaders(), body: JSON.stringify(body) });
    if (res.ok) {
      const badge = document.getElementById('wz-status-badge');
      badge.textContent = 'Aktif';
      badge.style.background = 'var(--accent-soft)';
      badge.style.color = 'var(--accent)';
      document.getElementById('wz-status-dot').style.background = 'var(--accent)';
    }
  } catch(e) {}
}

async function wzRunAuto() {
  const btn = document.getElementById('wz-run-btn');
  btn.textContent = '⏳ Çalışıyor...';
  btn.disabled = true;
  try {
    if (wzState.autoId) await fetch(API + '/api/automations/' + wzState.autoId + '/run', { method: 'POST', headers: authHeaders() });
    document.getElementById('wz-footer-text').textContent = 'Son çalışma: ' + new Date().toLocaleTimeString('tr-TR');
    document.getElementById('wz-status-dot').style.background = 'var(--accent)';
    const result = document.getElementById('wz-test-result');
    if (result) result.textContent = '✓ Başarıyla çalıştı.';
  } catch(e) {
    const result = document.getElementById('wz-test-result');
    if (result) result.textContent = '✗ Hata oluştu.';
  } finally {
    btn.textContent = '▶ Çalıştır';
    btn.disabled = false;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (typeof initAuth === 'function') initAuth();
  wzGoStep(1);
});
</script>

async function testIntegration(id, form, token) {
  const h = { 'Content-Type':'application/json', Authorization:`Bearer ${token}` };
  switch (id) {
    case 'slack':    return fetch(`${API}/api/integrations/slack/test`,   { method:'POST', headers:h, body:JSON.stringify({ webhookUrl:form.url }) });
    case 'ms-teams': return fetch(`${API}/api/integrations/teams/test`,   { method:'POST', headers:h, body:JSON.stringify({ webhookUrl:form.url }) });
    case 'make':     return fetch(`${API}/api/integrations/make/trigger`, { method:'POST', headers:h, body:JSON.stringify({ webhookUrl:form.url, event:'test', data:{test:true} }) });
    case 'zapier':
    case 'webhook':  return fetch(`${API}/api/integrations/webhook/send`, { method:'POST', headers:h, body:JSON.stringify({ url:form.url, secret:form.secret||'', event:'test', data:{test:true} }) });
    case 'notion':   return fetch(`${API}/api/integrations/notion/test`,   { method:'POST', headers:h, body:JSON.stringify({ token:form.token, databaseId:form.dbId }) });
    case 'airtable': return fetch(`${API}/api/integrations/airtable/test`,{ method:'POST', headers:h, body:JSON.stringify({ token:form.token, baseId:form.baseId, tableName:form.tableName||'Table 1' }) });
    case 'trello':   return fetch(`${API}/api/integrations/trello/test`,  { method:'POST', headers:h, body:JSON.stringify({ apiKey:form.apiKey, token:form.token, boardId:form.boardId }) });
    case 'discord':
    case 'google-chat': return fetch(`${API}/api/integrations/webhook/send`, { method:'POST', headers:h, body:JSON.stringify({ url:form.url, event:'test', data:{test:true} }) });
    case 'n8n':      return fetch(`${API}/api/integrations/n8n/trigger`,      { method:'POST', headers:h, body:JSON.stringify({ webhookUrl:form.url, event:'test', data:{test:true} }) });
    case 'pipedream': return fetch(`${API}/api/integrations/pipedream/trigger`,{ method:'POST', headers:h, body:JSON.stringify({ webhookUrl:form.url, event:'test', data:{test:true} }) });
    default: return null;
  }
}

function ConnectModal({ integration, onClose, onSave }) {
  const cfg = INT_CONFIG[integration.id];
  const storageKey = STORAGE_KEY[integration.id];
  const [form, setForm] = useState(() => {
    try { const s = storageKey && localStorage.getItem(storageKey); return s ? JSON.parse(s) : {}; } catch { return {}; }
  });
  const [connecting, setConnecting] = useState(false);
  const [result, setResult] = useState(null);
  const [oauthWaiting, setOauthWaiting] = useState(false);

  const updateField = (key, val) => { setForm(prev => ({ ...prev, [key]:val })); setResult(null); };
  const sensitiveKeys = ['token','apiKey','secret'];
  const requiredKeys = cfg?.fields?.filter(f => f.key !== 'secret' && f.key !== 'tableName').map(f => f.key) || [];
  const hasRequired = requiredKeys.every(k => form[k]?.trim());

  async function handleConnect() {
    setConnecting(true); setResult(null);
    try {
      const token = intGetToken();
      const res = await testIntegration(integration.id, form, token);
      if (!res) { setResult({ ok:false, msg:'Test desteklenmiyor.' }); return; }
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        if (token) {
          fetch(`${API}/api/integrations/${integration.id}/save-config`, {
            method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
            body:JSON.stringify({ webhookUrl:form.url||null, token:form.token||null, apiKey:form.apiKey||null, metadata:form }),
          }).catch(() => {});
        }
        if (storageKey) localStorage.setItem(storageKey, JSON.stringify(form));
        setResult({ ok:true, msg:'Bağlantı başarılı! Kaydedildi.' });
        setTimeout(() => { onSave(integration.id, form); }, 800);
      } else {
        setResult({ ok:false, msg:data.error||'Bağlantı başarısız. Bilgileri kontrol edin.' });
      }
    } catch(e) {
      setResult({ ok:false, msg:e.message||'Bağlantı kurulamadı.' });
    } finally { setConnecting(false); }
  }

  function handleOAuth() {
    const token = intGetToken();
    const url = `${API}${cfg.authPath}${token ? '?token='+encodeURIComponent(token) : ''}`;
    const popup = window.open(url, 'oauth', 'width=520,height=640');
    setOauthWaiting(true);
    function onMsg(e) {
      try { if (new URL(API).origin !== e.origin) return; } catch { return; }
      if (!e.data || typeof e.data !== 'object') return;
      const { access_token, refresh_token, expiry, token, tokens, connected:isConnected } = e.data;
      if (isConnected) { window.removeEventListener('message', onMsg); setOauthWaiting(false); onSave(integration.id, {}); return; }
      const at = access_token || token || tokens?.access_token;
      if (!at) return;
      const saved = { access_token:at, refresh_token:refresh_token||tokens?.refresh_token||null, expiry:expiry||null };
      if (storageKey) localStorage.setItem(storageKey, JSON.stringify(saved));
      window.removeEventListener('message', onMsg);
      setOauthWaiting(false);
      onSave(integration.id, saved);
    }
    window.addEventListener('message', onMsg);
    const poll = setInterval(() => {
      try { if (popup.closed) { clearInterval(poll); window.removeEventListener('message', onMsg); setOauthWaiting(false); } } catch {}
    }, 500);
  }

  const isOauth = cfg?.type === 'oauth';
  const logoEl = integration.id === 'webhook'
    ? <WebhookIcon />
    : <img src={integration.logo} width="32" height="32" style={{ objectFit:'contain' }} alt={integration.name} />;

  return (
    <div className="int-modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="int-modal-box">
        <div className="int-modal-header">
          <div className="int-card-logo" style={{ width:44, height:44, borderRadius:10, padding:8 }}>{logoEl}</div>
          <div>
            <div className="int-modal-title">{integration.name}</div>
            <span className={`int-badge int-badge-${integration.tier}`} style={{ fontSize:10 }}>
              {integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}
            </span>
          </div>
          <button className="int-modal-close" onClick={onClose}>×</button>
        </div>
        <hr className="int-modal-divider" />
        {isOauth ? (
          <>
            <div className="int-oauth-info">
              {integration.name} hesabınızı güvenli OAuth 2.0 ile bağlayın. Açılan pencerede <strong>{cfg.label}</strong> hesabınızla giriş yapın.
            </div>
            <div className="int-modal-actions">
              <button className="int-modal-btn int-modal-btn-secondary" onClick={onClose}>Vazgeç</button>
              <button className="int-modal-btn int-modal-btn-primary" onClick={handleOAuth} disabled={oauthWaiting}>
                {oauthWaiting ? 'Bekleniyor...' : `${cfg.label} ile Bağlan →`}
              </button>
            </div>
          </>
        ) : (
          <>
            {cfg?.fields?.map(field => (
              <div key={field.key} className="int-modal-form-group">
                <div className="int-modal-label-row">
                  <label className="int-modal-label">{field.label}</label>
                  {cfg.docsUrl && field === cfg.fields[0] && (
                    <a className="int-modal-label-link" href={cfg.docsUrl} target="_blank" rel="noopener noreferrer">Nasıl alınır? →</a>
                  )}
                </div>
                <input
                  className="int-modal-input"
                  type={sensitiveKeys.includes(field.key) ? 'password' : 'text'}
                  placeholder={field.placeholder || ''}
                  value={form[field.key] || ''}
                  onChange={e => updateField(field.key, e.target.value)}
                  autoComplete="off"
                />
                {field.hint && <div className="int-modal-hint">{field.hint}</div>}
              </div>
            ))}
            {result && (
              <div className={`int-connect-result ${result.ok ? 'success' : 'error'}`}>
                {result.ok ? '✓ ' : '✗ '}{result.msg}
              </div>
            )}
            <div className="int-modal-actions">
              <button className="int-modal-btn int-modal-btn-secondary" onClick={onClose}>Vazgeç</button>
              <button className="int-modal-btn int-modal-btn-primary" onClick={handleConnect} disabled={connecting || !hasRequired}>
                {connecting ? 'Bağlanıyor...' : 'Bağlan →'}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function IntegrationCard({ integration, connected, onConnect, onDisconnect, listView }) {
  const isConnected = connected.has(integration.id);
  const ref = useRef(null);

  function handleMouseMove(e) {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    ref.current.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%');
    ref.current.style.setProperty('--my', ((e.clientY - rect.top)  / rect.height * 100).toFixed(1) + '%');
  }

  const logoEl = integration.id === 'webhook'
    ? <WebhookIcon />
    : <img src={integration.logo} width="32" height="32" style={{ objectFit:'contain' }} alt={integration.name} />;

  const logoContainer = (
    <div className="int-card-logo" style={listView ? { width:44, height:44, borderRadius:10, padding:8 } : {}}>
      {logoEl}
    </div>
  );

  const connectBtn = isConnected ? (
    <button className="int-connect-btn btn-disconnect" onClick={e => { e.stopPropagation(); onDisconnect(integration.id); }}>Bağlantıyı Kes</button>
  ) : (
    <button className="int-connect-btn btn-connect" onClick={e => { e.stopPropagation(); onConnect(integration.id); }}>Bağlan →</button>
  );

  if (listView) {
    return (
      <div ref={ref} className={`int-card${isConnected ? ' connected' : ''}`} onMouseMove={handleMouseMove}
        style={{ flexDirection:'row', alignItems:'center', gap:16, padding:'14px 20px' }}>
        {logoContainer}
        <div style={{ flex:1, minWidth:0 }}>
          <div className="int-card-name" style={{ marginBottom:2 }}>{integration.name}</div>
          <div className="int-card-cat">{integration.category}</div>
          {integration.useCase && <div style={{ fontSize:11.5, color:'var(--muted)', fontStyle:'italic' }}>{integration.useCase}</div>}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
          {isConnected && <div className="int-pulse-dot" />}
          {!isConnected && integration.popular && <span className="int-badge int-badge-popular">⭐</span>}
          <span className={`int-badge int-badge-${integration.tier}`}>{integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}</span>
          {connectBtn}
        </div>
      </div>
    );
  }

  return (
    <div ref={ref} className={`int-card${isConnected ? ' connected' : ''}`} onMouseMove={handleMouseMove}>
      <div className="int-card-top">
        {logoContainer}
        <div className="int-card-badges">
          {isConnected && <span className="int-badge int-badge-connected"><div className="int-pulse-dot" style={{ width:6, height:6 }} />Bağlı</span>}
          {!isConnected && integration.popular && <span className="int-badge int-badge-popular">⭐ Popüler</span>}
          <span className={`int-badge int-badge-${integration.tier}`}>{integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}</span>
        </div>
      </div>
      <div className="int-card-body">
        <div className="int-card-name">{integration.name}</div>
        <div className="int-card-cat">{integration.category}</div>
        {integration.actions && (
          <div className="int-card-section">
            <div className="int-card-section-label">Aksiyonlar</div>
            <ul className="int-card-list">
              {integration.actions.map((a, i) => <li key={i}><span className="int-check-icon">✓</span>{a}</li>)}
            </ul>
          </div>
        )}
        {integration.triggers && (
          <div className="int-card-section">
            <div className="int-card-section-label">Tetikleyiciler</div>
            <ul className="int-card-list">
              {integration.triggers.map((t, i) => <li key={i}><span className="int-trigger-icon">⚡</span>{t}</li>)}
            </ul>
          </div>
        )}
        {integration.useCase && <div className="int-card-usecase">"{integration.useCase}"</div>}
      </div>
      <div className="int-card-footer">{connectBtn}</div>
    </div>
  );
}

function IntegrationBrowser() {
  const [activeCat, setActiveCat] = useState('Tümü');
  const [view, setView] = useState('grid');
  const [connected, setConnected] = useState(() => {
    const s = new Set();
    try { INTEGRATIONS.forEach(i => { if (STORAGE_KEY[i.id] && localStorage.getItem(STORAGE_KEY[i.id])) s.add(i.id); }); } catch {}
    return s;
  });
  const [modal, setModal] = useState(null);

  useEffect(() => {
    const badge = document.getElementById('int-count-badge');
    if (badge) badge.textContent = `${connected.size}/${INTEGRATIONS.length} bağlı`;
  }, [connected]);

  useEffect(() => {
    const token = intGetToken();
    if (!token) return;
    fetch(`${API}/api/integrations/status`, { headers:{ Authorization:`Bearer ${token}` } })
      .then(r => r.json())
      .then(statuses => {
        setConnected(prev => {
          const s = new Set(prev);
          Object.entries(statuses).forEach(([provider, info]) => { info.connected ? s.add(provider) : s.delete(provider); });
          return s;
        });
      }).catch(() => {});
  }, []);

  const filtered = INTEGRATIONS.filter(it => activeCat === 'Tümü' || it.category === activeCat);

  function handleConnect(id) {
    setModal(INTEGRATIONS.find(i => i.id === id) || null);
  }

  function handleDisconnect(id) {
    const name = INTEGRATIONS.find(i => i.id === id)?.name || 'Bu entegrasyon';
    if (!window.confirm(`${name} bağlantısını kesmek istediğinizden emin misiniz?`)) return;
    const token = intGetToken();
    if (token) fetch(`${API}/api/integrations/${id}/disconnect`, { method:'DELETE', headers:{ Authorization:`Bearer ${token}` } }).catch(() => {});
    try { const k = STORAGE_KEY[id]; if (k) localStorage.removeItem(k); } catch {}
    setConnected(prev => { const s = new Set(prev); s.delete(id); return s; });
  }

  function handleSave(id) { setConnected(prev => new Set([...prev, id])); setModal(null); }

  return (
    <>
      <div className="int-main">
        <div className="int-stats-bar">
          <span className="int-stat"><strong>{filtered.length}</strong>{filtered.length < INTEGRATIONS.length ? ` / ${INTEGRATIONS.length}` : ''} entegrasyon</span>
          <span className="int-stat"><strong>{connected.size}</strong> bağlı</span>
        </div>
        <div className="int-toolbar">
          <div className="cat-pills">
            {CATEGORIES.map(cat => (
              <button key={cat} className={'cat-pill' + (activeCat === cat ? ' active' : '')} onClick={() => setActiveCat(cat)}>{cat}</button>
            ))}
          </div>
          <div className="view-toggle">
            <button className={'view-btn' + (view === 'grid' ? ' active' : '')} onClick={() => setView('grid')} title="Izgara">⊞</button>
            <button className={'view-btn' + (view === 'list' ? ' active' : '')} onClick={() => setView('list')} title="Liste">☰</button>
          </div>
        </div>
        {filtered.length === 0 ? (
          <div className="int-empty-state"><p>Bu kategoride entegrasyon bulunamadı.</p></div>
        ) : (
          <div className={view === 'grid' ? 'cards-grid' : 'cards-list'}>
            {filtered.map(it => (
              <IntegrationCard key={it.id} integration={it} connected={connected}
                onConnect={handleConnect} onDisconnect={handleDisconnect} listView={view === 'list'} />
            ))}
          </div>
        )}
      </div>

      {modal && (
        <ConnectModal integration={modal} onClose={() => setModal(null)} onSave={handleSave} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('int-root')).render(<IntegrationBrowser />);
</script>

function wfToast(msg, ms = 2500) {
  const el = document.getElementById('wf-toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function WFNode({ data, selected }) {
  const integ = WF_INTEGRATIONS.find(i => i.id === data.intId) || {};
  const op    = (integ.ops || []).find(o => o.id === data.opId);
  const isTrig = data.isTrig || op?.isTrig || integ.type === 'trigger';
  const cls = ['wf-flow-card', selected?'selected':'', isTrig?'is-trigger':'',
    data.st==='error'?'st-error':'', data.st==='success'?'st-success':''].filter(Boolean).join(' ');

  return (
    <div className={cls}>
      {!isTrig && <Handle type="target" position={Position.Top} />}
      <div className="wf-fc-head">
        <div className="wf-fc-icon" style={{background: integ.color || '#f4f4f5'}}>{integ.icon || '⚙️'}</div>

function WFApp() {
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [selNode, setSelNode] = useState(null);
  const [wfId,    setWfId]   = useState(null);
  const [rfInst,  setRfInst] = useState(null);
  const idRef = useRef(0);
  const nextId = () => `n${Date.now()}${++idRef.current}`;

  useEffect(() => { wfRenderSidebar(''); }, []);

  useEffect(() => {
    const el = document.getElementById('wf-stats');
    if (el) el.textContent = `${nodes.length} node · ${edges.length} bağlantı`;
    const empty = document.getElementById('wf-empty');
    if (empty) empty.style.display = nodes.length ? 'none' : 'flex';
  }, [nodes.length, edges.length]);

  useEffect(() => {
    const body = document.getElementById('wf-body');
    if (body) body.classList.toggle('panel-open', !!selNode);
  }, [selNode]);

  const onConnect = useCallback(p =>
    setEdges(es => addEdge({...p, type:'smoothstep', animated:false, style:{stroke:'var(--muted)',strokeWidth:1.5}}, es)),
    [setEdges]);

  const onDragOver = useCallback(e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; }, []);

  const onDrop = useCallback(e => {
    e.preventDefault();
    const intId = e.dataTransfer.getData('wf-node');
    if (!intId || !rfInst) return;
    const wrap = document.getElementById('wf-canvas-wrap');
    if (!wrap) return;
    const bounds = wrap.getBoundingClientRect();
    const pos = rfInst.screenToFlowPosition({x: e.clientX - bounds.left, y: e.clientY - bounds.top});
    const integ = WF_INTEGRATIONS.find(i => i.id === intId);
    setNodes(ns => [...ns, {
      id: nextId(), type: 'wfNode', position: pos,
      data: { intId, lbl: integ?.name || intId, opId: integ?.ops?.[0]?.id || '', isTrig: integ?.type === 'trigger', cfg: {} },
    }]);
    wfToast(`${integ?.name} eklendi`);
  }, [rfInst, setNodes]);

  const onNodeClick = useCallback((_, node) => setSelNode(node), []);
  const onPaneClick = useCallback(() => setSelNode(null), []);

  const updateNode = (id, data) => {
    setNodes(ns => ns.map(n => n.id === id ? {...n, data} : n));
    setSelNode(s => s?.id === id ? {...s, data} : s);
  };

  const deleteNode = (id) => {
    setNodes(ns => ns.filter(n => n.id !== id));
    setEdges(es => es.filter(e => e.source !== id && e.target !== id));
    setSelNode(null);
    wfToast('Node silindi');
  };

  useEffect(() => {
    window.wfSave = async () => {
      const name = document.getElementById('wf-name')?.value || 'Workflow';
      const payload = { name, nodes: nodes.map(n => ({id:n.id,...n.data,pos:n.position})), edges };
      try {
        const h = typeof authHeaders === 'function' ? authHeaders() : {};
        const url = wfId ? `${API}/api/workflows/${wfId}` : `${API}/api/workflows`;
        const res = await fetch(url, {method: wfId ? 'PUT' : 'POST', headers:{...h,'Content-Type':'application/json'}, body: JSON.stringify(payload)});
        if (res.ok) {
          const d = await res.json();
          if (d.id) setWfId(d.id);
          const badge = document.getElementById('wf-badge');
          if (badge) { badge.textContent = 'Aktif'; badge.className = 'wf-badge active'; }
          wfToast('✓ Kaydedildi');
        }
      } catch { wfToast('Kaydetme başarısız'); }
    };

    window.wfRun = async () => {
      if (!wfId) { wfToast('Önce kaydedin'); return; }
      setNodes(ns => ns.map(n => ({...n, data:{...n.data, st:'running'}})));
      try {
        const h = typeof authHeaders === 'function' ? authHeaders() : {};
        await fetch(`${API}/api/workflows/${wfId}/run`, {method:'POST', headers:h});
        setNodes(ns => ns.map(n => ({...n, data:{...n.data, st:'success'}})));
        const el = document.getElementById('wf-last-run');
        if (el) el.textContent = 'Son çalışma: ' + new Date().toLocaleTimeString('tr-TR');
        wfToast('✓ Çalıştı');
      } catch {
        setNodes(ns => ns.map(n => ({...n, data:{...n.data, st:'error'}})));
        wfToast('Hata oluştu');
      }
    };

    window.wfNew = () => {
      setNodes([]); setEdges([]); setWfId(null); setSelNode(null);
      const n = document.getElementById('wf-name'); if (n) n.value = 'Yeni Workflow';
      const b = document.getElementById('wf-badge'); if (b) { b.textContent = 'Taslak'; b.className = 'wf-badge draft'; }
    };

    window.wfShowList = async () => {
      document.getElementById('wf-overlay').style.display = 'flex';
      const lb = document.getElementById('wf-list-body');
      lb.innerHTML = '<p style="padding:20px;text-align:center;font-size:13px;color:var(--muted);">Yükleniyor…</p>';
      try {
        const h = typeof authHeaders === 'function' ? authHeaders() : {};
        const res = await fetch(API + '/api/automations', {headers: h});
        const d = await res.json();
        const rules = d.rules || [];
        if (!rules.length) { lb.innerHTML = '<p style="padding:20px;text-align:center;font-size:13px;color:var(--muted);">Henüz workflow yok</p>'; return; }
        lb.innerHTML = rules.map(r => `
          <div class="wf-modal-item" onclick="wfLoadItem('${r.id}','${(r.name||'').replace(/'/g,"\\'")}');wfHideList();">
            <div class="wf-modal-item-ico">⚙️</div>
            <div style="flex:1;"><p style="font-size:13px;font-weight:500;color:var(--ink);margin:0 0 2px;">${r.name||'İsimsiz'}</p><p style="font-size:11px;color:var(--muted);margin:0;">${r.integration||''} · ${r.run_count||0} çalışma</p></div>
            <button class="wf-toggle ${r.enabled?'on':''}" onclick="event.stopPropagation();wfToggle('${r.id}',this)"></button>
          </div>
        `).join('');
      } catch { lb.innerHTML = '<p style="padding:20px;text-align:center;color:var(--muted);">Yüklenemedi</p>'; }
    };

    window.wfHideList   = () => { document.getElementById('wf-overlay').style.display = 'none'; };
    window.wfLoadItem   = (id, name) => { setWfId(id); setNodes([]); setEdges([]); setSelNode(null); const n=document.getElementById('wf-name');if(n)n.value=name; wfToast(`"${name}" yüklendi`); };
    window.wfToggle     = async (id, el) => { el.classList.toggle('on'); const h=typeof authHeaders==='function'?authHeaders():{};await fetch(`${API}/api/automations/${id}/toggle`,{method:'POST',headers:h}).catch(()=>{}); };
    window.wfClosePanel = () => setSelNode(null);
    window.wfFilterNodes= (q) => wfRenderSidebar(q);
  }, [nodes, edges, wfId]);

  return (
    <ReactFlow
      nodes={nodes} edges={edges}
      onNodesChange={onNodesChange} onEdgesChange={onEdgesChange}
      onConnect={onConnect} onInit={setRfInst}
      onDrop={onDrop} onDragOver={onDragOver}
      onNodeClick={onNodeClick} onPaneClick={onPaneClick}
      nodeTypes={WF_NODE_TYPES}
      fitView deleteKeyCode="Delete"
    >
      <Controls/>
      <MiniMap nodeStrokeWidth={3} zoomable pannable/>
      <Background variant={BackgroundVariant.Dots} gap={16} size={1} color="var(--surface-3)"/>
      {selNode && (
        <div style={{position:'absolute',top:0,right:0,bottom:0,width:256,background:'var(--surface)',borderLeft:'0.5px solid var(--line)',zIndex:10,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <WFPanel node={selNode} onUpdate={updateNode} onDelete={deleteNode} onClose={()=>setSelNode(null)}/>
        </div>
      )}
    </ReactFlow>
  );
}

function wfRenderSidebar(q) {
  const el = document.getElementById('wf-node-list');
  if (!el) return;
  const lq = q.toLowerCase();
  const filtered = WF_INTEGRATIONS.filter(i =>
    !lq || i.name.toLowerCase().includes(lq) || i.cat.toLowerCase().includes(lq) ||
    i.ops.some(o => o.label.toLowerCase().includes(lq))
  );
  const cats = [...new Set(filtered.map(i => i.cat))];
  el.innerHTML = cats.map(cat => `
    <span class="wf-cat-label">${cat}</span>
    ${filtered.filter(i => i.cat === cat).map(i => `
      <div class="wf-node-row" draggable="true" ondragstart="event.dataTransfer.setData('wf-node','${i.id}')">
        <div class="wf-node-ico" style="background:${i.color}">${i.icon}</div>
        <div style="flex:1;min-width:0;">
          <p class="wf-node-lbl">${i.name}</p>
          <p class="wf-node-sub">${i.ops.length} operasyon</p>
        </div>
      </div>
    `).join('')}
  `).join('');
}

ReactDOM.createRoot(document.getElementById('wf-rf-root')).render(
  <ReactFlowProvider><WFApp/></ReactFlowProvider>
);
</script>

</body>
</html>
