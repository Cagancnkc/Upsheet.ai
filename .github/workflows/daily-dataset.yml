name: Daily Dataset Generation

on:
  schedule:
    - cron: '0 7 * * *'  # Her gün 10:00 Istanbul (UTC+3)
  workflow_dispatch:       # Manuel tetikleme (test için)

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Generate 100 new dataset examples
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node backend/scripts/generate-dataset.js

      - name: Read generation summary
        id: summary
        run: |
          SUMMARY=$(cat backend/.generation-summary 2>/dev/null || echo "Özet mevcut değil")
          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/rag/dataset.js
          if git diff --staged --quiet; then
            echo "Dataset değişmedi, commit atlanıyor."
          else
            git commit -m "feat: günlük 100 yeni dataset örneği [$(date +%Y-%m-%d)]"
            git push
          fi

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ Mocksheets Dataset Güncellendi — ${{ github.run_number }}. çalışma"
          to: cagancanakci3827@gmail.com
          from: Mocksheets Bot <${{ secrets.GMAIL_USER }}>
          body: |
            Merhaba Cağan!

            Bugünkü otomatik dataset güncellemesi tamamlandı.

            ${{ steps.summary.outputs.text }}

            GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            — Mocksheets Bot
