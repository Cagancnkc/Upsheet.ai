<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="images/logo.png">
<title>Entegrasyonlar — Mocksheets</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#f8f7ff;
  --surface:#ffffff;
  --surface2:#f3f4f6;
  --brand:#7c5cff;
  --brand-soft:rgba(124,92,255,0.1);
  --text:#111827;
  --text-muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --shadow-hover:0 4px 16px rgba(0,0,0,.1),0 12px 32px rgba(0,0,0,.06);
  --radius:14px;
  --radius-sm:8px;
}
[data-theme="dark"]{
  --bg:#0c0c18;
  --surface:#16162a;
  --surface2:#1e1e35;
  --brand-soft:rgba(124,92,255,0.15);
  --text:#e2e8f0;
  --text-muted:#94a3b8;
  --border:#2a2a45;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
  --shadow-hover:0 4px 16px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.2);
}

body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  transition:background .2s,color .2s;
}

/* NAV */
.int-nav{
  display:flex;align-items:center;gap:12px;
  padding:0 24px;height:64px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.nav-logo img{height:72px;width:auto;object-fit:contain;}

.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;
  color:var(--text-muted);text-decoration:none;
  border:1px solid var(--border);background:transparent;
  transition:all .15s;white-space:nowrap;
}
.back-btn:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-soft);}

.theme-btn{
  width:36px;height:36px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  cursor:pointer;font-size:16px;color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.theme-btn:hover{background:var(--surface2);color:var(--text);}

.search-wrap{position:relative;width:240px;}
.search-input{
  width:100%;padding:8px 40px 8px 34px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text);font-size:13px;
  font-family:inherit;outline:none;transition:all .15s;
}
.search-input:focus{border-color:var(--brand);background:var(--surface);}
.search-input::placeholder{color:var(--text-muted);}
.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:13px;pointer-events:none;
}
.search-kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--text-muted);background:var(--surface);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;
  pointer-events:none;
}

/* MAIN */
.int-main{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}

.int-header{margin-bottom:24px;}
.int-header h1{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em;}
.int-header p{font-size:14px;color:var(--text-muted);}

.stats-bar{
  display:flex;gap:24px;padding:12px 0;
  margin-bottom:20px;border-bottom:1px solid var(--border);
}
.stat{font-size:13px;color:var(--text-muted);}
.stat strong{color:var(--text);font-weight:700;}

/* TOOLBAR */
.int-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:20px;flex-wrap:wrap;
}
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;}
.cat-pill{
  padding:5px 14px;border-radius:100px;font-size:12px;font-weight:500;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-muted);cursor:pointer;transition:all .15s;
}
.cat-pill:hover{border-color:var(--brand);color:var(--brand);}
.cat-pill.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.view-toggle{display:flex;gap:4px;}
.view-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  cursor:pointer;color:var(--text-muted);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.view-btn.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);}
.view-btn:hover:not(.active){background:var(--surface2);}

/* CARDS */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
@media(max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.cards-grid{grid-template-columns:1fr;}}

.cards-list{display:flex;flex-direction:column;gap:8px;}

.int-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  cursor:pointer;
  transition:all .2s;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.int-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(124,92,255,0.07) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.int-card:hover{border-color:#c4b5fd;box-shadow:var(--shadow-hover);transform:translateY(-2px);}
.int-card:hover::before{opacity:1;}
.int-card.connected{border-color:#86efac;}
.int-card.coming-soon{opacity:.6;cursor:default;}
.int-card.coming-soon:hover{transform:none;box-shadow:none;border-color:var(--border);}
.int-card.coming-soon::before{display:none;}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.card-icon{
  width:48px;height:48px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.card-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.badge{
  font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 8px;border-radius:100px;
  white-space:nowrap;
}
.badge-pro{background:rgba(124,92,255,0.12);color:var(--brand);}
.badge-free{background:rgba(34,197,94,0.12);color:#16a34a;}
.badge-soon{background:var(--surface2);color:var(--text-muted);}
.badge-connected{background:rgba(34,197,94,0.12);color:#16a34a;}
.badge-popular{background:rgba(251,191,36,0.15);color:#d97706;}

.card-body{flex:1;}
.card-name{font-size:15px;font-weight:700;margin-bottom:6px;}
.card-desc{font-size:12px;color:var(--text-muted);line-height:1.55;}

.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.card-cat{font-size:11px;color:var(--text-muted);}

.connect-btn{
  padding:6px 14px;border-radius:var(--radius-sm);
  font-size:12px;font-weight:600;cursor:pointer;border:none;
  font-family:inherit;transition:all .15s;
}
.connect-btn.btn-connect{background:var(--brand);color:#fff;}
.connect-btn.btn-connect:hover{opacity:.88;}
.connect-btn.btn-disconnect{background:transparent;color:#ef4444;border:1px solid #fca5a5;}
.connect-btn.btn-disconnect:hover{background:#fef2f2;}
.connect-btn.btn-soon{background:var(--surface2);color:var(--text-muted);cursor:default;}

.empty-state{text-align:center;padding:60px 24px;color:var(--text-muted);}
.empty-state p{font-size:14px;}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:24px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.modal-box{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:32px;
  max-width:440px;width:100%;
  box-shadow:0 24px 64px rgba(0,0,0,.2);
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.modal-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.modal-title{font-size:18px;font-weight:700;}
.modal-close{
  margin-left:auto;width:28px;height:28px;
  border:none;background:none;cursor:pointer;color:var(--text-muted);
  font-size:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.modal-close:hover{background:var(--surface2);}
.modal-desc{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:20px;}
.modal-actions{display:flex;gap:10px;}
.modal-btn{
  flex:1;padding:11px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;cursor:pointer;border:none;
  font-family:inherit;transition:all .15s;
}
.modal-btn-primary{background:var(--brand);color:#fff;}
.modal-btn-primary:hover{opacity:.88;}
.modal-btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.modal-btn-secondary:hover{border-color:var(--brand);color:var(--brand);}
</style>
</head>

  const IconComp = Icon[integration.icon];
  return (

function IntegrationCard({ integration, connected, onConnect, onDisconnect, listView }) {
  const isConnected = connected.has(integration.id);
  const ref = useRef(null);
  const IconComp = Icon[integration.icon];

  function handleMouseMove(e) {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%';
    const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + '%';
    ref.current.style.setProperty('--mx', x);
    ref.current.style.setProperty('--my', y);
  }

  const iconEl = (
    <div
      className="card-icon"
      style={{ background: integration.iconBg, width: listView ? 40 : 48, height: listView ? 40 : 48, borderRadius: listView ? 10 : 12, flexShrink: 0 }}
    >
      {IconComp ? <IconComp /> : '🔗'}
    </div>
  );

  const connectBtn = integration.comingSoon ? (
    <button className="connect-btn btn-soon" disabled>Yakında</button>
  ) : isConnected ? (
    <button className="connect-btn btn-disconnect" onClick={e => { e.stopPropagation(); onDisconnect(integration.id); }}>
      Bağlantıyı Kes
    </button>
  ) : (
    <button className="connect-btn btn-connect" onClick={e => { e.stopPropagation(); onConnect(integration.id); }}>
      Bağlan
    </button>
  );

  const cardClass = `int-card${isConnected ? ' connected' : ''}${integration.comingSoon ? ' coming-soon' : ''}`;

  if (listView) {
    return (
      <div
        ref={ref}
        className={cardClass}
        onMouseMove={handleMouseMove}
        style={{ flexDirection: 'row', alignItems: 'center', gap: 16, padding: '14px 20px' }}
      >
        {iconEl}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="card-name" style={{ marginBottom: 3 }}>{integration.name}</div>
          <div className="card-desc">{integration.desc}</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          <span className="card-cat" style={{ marginRight: 4 }}>{integration.category}</span>
          {isConnected && <span className="badge badge-connected">✓ Bağlı</span>}
          {!isConnected && integration.popular && <span className="badge badge-popular">⭐</span>}
          {integration.comingSoon
            ? <span className="badge badge-soon">Yakında</span>
            : <span className={`badge badge-${integration.tier}`}>{integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}</span>
          }
          {connectBtn}
        </div>
      </div>
    );
  }

  return (
    <div ref={ref} className={cardClass} onMouseMove={handleMouseMove}>
      <div className="card-top">
        {iconEl}
        <div className="card-badges">
          {isConnected && <span className="badge badge-connected">✓ Bağlı</span>}
          {!isConnected && integration.popular && <span className="badge badge-popular">⭐ Popüler</span>}
          {integration.comingSoon
            ? <span className="badge badge-soon">Yakında</span>
            : <span className={`badge badge-${integration.tier}`}>{integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}</span>
          }
        </div>
      </div>
      <div className="card-body">
        <div className="card-name">{integration.name}</div>
        <div className="card-desc">{integration.desc}</div>
      </div>
      <div className="card-footer">
        <span className="card-cat">{integration.category}</span>
        {connectBtn}
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaksState] = useState(() => {
    try {
      const saved = localStorage.getItem('ms-int-theme');
      return { ...TWEAK_DEFAULTS, theme: saved || 'light' };
    } catch { return { ...TWEAK_DEFAULTS }; }
  });
  const setTweaks = (key, val) => setTweaksState(prev => ({ ...prev, [key]: val }));

  const [query, setQuery] = useState('');
  const [activeCat, setActiveCat] = useState('Tümü');
  const [view, setView] = useState('grid');
  const [connected, setConnected] = useState(new Set());
  const [modal, setModal] = useState(null);
  const searchRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem('ms-int-theme', tweaks.theme); } catch {}
    document.documentElement.setAttribute('data-theme', tweaks.theme);
  }, [tweaks.theme]);

  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        if (searchRef.current) searchRef.current.focus();
      }
      if (e.key === 'Escape') setModal(null);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const filtered = INTEGRATIONS.filter(it => {
    const matchCat = activeCat === 'Tümü' || it.category === activeCat;
    const q = query.toLowerCase();
    const matchQ = !q || it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q) || it.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  function handleConnect(id) {
    // TODO: POST /api/integrations/connect ile OAuth akışı başlat
    setModal(INTEGRATIONS.find(i => i.id === id) || null);
  }

  function handleDisconnect(id) {
    // TODO: DELETE /api/integrations/:id
    setConnected(prev => { const s = new Set(prev); s.delete(id); return s; });
  }

  function confirmConnect() {
    if (!modal) return;
    // TODO: POST /api/integrations/connect ile OAuth akışı başlat
    setConnected(prev => new Set([...prev, modal.id]));
    setModal(null);
  }

  const availableCount = INTEGRATIONS.filter(i => !i.comingSoon).length;
  const soonCount = INTEGRATIONS.filter(i => i.comingSoon).length;

  return (
    <>
      <nav className="int-nav">
        <a className="nav-logo" href="index.html">
          <img src="images/logo-wordmark.png" alt="Mocksheets" />
        </a>
        <div style={{ flex: 1 }} />
        <div className="search-wrap">
          <span className="search-icon">🔍</span>
          <input
            ref={searchRef}
            className="search-input"
            type="text"
            placeholder="Entegrasyon ara..."
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
          {!query && <span className="search-kbd">⌘K</span>}
        </div>
        <button
          className="theme-btn"
          onClick={() => setTweaks('theme', tweaks.theme === 'light' ? 'dark' : 'light')}
          title="Tema değiştir"
        >
          {tweaks.theme === 'light' ? '🌙' : '☀️'}
        </button>
        <a className="back-btn" href="app.html">← Uygulamaya Dön</a>
      </nav>

      <div className="int-main">
        <div className="int-header">
          <h1>Entegrasyonlar</h1>
          <p>Mocksheets'i favori araçlarınızla bağlayın ve iş akışlarınızı otomatize edin</p>
        </div>

        <div className="stats-bar">
          <span className="stat"><strong>{availableCount}</strong> entegrasyon mevcut</span>
          <span className="stat"><strong>{connected.size}</strong> bağlı</span>
          <span className="stat"><strong>{soonCount}</strong> yakında</span>
        </div>

        <div className="int-toolbar">
          <div className="cat-pills">
            {CATEGORIES.map(cat => (
              <button
                key={cat}
                className={'cat-pill' + (activeCat === cat ? ' active' : '')}
                onClick={() => setActiveCat(cat)}
              >
                {cat}
              </button>
            ))}
          </div>
          <div className="view-toggle">
            <button
              className={'view-btn' + (view === 'grid' ? ' active' : '')}
              onClick={() => setView('grid')}
              title="Izgara görünüm"
            >⊞</button>
            <button
              className={'view-btn' + (view === 'list' ? ' active' : '')}
              onClick={() => setView('list')}
              title="Liste görünüm"
            >☰</button>
          </div>
        </div>

        {filtered.length === 0 ? (
          <div className="empty-state">
            <p>"{query}" için entegrasyon bulunamadı.</p>
          </div>
        ) : (
          <div className={view === 'grid' ? 'cards-grid' : 'cards-list'}>
            {filtered.map(it => (
              <IntegrationCard
                key={it.id}
                integration={it}
                connected={connected}
                onConnect={handleConnect}
                onDisconnect={handleDisconnect}
                listView={view === 'list'}
              />
            ))}
          </div>
        )}
      </div>

      {modal && (
        <ConnectModal
          integration={modal}
          onClose={() => setModal(null)}
          onConfirm={confirmConnect}
        />
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
