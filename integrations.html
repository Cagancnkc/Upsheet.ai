<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='%236B35CF'/><stop offset='1' stop-color='%232B80FF'/></linearGradient></defs><rect width='32' height='32' rx='4' fill='white'/><text x='1' y='27' font-family='Arial Rounded MT Bold,Arial,sans-serif' font-weight='900' font-size='28' fill='url(%23g)'>m</text></svg>">
<title>Entegrasyonlar — Mocksheets</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#f8f7ff;
  --surface:#ffffff;
  --surface2:#f3f4f6;
  --brand:#7c5cff;
  --brand-soft:rgba(124,92,255,0.1);
  --text:#111827;
  --text-muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --shadow-hover:0 4px 16px rgba(0,0,0,.1),0 12px 32px rgba(0,0,0,.06);
  --radius:14px;
  --radius-sm:8px;
}
[data-theme="dark"]{
  --bg:#0c0c18;
  --surface:#16162a;
  --surface2:#1e1e35;
  --brand-soft:rgba(124,92,255,0.15);
  --text:#e2e8f0;
  --text-muted:#94a3b8;
  --border:#2a2a45;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
  --shadow-hover:0 4px 16px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.2);
}

body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  transition:background .2s,color .2s;
}

/* NAV */
.int-nav{
  display:flex;align-items:center;gap:12px;
  padding:0 24px;height:64px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.nav-logo img{height:72px;width:auto;object-fit:contain;}

.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;
  color:var(--text-muted);text-decoration:none;
  border:1px solid var(--border);background:transparent;
  transition:all .15s;white-space:nowrap;
}
.back-btn:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-soft);}

.theme-btn{
  width:36px;height:36px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  cursor:pointer;font-size:16px;color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.theme-btn:hover{background:var(--surface2);color:var(--text);}

.search-wrap{position:relative;width:240px;}
.search-input{
  width:100%;padding:8px 40px 8px 34px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text);font-size:13px;
  font-family:inherit;outline:none;transition:all .15s;
}
.search-input:focus{border-color:var(--brand);background:var(--surface);}
.search-input::placeholder{color:var(--text-muted);}
.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:13px;pointer-events:none;
}
.search-kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--text-muted);background:var(--surface);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;
  pointer-events:none;
}

/* MAIN */
.int-main{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}

.int-header{margin-bottom:24px;}
.int-header h1{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em;}
.int-header p{font-size:14px;color:var(--text-muted);}

.stats-bar{
  display:flex;gap:24px;padding:12px 0;
  margin-bottom:20px;border-bottom:1px solid var(--border);
}
.stat{font-size:13px;color:var(--text-muted);}
.stat strong{color:var(--text);font-weight:700;}

/* TOOLBAR */
.int-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:20px;flex-wrap:wrap;
}
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;}
.cat-pill{
  padding:5px 14px;border-radius:100px;font-size:12px;font-weight:500;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-muted);cursor:pointer;transition:all .15s;
}
.cat-pill:hover{border-color:var(--brand);color:var(--brand);}
.cat-pill.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.view-toggle{display:flex;gap:4px;}
.view-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  cursor:pointer;color:var(--text-muted);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.view-btn.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);}
.view-btn:hover:not(.active){background:var(--surface2);}

/* CARDS */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}
@media(max-width:560px){.cards-grid{grid-template-columns:1fr;}}

.cards-list{display:flex;flex-direction:column;gap:8px;}

.int-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  cursor:pointer;
  transition:all .2s;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.int-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(124,92,255,0.07) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.int-card:hover{border-color:#c4b5fd;box-shadow:var(--shadow-hover);transform:translateY(-3px);}
.int-card:hover::before{opacity:1;}
.int-card.connected{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,0.08);}

/* LOGO */
.card-logo{
  width:52px;height:52px;border-radius:12px;
  background:#fff;padding:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.card-logo img{width:32px;height:32px;object-fit:contain;}
[data-theme="dark"] .card-logo{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.3);}

/* PULSE DOT */
.pulse-dot{
  width:8px;height:8px;background:#22c55e;border-radius:50%;
  animation:pulse 2s ease-in-out infinite;flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

.card-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.badge{
  font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 8px;border-radius:100px;
  white-space:nowrap;
}
.badge-pro{background:rgba(124,92,255,0.12);color:var(--brand);}
.badge-free{background:rgba(34,197,94,0.12);color:#16a34a;}
.badge-connected{background:rgba(34,197,94,0.12);color:#16a34a;display:flex;align-items:center;gap:5px;}
.badge-popular{background:rgba(251,191,36,0.15);color:#d97706;}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.card-body{flex:1;}
.card-name{font-size:15px;font-weight:700;margin-bottom:4px;}
.card-cat{font-size:11px;color:var(--text-muted);margin-bottom:6px;}
.card-desc{font-size:12px;color:var(--text-muted);line-height:1.55;}

.card-footer{display:flex;align-items:center;justify-content:flex-end;margin-top:16px;}

.connect-btn{
  padding:7px 16px;border-radius:var(--radius-sm);
  font-size:12px;font-weight:600;cursor:pointer;border:none;
  font-family:inherit;transition:all .15s;
}
.connect-btn.btn-connect{background:var(--brand);color:#fff;}
.connect-btn.btn-connect:hover{opacity:.88;}
.connect-btn.btn-disconnect{background:transparent;color:#ef4444;border:1px solid #fca5a5;}
.connect-btn.btn-disconnect:hover{background:#fef2f2;}

.empty-state{text-align:center;padding:60px 24px;color:var(--text-muted);}
.empty-state p{font-size:14px;}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:24px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.modal-box{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  max-width:480px;width:100%;
  box-shadow:0 24px 64px rgba(0,0,0,.2);
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.modal-header{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.modal-title{font-size:18px;font-weight:700;}
.modal-close{
  margin-left:auto;width:28px;height:28px;
  border:none;background:none;cursor:pointer;color:var(--text-muted);
  font-size:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.modal-close:hover{background:var(--surface2);}
.modal-divider{border:none;border-top:1px solid var(--border);margin:14px 0 18px;}
.modal-desc{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:18px;}

.modal-form-group{margin-bottom:14px;}
.modal-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.modal-label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.modal-label-link{font-size:11px;color:var(--brand);text-decoration:none;}
.modal-label-link:hover{text-decoration:underline;}
.modal-input{
  width:100%;padding:9px 12px;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text);font-size:13px;
  font-family:inherit;outline:none;transition:border-color .15s;
}
.modal-input:focus{border-color:var(--brand);background:var(--surface);}
.modal-input::placeholder{color:var(--text-muted);}
.modal-hint{font-size:11px;color:var(--text-muted);margin-top:4px;}
.connect-result{padding:10px 12px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:14px;line-height:1.5;}
.connect-result.success{background:rgba(34,197,94,0.1);color:#15803d;border:1px solid #86efac;}
.connect-result.error{background:rgba(239,68,68,0.1);color:#b91c1c;border:1px solid #fca5a5;}
.oauth-info{background:var(--brand-soft);border:1px solid rgba(124,92,255,0.2);border-radius:var(--radius-sm);padding:12px;font-size:13px;line-height:1.6;margin-bottom:16px;}
.modal-actions{display:flex;gap:8px;}
.modal-btn{
  flex:1;padding:11px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;cursor:pointer;border:none;
  font-family:inherit;transition:all .15s;
}
.modal-btn-primary{background:var(--brand);color:#fff;}
.modal-btn-primary:hover:not(:disabled){opacity:.88;}
.modal-btn-primary:disabled{opacity:.5;cursor:default;}
.modal-btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.modal-btn-secondary:hover{border-color:var(--brand);color:var(--brand);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const BACKEND_URL = window.location.hostname === 'localhost'
  ? 'http://localhost:3001'
  : 'https://upsheet-ai.onrender.com';

function getAuthToken() {
  try {
    const sbKey = Object.keys(localStorage).find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
    if (sbKey) { const p = JSON.parse(localStorage.getItem(sbKey)); if (p?.access_token) return p.access_token; }
    const raw = localStorage.getItem('sb-access-token') || localStorage.getItem('supabase.auth.token');
    if (raw) { const p = JSON.parse(raw); return p?.access_token || p?.currentSession?.access_token || null; }
    return null;
  } catch { return null; }
}

const STORAGE_KEY = {
  'slack':         'int_slack',
  'ms-teams':      'int_teams',
  'make':          'int_make',
  'zapier':        'int_zapier',
  'webhook':       'int_webhook',
  'notion':        'int_notion',
  'airtable':      'int_airtable',
  'trello':        'int_trello',
  'google-sheets': 'int_sheets',
  'google-drive':  'int_drive',
};

const INT_CONFIG = {
  'slack': {
    type: 'webhook',
    docsUrl: 'https://api.slack.com/messaging/webhooks',
    fields: [{ key: 'url', label: 'Webhook URL', placeholder: 'https://hooks.slack.com/services/...' }],
  },
  'ms-teams': {
    type: 'webhook',
    docsUrl: 'https://learn.microsoft.com/en-us/microsoftteams/platform/webhooks-and-connectors/how-to/add-incoming-webhook',
    fields: [{ key: 'url', label: 'Webhook URL', placeholder: 'https://outlook.office.com/webhook/...' }],
  },
  'make': {
    type: 'webhook',
    docsUrl: 'https://www.make.com/en/help/tools/webhooks',
    fields: [{ key: 'url', label: 'Make Webhook URL', placeholder: 'https://hook.eu1.make.com/...' }],
  },
  'zapier': {
    type: 'webhook',
    docsUrl: 'https://zapier.com/help/create/code-webhooks/trigger-zaps-from-webhooks',
    fields: [{ key: 'url', label: 'Zap Webhook URL', placeholder: 'https://hooks.zapier.com/hooks/catch/...' }],
  },
  'webhook': {
    type: 'webhook',
    fields: [
      { key: 'url', label: 'Hedef URL', placeholder: 'https://...' },
      { key: 'secret', label: 'İmza Sırrı (opsiyonel)', placeholder: 'HMAC secret — boş bırakılabilir' },
    ],
  },
  'notion': {
    type: 'token',
    docsUrl: 'https://www.notion.so/my-integrations',
    fields: [
      { key: 'token', label: 'Integration Token', placeholder: 'secret_...', hint: 'notion.so/my-integrations adresinden alın' },
      { key: 'dbId', label: 'Veritabanı ID', placeholder: 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx', hint: 'Notion veritabanı URL\'inden kopyalayın' },
    ],
  },
  'airtable': {
    type: 'token',
    docsUrl: 'https://airtable.com/create/tokens',
    fields: [
      { key: 'token', label: 'Personal Access Token', placeholder: 'pat...', hint: 'airtable.com/create/tokens adresinden oluşturun' },
      { key: 'baseId', label: 'Base ID', placeholder: 'appXXXXXXXX' },
      { key: 'tableName', label: 'Tablo Adı', placeholder: 'Table 1' },
    ],
  },
  'trello': {
    type: 'token',
    docsUrl: 'https://trello.com/app-key',
    fields: [
      { key: 'apiKey', label: 'API Key', placeholder: '...', hint: 'trello.com/power-ups/admin adresinden alın' },
      { key: 'token', label: 'Token', placeholder: '...' },
      { key: 'boardId', label: 'Board ID', placeholder: '...', hint: 'Board URL\'indeki son kısım' },
    ],
  },
  'google-sheets': { type: 'oauth', authPath: '/api/integrations/sheets/auth', label: 'Google' },
  'google-drive':  { type: 'oauth', authPath: '/api/integrations/drive/auth',  label: 'Google' },
};

async function testIntegration(id, form, token) {
  const h = { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
  const base = BACKEND_URL;
  switch (id) {
    case 'slack':
      return fetch(`${base}/api/integrations/slack/test`, { method: 'POST', headers: h, body: JSON.stringify({ webhookUrl: form.url }) });
    case 'ms-teams':
      return fetch(`${base}/api/integrations/teams/test`, { method: 'POST', headers: h, body: JSON.stringify({ webhookUrl: form.url }) });
    case 'make':
      return fetch(`${base}/api/integrations/make/trigger`, { method: 'POST', headers: h, body: JSON.stringify({ webhookUrl: form.url, event: 'test', data: { test: true } }) });
    case 'zapier':
    case 'webhook':
      return fetch(`${base}/api/integrations/webhook/send`, { method: 'POST', headers: h, body: JSON.stringify({ url: form.url, secret: form.secret || '', event: 'test', data: { test: true } }) });
    case 'notion':
      return fetch(`${base}/api/integrations/notion/test`, { method: 'POST', headers: h, body: JSON.stringify({ token: form.token, databaseId: form.dbId }) });
    case 'airtable':
      return fetch(`${base}/api/integrations/airtable/test`, { method: 'POST', headers: h, body: JSON.stringify({ token: form.token, baseId: form.baseId, tableName: form.tableName || 'Table 1' }) });
    case 'trello':
      return fetch(`${base}/api/integrations/trello/test`, { method: 'POST', headers: h, body: JSON.stringify({ apiKey: form.apiKey, token: form.token, boardId: form.boardId }) });
    default: return null;
  }
}

// Webhook için generic SVG ikonu
function WebhookIcon() {
  return (
    <svg viewBox="0 0 32 32" width="32" height="32" fill="none">
      <circle cx="16" cy="16" r="16" fill="#FF4A00"/>
      <path d="M10 14.5 C10 11.5 12.7 9 16 9 S22 11.5 22 14.5" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round"/>
      <path d="M7 20.5 C7 15.5 11 12 16 12 S25 15.5 25 20.5" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round"/>
      <circle cx="16" cy="23" r="2.5" fill="#fff"/>
    </svg>
  );
}

function ConnectModal({ integration, onClose, onSave }) {
  const cfg = INT_CONFIG[integration.id];
  const storageKey = STORAGE_KEY[integration.id];
  const [form, setForm] = useState(() => {
    try { const s = storageKey && localStorage.getItem(storageKey); return s ? JSON.parse(s) : {}; }
    catch { return {}; }
  });
  const [connecting, setConnecting] = useState(false);
  const [result, setResult] = useState(null);
  const [oauthWaiting, setOauthWaiting] = useState(false);

  const updateField = (key, val) => { setForm(prev => ({ ...prev, [key]: val })); setResult(null); };

  const sensitiveKeys = ['token', 'apiKey', 'secret'];
  const requiredKeys = cfg?.fields?.filter(f => f.key !== 'secret' && f.key !== 'tableName').map(f => f.key) || [];
  const hasRequired = requiredKeys.every(k => form[k]?.trim());

  async function handleConnect() {
    setConnecting(true); setResult(null);
    try {
      const res = await testIntegration(integration.id, form, getAuthToken());
      if (!res) { setResult({ ok: false, msg: 'Test desteklenmiyor.' }); return; }
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        if (storageKey) localStorage.setItem(storageKey, JSON.stringify(form));
        setResult({ ok: true, msg: 'Bağlantı başarılı! Kaydedildi.' });
        setTimeout(() => { onSave(integration.id, form); }, 800);
        return;
      } else {
        setResult({ ok: false, msg: data.error || 'Bağlantı başarısız. Bilgileri kontrol edin.' });
      }
    } catch (e) {
      setResult({ ok: false, msg: e.message || 'Bağlantı kurulamadı.' });
    } finally {
      setConnecting(false);
    }
  }

  function handleOAuth() {
    const popup = window.open(`${BACKEND_URL}${cfg.authPath}`, 'oauth', 'width=520,height=640');
    setOauthWaiting(true);
    function onMsg(e) {
      if (e.origin !== new URL(BACKEND_URL).origin) return;
      if (!e.data || typeof e.data !== 'object') return;
      const { access_token, refresh_token, expiry, token } = e.data;
      const at = access_token || token;
      if (!at) return;
      const saved = { access_token: at, refresh_token: refresh_token || null, expiry: expiry || null };
      if (storageKey) localStorage.setItem(storageKey, JSON.stringify(saved));
      window.removeEventListener('message', onMsg);
      setOauthWaiting(false);
      onSave(integration.id, saved);
    }
    window.addEventListener('message', onMsg);
    const poll = setInterval(() => {
      try { if (popup.closed) { clearInterval(poll); window.removeEventListener('message', onMsg); setOauthWaiting(false); } }
      catch {}
    }, 500);
  }

  const isOauth = cfg?.type === 'oauth';
  const logoEl = integration.id === 'webhook'
    ? <WebhookIcon />
    : <img src={integration.logo} width="32" height="32" style={{ objectFit: 'contain' }} alt={integration.name} />;

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div className="modal-header">
          <div className="card-logo" style={{ width: 44, height: 44, borderRadius: 10, padding: 8 }}>
            {logoEl}
          </div>
          <div>
            <div className="modal-title">{integration.name}</div>
            <span className={`badge badge-${integration.tier}`} style={{ fontSize: 10 }}>
              {integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}
            </span>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <hr className="modal-divider" />

        {isOauth ? (
          <>
            <div className="oauth-info">
              {integration.name} hesabınızı güvenli OAuth 2.0 ile bağlayın. Aşağıdaki butona tıkladığınızda açılan pencerede <strong>{cfg.label}</strong> hesabınızla giriş yapın ve gerekli izinleri verin.
            </div>
            <div className="modal-actions">
              <button className="modal-btn modal-btn-secondary" onClick={onClose}>Vazgeç</button>
              <button className="modal-btn modal-btn-primary" onClick={handleOAuth} disabled={oauthWaiting}>
                {oauthWaiting ? 'Bekleniyor...' : `${cfg.label} ile Bağlan →`}
              </button>
            </div>
          </>
        ) : (
          <>
            {cfg?.fields?.map(field => (
              <div key={field.key} className="modal-form-group">
                <div className="modal-label-row">
                  <label className="modal-label">{field.label}</label>
                  {cfg.docsUrl && field === cfg.fields[0] && (
                    <a className="modal-label-link" href={cfg.docsUrl} target="_blank" rel="noopener noreferrer">
                      Nasıl alınır? →
                    </a>
                  )}
                </div>
                <input
                  className="modal-input"
                  type={sensitiveKeys.includes(field.key) ? 'password' : 'text'}
                  placeholder={field.placeholder || ''}
                  value={form[field.key] || ''}
                  onChange={e => updateField(field.key, e.target.value)}
                  autoComplete="off"
                />
                {field.hint && <div className="modal-hint">{field.hint}</div>}
              </div>
            ))}
            {result && (
              <div className={`connect-result ${result.ok ? 'success' : 'error'}`}>
                {result.ok ? '✓ ' : '✗ '}{result.msg}
              </div>
            )}
            <div className="modal-actions">
              <button className="modal-btn modal-btn-secondary" onClick={onClose}>Vazgeç</button>
              <button className="modal-btn modal-btn-primary" onClick={handleConnect} disabled={connecting || !hasRequired}>
                {connecting ? 'Bağlanıyor...' : 'Bağlan →'}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function IntegrationCard({ integration, connected, onConnect, onDisconnect, listView }) {
  const isConnected = connected.has(integration.id);
  const ref = useRef(null);

  function handleMouseMove(e) {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%';
    const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + '%';
    ref.current.style.setProperty('--mx', x);
    ref.current.style.setProperty('--my', y);
  }

  const logoEl = integration.id === 'webhook'
    ? <WebhookIcon />
    : <img src={integration.logo} width="32" height="32" style={{ objectFit: 'contain' }} alt={integration.name} />;

  const logoContainer = (
    <div className="card-logo" style={listView ? { width: 44, height: 44, borderRadius: 10, padding: 8 } : {}}>
      {logoEl}
    </div>
  );

  const connectBtn = isConnected ? (
    <button className="connect-btn btn-disconnect" onClick={e => { e.stopPropagation(); onDisconnect(integration.id); }}>
      Bağlantıyı Kes
    </button>
  ) : (
    <button className="connect-btn btn-connect" onClick={e => { e.stopPropagation(); onConnect(integration.id); }}>
      Bağlan →
    </button>
  );

  const cardClass = `int-card${isConnected ? ' connected' : ''}`;

  if (listView) {
    return (
      <div ref={ref} className={cardClass} onMouseMove={handleMouseMove}
        style={{ flexDirection: 'row', alignItems: 'center', gap: 16, padding: '14px 20px' }}>
        {logoContainer}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="card-name" style={{ marginBottom: 2 }}>{integration.name}</div>
          <div className="card-desc">{integration.desc}</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          {isConnected && <div className="pulse-dot" />}
          {!isConnected && integration.popular && <span className="badge badge-popular">⭐</span>}
          <span className={`badge badge-${integration.tier}`}>{integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}</span>
          {connectBtn}
        </div>
      </div>
    );
  }

  return (
    <div ref={ref} className={cardClass} onMouseMove={handleMouseMove}>
      <div className="card-top">
        {logoContainer}
        <div className="card-badges">
          {isConnected && (
            <span className="badge badge-connected">
              <div className="pulse-dot" style={{ width: 6, height: 6 }} />Bağlı
            </span>
          )}
          {!isConnected && integration.popular && <span className="badge badge-popular">⭐ Popüler</span>}
          <span className={`badge badge-${integration.tier}`}>{integration.tier === 'free' ? 'Ücretsiz' : 'Pro'}</span>
        </div>
      </div>
      <div className="card-body">
        <div className="card-name">{integration.name}</div>
        <div className="card-cat">{integration.category}</div>
        <div className="card-desc">{integration.desc}</div>
      </div>
      <div className="card-footer">
        {connectBtn}
      </div>
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('ms-int-theme') || 'light'; } catch { return 'light'; }
  });
  const [query, setQuery] = useState('');
  const [activeCat, setActiveCat] = useState('Tümü');
  const [view, setView] = useState('grid');
  const [connected, setConnected] = useState(() => {
    const s = new Set();
    try { INTEGRATIONS.forEach(i => { if (STORAGE_KEY[i.id] && localStorage.getItem(STORAGE_KEY[i.id])) s.add(i.id); }); }
    catch {}
    return s;
  });
  const [modal, setModal] = useState(null);
  const [userPlan, setUserPlan] = useState(null);
  const [showUpgrade, setShowUpgrade] = useState(false);
  const searchRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem('ms-int-theme', theme); } catch {}
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); if (searchRef.current) searchRef.current.focus(); }
      if (e.key === 'Escape') { setModal(null); setShowUpgrade(false); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => {
    const token = getAuthToken();
    if (!token) return;
    fetch(`${BACKEND_URL}/api/usage`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(d => { if (d.plan) setUserPlan(d.plan); })
      .catch(() => {});
  }, []);

  const filtered = INTEGRATIONS.filter(it => {
    const matchCat = activeCat === 'Tümü' || it.category === activeCat;
    const q = query.toLowerCase();
    const matchQ = !q || it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q) || it.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  function handleConnect(id) {
    if (userPlan !== 'pro' && userPlan !== 'business') { setShowUpgrade(true); return; }
    setModal(INTEGRATIONS.find(i => i.id === id) || null);
  }

  function handleDisconnect(id) {
    const name = INTEGRATIONS.find(i => i.id === id)?.name || 'Bu entegrasyon';
    if (!window.confirm(`${name} bağlantısını kesmek istediğinizden emin misiniz?`)) return;
    try { const k = STORAGE_KEY[id]; if (k) localStorage.removeItem(k); } catch {}
    setConnected(prev => { const s = new Set(prev); s.delete(id); return s; });
  }

  function handleSave(id) {
    setConnected(prev => new Set([...prev, id]));
    setModal(null);
  }

  return (
    <>
      <nav className="int-nav">
        <a className="nav-logo" href="index.html">
          <img src="images/logo-wordmark.png" alt="Mocksheets" />
        </a>
        <div style={{ flex: 1 }} />
        <div className="search-wrap">
          <span className="search-icon">🔍</span>
          <input
            ref={searchRef}
            className="search-input"
            type="text"
            placeholder="Entegrasyon ara..."
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
          {!query && <span className="search-kbd">⌘K</span>}
        </div>
        <button className="theme-btn" onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} title="Tema değiştir">
          {theme === 'light' ? '🌙' : '☀️'}
        </button>
        <a className="back-btn" href="app.html">← Uygulamaya Dön</a>
      </nav>

      <div className="int-main">
        <div className="int-header">
          <h1>Entegrasyonlar</h1>
          <p>Mocksheets'i favori araçlarınızla bağlayın ve iş akışlarınızı otomatize edin</p>
        </div>

        <div className="stats-bar">
          <span className="stat"><strong>{filtered.length}</strong>{filtered.length < INTEGRATIONS.length ? ` / ${INTEGRATIONS.length}` : ''} entegrasyon</span>
          <span className="stat"><strong>{connected.size}</strong> bağlı</span>
        </div>

        <div className="int-toolbar">
          <div className="cat-pills">
            {CATEGORIES.map(cat => (
              <button key={cat} className={'cat-pill' + (activeCat === cat ? ' active' : '')} onClick={() => setActiveCat(cat)}>
                {cat}
              </button>
            ))}
          </div>
          <div className="view-toggle">
            <button className={'view-btn' + (view === 'grid' ? ' active' : '')} onClick={() => setView('grid')} title="Izgara">⊞</button>
            <button className={'view-btn' + (view === 'list' ? ' active' : '')} onClick={() => setView('list')} title="Liste">☰</button>
          </div>
        </div>

        {filtered.length === 0 ? (
          <div className="empty-state">
            <p>"{query}" için entegrasyon bulunamadı.</p>
          </div>
        ) : (
          <div className={view === 'grid' ? 'cards-grid' : 'cards-list'}>
            {filtered.map(it => (
              <IntegrationCard
                key={it.id}
                integration={it}
                connected={connected}
                onConnect={handleConnect}
                onDisconnect={handleDisconnect}
                listView={view === 'list'}
              />
            ))}
          </div>
        )}
      </div>

      {showUpgrade && (
        <div className="modal-overlay" onClick={() => setShowUpgrade(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{fontSize:32}}>⭐</div>
              <div>
                <div className="modal-title">Pro Plan Gerekli</div>
                <span className="badge badge-pro" style={{fontSize:10}}>Pro</span>
              </div>
              <button className="modal-close" onClick={() => setShowUpgrade(false)}>×</button>
            </div>
            <hr className="modal-divider"/>
            <p style={{fontSize:14,color:'var(--text-muted)',lineHeight:1.6,marginBottom:20}}>
              Tüm entegrasyonlar <strong>Pro</strong> veya <strong>İş</strong> planı gerektirir.
              Slack, Notion, Google Drive ve diğer entegrasyonlara erişmek için planınızı yükseltin.
            </p>
            <div className="modal-actions">
              <button className="modal-btn modal-btn-secondary" onClick={() => setShowUpgrade(false)}>Vazgeç</button>
              <a className="modal-btn modal-btn-primary" href="index.html#pricing" style={{textDecoration:'none',textAlign:'center'}}>Planı Yükselt →</a>
            </div>
          </div>
        </div>
      )}

      {modal && (
        <ConnectModal
          integration={modal}
          onClose={() => setModal(null)}
          onSave={handleSave}
        />
      )}
    </>
  );
}

root.render(<App />);
