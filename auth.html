  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

      background: #09090b;

    #root { min-height: 100vh; }

    /* Animations */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes msgFade {
      from { opacity: 0; transform: translateY(6px); }

    @keyframes fadeIn {

    .form-card {

<body class="dark">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useId, forwardRef } = React;

    /* ── Supabase client — window.supabase (CDN global) ── */
    const { createClient } = window.supabase;
    const sb = createClient(
      'https://ogizbfzoywylljvnidak.supabase.co',
      'sb_publishable_WauaqVsDx_vgHsilyJl0gg_1DvfSIzC'
    );

    /* ── Session kontrolü React render öncesi ── */
    sb.auth.getSession().then(({ data }) => {
      if (data?.session) window.location.href = 'app.html';
    });

    /* ── Icons (Lucide React) ── */
    const EyeIcon    = LucideReact.Eye;
    const EyeOffIcon = LucideReact.EyeOff;

    /* ── cn: clsx (CDN) as drop-in ── */
    function cn(...args) {
      return typeof clsx !== 'undefined' ? clsx(...args) : args.filter(Boolean).join(' ');
    }

    /* ── cva: class-variance-authority (inline) ── */
    function cva(base, opts = {}) {
      return (props = {}) => {
        const { variants = {}, defaultVariants = {} } = opts;
        let cls = base;
        for (const k in variants) {
          const v = props[k] ?? defaultVariants[k];
          if (v != null && variants[k][v]) cls += ' ' + variants[k][v];
        }
        if (props.className) cls += ' ' + props.className;
        return cls;
      };
    }

    /* ── Slot: @radix-ui/react-slot (inline) ── */
    const Slot = forwardRef(({ children, ...props }, ref) =>
      React.isValidElement(children) ? React.cloneElement(children, { ...props, ref }) : null
    );

    /* ── Label ── */
    const Label = forwardRef(({ className, ...props }, ref) => (
      <label ref={ref} className={cn('text-xs font-medium text-[#9ca3af] mb-1 block', className)} {...props} />
    ));

    /* ── Input ── */
    const Input = forwardRef(({ className, type, ...props }, ref) => (
      <input
        type={type}
        ref={ref}
        className={cn(
          'auth-input flex h-11 w-full rounded-xl border border-[#2a2a2a] bg-[#0a0a0a] px-4 py-2 text-sm text-white placeholder:text-[#4a4a5a] transition-all duration-150 disabled:cursor-not-allowed disabled:opacity-50',
          className
        )}
        {...props}
      />
    ));

    /* ── PasswordInput ── */
    const PasswordInput = forwardRef(({ className, label, ...props }, ref) => {
      const id = useId();
      const [show, setShow] = useState(false);
      return (
        <div className="grid w-full gap-1.5">
          {label && <Label htmlFor={id}>{label}</Label>}
          <div className="relative">
            <Input
              id={id}
              type={show ? 'text' : 'password'}
              className={cn('pr-10', className)}
              ref={ref}
              {...props}
            />
            <button
              type="button"
              onClick={() => setShow(p => !p)}
              className="absolute inset-y-0 right-0 flex h-full w-10 items-center justify-center text-[#4a4a5a] hover:text-[#9ca3af] focus:outline-none transition-colors"
              aria-label={show ? 'Şifreyi gizle' : 'Şifreyi göster'}
            >
              {show ? <EyeOffIcon size={16} /> : <EyeIcon size={16} />}
            </button>
          </div>
        </div>
      );
    });

    /* ── Typewriter ── */
    function Typewriter({ text, speed = 80, cursor = '|', loop = false, deleteSpeed = 40, delay = 1500 }) {
      const arr = Array.isArray(text) ? text : [text];
      const [display,  setDisplay]  = useState('');
      const [charIdx,  setCharIdx]  = useState(0);
      const [arrIdx,   setArrIdx]   = useState(0);
      const [deleting, setDeleting] = useState(false);
      const current = arr[arrIdx] || '';

      useEffect(() => {
        const t = setTimeout(() => {
          if (!deleting) {
            if (charIdx < current.length) {
              setDisplay(d => d + current[charIdx]);
              setCharIdx(i => i + 1);
            } else if (loop) {
              setTimeout(() => setDeleting(true), delay);
            }
          } else {
            if (display.length > 0) {
              setDisplay(d => d.slice(0, -1));
            } else {
              setDeleting(false);
              setCharIdx(0);
              setArrIdx(a => (a + 1) % arr.length);
            }
          }
        }, deleting ? deleteSpeed : speed);
        return () => clearTimeout(t);
      }, [display, charIdx, arrIdx, deleting, current]);

      return (
        <span>
          {display}
          <span className="animate-pulse">{cursor}</span>
        </span>
      );
    }

    /* ── Hata mesajlarını Türkçeleştir ── */
    function translateError(msg) {
      if (!msg) return 'Bir hata oluştu, tekrar deneyin';
      if (msg.includes('Invalid login credentials'))     return 'E-posta veya şifre hatalı';
      if (msg.includes('Email not confirmed'))           return 'E-postanızı doğrulamanız gerekiyor. Gelen kutunuzu kontrol edin.';
      if (msg.includes('User already registered'))       return 'Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.';
      if (msg.includes('Password should be at least'))   return 'Şifre en az 6 karakter olmalı';
      if (msg.includes('Unable to validate email'))      return 'Geçersiz e-posta adresi';
      if (msg.includes('invalid'))                       return 'Geçersiz e-posta adresi';
      if (msg.includes('Too many requests') || msg.includes('rate limit')) return 'Çok fazla deneme yaptınız. Lütfen biraz bekleyin.';
      return 'İşlem başarısız: ' + msg;
    }

    /* ── Spinner ── */
    function Spinner() {
      return (
        <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
      );
    }

    /* ── SignInForm ── */
    function SignInForm() {
      const [email,    setEmail]    = useState('');
      const [password, setPassword] = useState('');
      const [loading,  setLoading]  = useState(false);
      const [error,    setError]    = useState('');

      const handleSignIn = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const { data, error: err } = await sb.auth.signInWithPassword({
            email:    email.trim(),
            password: password,
          });
          if (err) {
            setError(translateError(err.message));
            return;
          }
          if (data.session) {
            window.location.href = 'app.html';
          }
        } catch (err) {
          setError('Beklenmeyen bir hata oluştu. Tekrar deneyin.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <form onSubmit={handleSignIn} autoComplete="on" className="flex flex-col gap-4">
          <div className="grid gap-1.5">
            <Label htmlFor="si-email">E-posta</Label>
            <Input
              id="si-email"
              name="email"
              type="email"
              placeholder="ornek@mail.com"
              required
              autoComplete="email"
              value={email}
              onChange={e => setEmail(e.target.value)}
            />
          </div>

          <PasswordInput
            label="Şifre"
            name="password"
            placeholder="Şifreniz"
            required
            autoComplete="current-password"
            value={password}
            onChange={e => setPassword(e.target.value)}
          />

          {error && (
            <p className="text-xs text-[#ef4444] text-center py-1 px-3 rounded-lg bg-[#ef4444]/8 border border-[#ef4444]/20">
              {error}
            </p>
          )}

          <button
            type="submit"
            disabled={loading}
            className="btn-primary-auth mt-1 h-11 w-full rounded-xl bg-[#f97316] text-white text-sm font-semibold transition-all duration-150 disabled:opacity-70 flex items-center justify-center gap-2"
          >
            {loading ? <><Spinner /> Giriş yapılıyor...</> : 'Giriş Yap →'}
          </button>
        </form>
      );
    }

    /* ── SignUpForm ── */
    function SignUpForm({ onToggle }) {
      const [name,            setName]          = useState('');
      const [email,           setEmail]         = useState('');
      const [password,        setPassword]      = useState('');
      const [confirmPassword, setConfirmPw]     = useState('');
      const [loading,         setLoading]       = useState(false);
      const [error,           setError]         = useState('');
      const [success,         setSuccess]       = useState(false);

      const handleSignUp = async (e) => {
        e.preventDefault();
        setError('');

        // Client-side validasyon
        if (!email.includes('@')) {
          setError('Geçerli bir e-posta adresi girin');
          return;
        }
        if (password.length < 6) {
          setError('Şifre en az 6 karakter olmalı');
          return;
        }
        if (password !== confirmPassword) {
          setError('Şifreler eşleşmiyor');
          return;
        }

        setLoading(true);
        try {
          const { data, error: err } = await sb.auth.signUp({
            email:   email.trim(),
            password: password,
            options: {
              data: {
                full_name: name.trim() || email.split('@')[0],
              },
            },
          });

          if (err) {
            setError(translateError(err.message));
            return;
          }

          // Email confirmation açık → doğrulama e-postası gönderildi
          if (data.user && !data.session) {
            setSuccess(true);
            return;
          }

          // Email confirmation kapalı → direkt giriş
          if (data.session) {
            window.location.href = 'app.html';
          }
        } catch (err) {
          setError('Beklenmeyen bir hata oluştu. Tekrar deneyin.');
        } finally {
          setLoading(false);
        }
      };

      if (success) {
        return (
          <div className="flex flex-col items-center gap-5 text-center py-4">
            <div className="w-16 h-16 rounded-full bg-[#f0fdf4] border-2 border-[#22c55e] flex items-center justify-center text-2xl">
              📧
            </div>
            <div>
              <h2 className="text-xl font-bold text-white mb-2" style={{ fontFamily: 'Sora, sans-serif' }}>
                Doğrulama e-postası gönderildi!
              </h2>
              <p className="text-sm text-[#6b7280] leading-relaxed">
                <strong className="text-[#9ca3af]">{email}</strong> adresine bir doğrulama linki gönderdik.<br />
                Gelen kutunuzu (ve spam klasörünü) kontrol edin.
              </p>
            </div>
            <button
              type="button"
              onClick={onToggle}
              className="text-sm text-[#f97316] hover:underline underline-offset-4 transition-colors bg-transparent border-none cursor-pointer"
            >
              ← Giriş sayfasına dön
            </button>
          </div>
        );
      }

      return (
        <form onSubmit={handleSignUp} autoComplete="on" className="flex flex-col gap-4">
          <div className="grid gap-1.5">
            <Label htmlFor="su-name">Ad Soyad</Label>
            <Input
              id="su-name"
              name="name"
              type="text"
              placeholder="Ad Soyad"
              autoComplete="name"
              value={name}
              onChange={e => setName(e.target.value)}
            />
          </div>

          <div className="grid gap-1.5">
            <Label htmlFor="su-email">E-posta</Label>
            <Input
              id="su-email"
              name="email"
              type="email"
              placeholder="ornek@mail.com"
              required
              autoComplete="email"
              value={email}
              onChange={e => setEmail(e.target.value)}
            />
          </div>

          <PasswordInput
            label="Şifre"
            name="password"
            placeholder="En az 6 karakter"
            required
            autoComplete="new-password"
            value={password}
            onChange={e => setPassword(e.target.value)}
          />

          <PasswordInput
            label="Şifreyi Onayla"
            name="confirmPassword"
            placeholder="Şifrenizi tekrar girin"
            required
            autoComplete="new-password"
            value={confirmPassword}
            onChange={e => setConfirmPw(e.target.value)}
          />

          {error && (
            <p className="text-xs text-[#ef4444] text-center py-1 px-3 rounded-lg bg-[#ef4444]/8 border border-[#ef4444]/20">
              {error}
            </p>
          )}

          <button
            type="submit"
            disabled={loading}
            className="btn-primary-auth mt-1 h-11 w-full rounded-xl bg-[#f97316] text-white text-sm font-semibold transition-all duration-150 disabled:opacity-70 flex items-center justify-center gap-2"
          >
            {loading ? <><Spinner /> Hesap oluşturuluyor...</> : 'Kayıt Ol →'}
          </button>
        </form>
      );
    }

    /* ── AuthFormContainer ── */
    function AuthFormContainer({ isSignIn, onToggle }) {
      async function handleGoogleLogin() {
        await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/app.html' },
        });
      }

      return (
        <div className="grid gap-5 w-full">
          {/* 1. Heading */}
          <div className="flex flex-col items-center gap-1.5 text-center">
            <h1 className="text-2xl font-bold text-white" style={{ fontFamily: 'Sora, sans-serif' }}>
              {isSignIn ? 'Tekrar hoş geldin' : 'Hesabını oluştur'}
            </h1>
            <p className="text-sm text-[#6b7280]">
              {isSignIn ? 'E-posta ile giriş yap' : 'Bilgilerini girerek başla'}
            </p>
          </div>

          {/* 2. Google button (primary action) */}
          <div className="flex flex-col gap-1.5">
            <button
              type="button"
              onClick={handleGoogleLogin}
              className="flex h-12 w-full items-center justify-center gap-3 rounded-xl border-[1.5px] border-[#e2e8f0] bg-white text-[15px] font-semibold text-[#111111] hover:shadow-md hover:-translate-y-0.5 transition-all duration-200"
            >
              <img
                src="https://www.svgrepo.com/show/475656/google-color.svg"
                alt="Google"
                width="18" height="18"
              />
              Google ile Devam Et
            </button>
            <p className="text-center text-[11px] text-[#4a4a5a]">
              🔒 Google şifrenizi görmüyoruz
            </p>
          </div>

          {/* 3. VEYA divider */}
          <div style={{ display:'flex', alignItems:'center', gap:'12px', margin:'0' }}>
            <div style={{ flex:1, height:'1px', background:'#1f1f1f' }} />
            <span style={{ fontSize:'12px', color:'#4a4a5a', fontWeight:500, letterSpacing:'.05em' }}>VEYA</span>
            <div style={{ flex:1, height:'1px', background:'#1f1f1f' }} />
          </div>

          {/* 4. Form fields + submit */}
          {isSignIn ? <SignInForm /> : <SignUpForm onToggle={onToggle} />}

          {/* 5. Toggle link */}
          <p className="text-center text-sm text-[#6b7280]">
            {isSignIn ? 'Hesabın yok mu?' : 'Zaten hesabın var mı?'}{' '}
            <button
              type="button"
              onClick={onToggle}
              className="font-semibold text-[#f97316] hover:underline underline-offset-4 bg-transparent border-none cursor-pointer transition-colors"
            >
              {isSignIn ? 'Kayıt ol' : 'Giriş yap'}
            </button>
          </p>
        </div>
      );
    }

    /* ── MockChat ── */
    function MockChat() {
      const messages = [
        { from: 'user', text: 'Aylık satış raporunu hazırla' },
        { from: 'ai',   text: 'Analiz ediyorum... ✓' },
        { from: 'ai',   text: '312 satır işlendi, 4 anomali bulundu 📊' },
        { from: 'user', text: 'Anomalileri kırmızıya boya' },
        { from: 'ai',   text: 'Tamamlandı ✓' },
      ];
      return (
        <div className="rounded-2xl border border-[#1f1f1f] bg-[#0d0d0d] p-4 w-full max-w-sm">
          <div className="flex items-center gap-2 mb-4 pb-3 border-b border-[#1a1a1a]">
            <div className="w-6 h-6 rounded-lg bg-[#f97316] flex items-center justify-center text-white text-xs font-bold flex-shrink-0">AI</div>
            <span className="text-xs font-medium text-[#6b7280] uppercase tracking-wider">AI Asistan</span>
            <div className="ml-auto w-2 h-2 rounded-full bg-[#22c55e]"></div>
          </div>
          <div className="flex flex-col gap-2">
            {messages.map((m, i) => (
              <div key={i} className={`msg flex ${m.from === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`text-xs px-3 py-2 rounded-2xl max-w-[85%] leading-relaxed ${
                  m.from === 'user'
                    ? 'bg-[#f97316] text-white rounded-tr-sm'
                    : 'bg-[#1a1a1a] text-[#d1d5db] rounded-tl-sm'
                }`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ── Right panel quotes ── */
    const QUOTES = {
      signIn: {
        text: '"Pazartesi raporları artık 8 dakika sürüyor."',
        cite: '— Upsheet kullanıcısı, Finans Analisti',
      },
      signUp: {
        text: '"847 kişi bekleme listesindeydi. Şimdi siz de içerisindesiniz."',
        cite: '— Upsheet Ekibi',
      },
    };

    /* ── AuthUI ── */
    function AuthUI() {
      const [isSignIn, setIsSignIn] = useState(true);
      const quote = isSignIn ? QUOTES.signIn : QUOTES.signUp;

      return (
        <div className="w-full min-h-screen bg-[#09090b] text-white md:grid md:grid-cols-2">

          {/* ── LEFT PANEL: Form ── */}
          <div
            className="flex min-h-screen items-center justify-center p-6 md:min-h-full md:py-12 relative overflow-hidden"
            style={{
              backgroundImage: 'radial-gradient(circle, #2a2a2a 1px, transparent 1px)',
              backgroundSize: '28px 28px',
            }}
          >
            {/* Orange glow overlay */}
            <div
              className="absolute inset-0 pointer-events-none"
              style={{ background: 'radial-gradient(ellipse at 20% 50%, rgba(249,115,22,0.07) 0%, transparent 60%)' }}
            />

            <div className="auth-left-content relative z-10 w-full flex flex-col items-center gap-6" style={{ maxWidth: '400px' }}>
              {/* Logo */}
              <a href="index.html" className="flex items-center gap-2 text-white no-underline" style={{ textDecoration: 'none' }}>
                <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'6px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'4px' }}>
                    <div style={{ width:'36px', height:'36px', flexShrink:0 }}>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style={{ width:'100%', height:'100%', borderRadius:'8px' }}>
                        <rect width="100" height="100" fill="black"/>
                        <path d="M 30 65 Q 28 40 50 28 Q 65 22 75 32 L 68 40 Q 60 33 50 37 Q 35 45 36 63 Z" fill="white"/>
                      </svg>
                    </div>
                    <span style={{ fontSize:'20px', fontWeight:700, color:'#ffffff', letterSpacing:'-0.5px', fontFamily:'Sora, sans-serif' }}>Upsheet</span>
                  </div>
                  <span style={{ fontSize:'13px', color:'#94a3b8' }}>Excel'i AI ile yönet</span>
                </div>
              </a>

              {/* Badge */}
              <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-[#f97316]/30 bg-[#f97316]/8 text-xs font-medium text-[#f97316]">
                <span>847 kişi bekleme listesine katıldı 🔥</span>
              </div>

              {/* Form Card */}
              <div
                key={isSignIn ? 'signin' : 'signup'}
                className="form-card w-full rounded-[20px] border border-[#1f1f1f] bg-[#111111] p-10"
              >
                <AuthFormContainer isSignIn={isSignIn} onToggle={() => setIsSignIn(p => !p)} />
              </div>

              {/* Footer */}
              <p className="text-center text-[11px] text-[#4a4a5a] px-4">
                Kaydolarak{' '}
                <span className="underline underline-offset-2 cursor-pointer hover:text-[#6b7280]">Gizlilik Politikası</span>'nı
                {' '}kabul etmiş olursunuz.
              </p>
            </div>
          </div>

          {/* ── RIGHT PANEL: Visual (desktop only) ── */}
          <div className="hidden md:flex flex-col bg-[#0a0a0a] border-l border-[#1f1f1f] relative overflow-hidden">
            {/* Subtle dot pattern */}
            <div
              className="absolute inset-0 pointer-events-none opacity-40"
              style={{
                backgroundImage: 'radial-gradient(circle, #1f1f1f 1px, transparent 1px)',
                backgroundSize: '32px 32px',
              }}
            />
            {/* Top right glow */}
            <div
              className="absolute top-0 right-0 w-96 h-96 pointer-events-none"
              style={{ background: 'radial-gradient(ellipse at 80% 10%, rgba(249,115,22,0.06) 0%, transparent 60%)' }}
            />

            <div className="relative z-10 flex flex-col justify-center h-full px-12 py-16 gap-10">
              {/* Quote */}
              <div className="flex flex-col gap-3">
                <blockquote>
                  <p className="text-xl font-semibold text-white italic leading-relaxed" style={{ fontFamily: 'Sora, sans-serif' }}>
                    {quote.text}
                  </p>
                  <cite className="block text-sm text-[#6b7280] mt-2 not-italic">
                    {quote.cite}
                  </cite>
                </blockquote>
              </div>

              {/* Mock chat */}
              <MockChat />

              {/* Metrics */}
              <div className="flex items-center gap-6">
                {[
                  { val: '847+', label: 'Bekleme Listesinde' },
                  { val: '4.9/5', label: 'Beta Kullanıcı Puanı' },
                  { val: '%87', label: 'Zaman Tasarrufu' },
                ].map((m, i) => (
                  <div key={i} className="flex flex-col gap-0.5">
                    <span className="text-lg font-bold text-white" style={{ fontFamily: 'Sora, sans-serif' }}>{m.val}</span>
                    <span className="text-xs text-[#4a4a5a]">{m.label}</span>
                  </div>
                ))}
              </div>

              {/* Typewriter */}
              <div className="text-sm font-medium text-[#f97316]" style={{ fontFamily: 'Sora, sans-serif' }}>
                <Typewriter
                  text={['Formül hataları bitti.', 'Raporlar artık 8 dakika.', 'Türkçe yaz, AI yapsın.']}
                  speed={70}
                  loop={true}
                  deleteSpeed={35}
                  delay={2000}
                />
              </div>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthUI />);
  </script>
</body>
</html>
