<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ödeme Başarılı — Mocksheet</title>
<link rel="stylesheet" href="landing.css">
<style>
body { background: #F7F7F5; display: flex; align-items: center;
       justify-content: center; min-height: 100vh; }
.success-box {
  background: white; border-radius: 20px; padding: 48px;
  text-align: center; max-width: 480px; width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,.1);
  border: 1.5px solid #E5E7EB;
}
.success-icon { font-size: 64px; margin-bottom: 20px; }
.success-title { font-size: 28px; font-weight: 800;
                  letter-spacing: -.02em; margin-bottom: 12px; color: #111827; }
.success-desc { font-size: 16px; color: #6B7280;
                 line-height: 1.6; margin-bottom: 32px; }
.plan-badge {
  display: inline-block; background: #D1FAE5; color: #065F46;
  font-size: 14px; font-weight: 700; padding: 8px 20px;
  border-radius: 100px; margin-bottom: 28px;
}
.btn-start {
  display: inline-flex; align-items: center; gap: 8px;
  background: #111827; color: white;
  padding: 14px 32px; border-radius: 100px;
  font-size: 15px; font-weight: 600;
  text-decoration: none; transition: opacity .2s;
}
.btn-start:hover { opacity: .85; }
.loading { color: #9CA3AF; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<div class="success-box">
  <div class="success-icon">🎉</div>
  <div class="success-title">Ödeme Başarılı!</div>
  <div class="success-desc">
    Mocksheet'e hoş geldiniz.<br>
    Hesabınız aktive edildi.
  </div>
  <div class="plan-badge" id="plan-badge">⭐ Pro Plan</div>
  <br>
  <a href="app.html" class="btn-start">
    ⚡ Uygulamayı Aç
  </a>
  <div class="loading" id="loading-text">
    Abonelik bilgileri kontrol ediliyor...
  </div>
</div>
<script src="payment.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');

  if (sessionId) {
    const API = window.location.hostname === 'localhost'
      ? 'http://localhost:3001'
      : 'https://upsheet-ai.onrender.com';

    try {
      const res = await fetch(API + '/api/stripe/subscription/' + sessionId);
      const data = await res.json();

      if (data.plan) {
        const planNames = {
          pro: '⭐ Pro Plan',
          business: '🏢 İş Planı'
        };
        document.getElementById('plan-badge').textContent =
          planNames[data.plan] || data.plan;

        localStorage.setItem('subscription_plan', data.plan);
        localStorage.setItem('subscription_period', data.period);
        if (data.customerId) {
          localStorage.setItem('stripe_customer_id', data.customerId);
        }
      }
    } catch (e) {}

    document.getElementById('loading-text').textContent =
      '✓ Hesabınız aktive edildi';
  }
});
</script>
</body>
</html>
